<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <?!= include('Styles'); ?>
</head>
<body>

<div class="page-head">
  <div class="crumb">
    <span>ข้อมูลหลัก</span><span class="sep">›</span>
    <b>ผู้จัดจำหน่าย</b>
    <span class="badge badge-mute" id="recordCount">—</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-ghost btn-icon" title="สลับความหนาแน่นแถว" onclick="toggleDensity()">≡</button>
    <button class="btn btn-ghost" onclick="loadTable()">🔄 รีเฟรช</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ เพิ่มผู้จำหน่าย</button>
  </div>
</div>

<div class="page-body">
  <div class="card">
    <div class="toolbar">
      <div class="search">
        <span class="ico">⌕</span>
        <input type="text" id="searchInput" class="input" placeholder="ค้นหาชื่อ / รหัส / เบอร์โทร" oninput="onSearch()" autocomplete="off">
      </div>
      <span class="count" id="filterInfo"></span>
    </div>

    <div class="xlf-filter-summary" id="xlfSummary">
      <span id="xlfSummaryText"></span>
      <button type="button" onclick="XLF.clearAll(TABLE_KEY); renderRows();">ล้างตัวกรองทั้งหมด</button>
    </div>

    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:44px"><col style="width:90px"><col style="width:160px"><col style="width:120px">
          <col style="width:115px"><col style="width:150px"><col><col style="width:150px">
          <col style="width:90px"><col style="width:90px">
        </colgroup>
        <thead id="theadMain"></thead>
        <tbody id="tbodyMain"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══ Modal: เพิ่ม / แก้ไข ═══ -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box" style="width:640px">
    <div class="modal-header">
      <span id="modalTitle">➕ เพิ่มผู้จำหน่าย</span>
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
    </div>
    <form id="mainForm" onsubmit="handleSubmit(event)">
      <div class="modal-body">
        <div class="section-label">ข้อมูลผู้จำหน่าย</div>
        <div class="form-grid">
          <div class="form-group">
            <label>รหัสผู้จำหน่าย</label>
            <input type="text" id="fDocId" class="form-control" disabled placeholder="สร้างอัตโนมัติ">
          </div>
          <div class="form-group">
            <label>ชื่อผู้จำหน่าย *</label>
            <input type="text" id="fVendorName" class="form-control" required placeholder="กรอกชื่อผู้จำหน่าย..." oninput="clearErr('fVendorName')">
            <span class="field-error" id="err_fVendorName">กรุณากรอกชื่อผู้จำหน่าย</span>
          </div>
          <div class="form-group">
            <label>ชื่อผู้ติดต่อ</label>
            <input type="text" id="fContactName" class="form-control" placeholder="กรอกชื่อผู้ติดต่อ...">
          </div>
          <div class="form-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="text" id="fPhone" class="form-control" placeholder="0xx-xxx-xxxx" maxlength="12" oninput="formatPhoneInput(this)">
          </div>
          <div class="form-group full">
            <label>อีเมล</label>
            <input type="email" id="fEmail" class="form-control" placeholder="name@example.com">
          </div>
        </div>

        <div class="section-label">ที่อยู่ (มาตรฐาน)</div>
        <div class="form-grid">
          <div class="form-group">
            <label>เลขที่</label>
            <input type="text" id="fAddressNo" class="form-control" placeholder="เช่น 82-86">
          </div>
          <div class="form-group">
            <label>หมู่</label>
            <input type="text" id="fAddressMoo" class="form-control" placeholder="เช่น 3">
          </div>
          <div class="form-group full">
            <label>ถนน</label>
            <input type="text" id="fAddressRoad" class="form-control" placeholder="(ถ้ามี)">
          </div>
          <div class="form-group">
            <label>จังหวัด</label>
            <select id="fProvince" class="form-control select" onchange="onProvinceChange('f')">
              <option value="">-- เลือกจังหวัด --</option>
            </select>
          </div>
          <div class="form-group">
            <label>อำเภอ/เขต</label>
            <select id="fDistrict" class="form-control select" onchange="onDistrictChange('f')" disabled>
              <option value="">-- เลือกจังหวัดก่อน --</option>
            </select>
          </div>
          <div class="form-group">
            <label>ตำบล/แขวง</label>
            <select id="fSubdistrict" class="form-control select" onchange="onSubdistrictChange('f')" disabled>
              <option value="">-- เลือกอำเภอก่อน --</option>
            </select>
          </div>
          <div class="form-group">
            <label>รหัสไปรษณีย์</label>
            <input type="text" id="fPostalCode" class="form-control" maxlength="5" placeholder="เติมอัตโนมัติ" readonly style="background:var(--line-soft)">
          </div>
        </div>

        <div class="section-label">ภาษี &amp; สถานะ</div>
        <div class="form-grid">
          <div class="form-group">
            <label>เลขประจำตัวผู้เสียภาษีอากร *</label>
            <input type="text" id="fTaxId" class="form-control" required placeholder="13 หลัก" maxlength="13" oninput="formatTaxIdInput(this)">
            <div class="field-hint">บังคับกรอก 13 หลัก — จำเป็นสำหรับออกใบกำกับภาษี</div>
          </div>
          <div class="form-group">
            <label>สาขา *</label>
            <input type="text" id="fBranch" class="form-control" required placeholder="เช่น สำนักงานใหญ่ หรือ สาขาที่ 00001" value="สำนักงานใหญ่">
            <div class="field-hint">ถ้าไม่มีสาขาย่อย ให้ระบุ "สำนักงานใหญ่"</div>
          </div>
          <div class="form-group full">
            <label>สถานะผู้จำหน่าย</label>
            <select id="fStatus" class="form-control select">
              <option value="Active">✅ Active — ใช้งานอยู่</option>
              <option value="Inactive">❌ Inactive — ปิดใช้งาน</option>
            </select>
          </div>
        </div>

        <div id="modalAlert" class="modal-alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('editModal')">ยกเลิก</button>
        <button type="submit" class="btn btn-primary" id="btnSave">💾 บันทึก</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══ Modal: ยืนยันลบ ═══ -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box" style="width:420px">
    <div class="modal-body" style="text-align:center;padding:30px 24px 18px">
      <div class="confirm-ic">🗑️</div>
      <h3 style="margin:15px 0 5px;color:var(--ink);font-size:18px;font-weight:600">ยืนยันการลบ?</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 15px">ลบแล้วกู้คืนไม่ได้ และสินค้าที่อ้างอิงผู้จำหน่ายนี้จะแสดงเป็นค่าว่าง</p>
      <div class="confirm-card" id="deleteTarget"></div>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button type="button" class="btn btn-ghost" style="min-width:100px" onclick="closeModal('deleteModal')">ยกเลิก</button>
      <button type="button" class="btn btn-danger" style="min-width:120px" id="btnDelete" onclick="execDelete()">🗑️ ลบข้อมูล</button>
    </div>
  </div>
</div>

<script>
  var AUTH_TOKEN  = "<?= authToken ?>";
  var WEB_APP_URL = "<?= webAppUrl ?>";

  var TABLE_KEY   = 'vendors';
  var ENTITY      = 'ผู้จำหน่าย';
  var API         = { list:'getVendorsFull', save:'saveVendor', del:'deleteVendor' };
  var COLS        = [
    { col:'id',           label:'รหัส' },
    { col:'Vendor_name',  label:'ชื่อผู้จำหน่าย' },
    { col:'Contact_name', label:'ผู้ติดต่อ' },
    { col:'Phone',        label:'เบอร์โทร' },
    { col:'Email',        label:'อีเมล' },
    { col:'Address',      label:'ที่อยู่' },
    { col:'_taxStatus',   label:'เลขผู้เสียภาษี' },
    { col:'Status',       label:'สถานะ' }
  ];

  var cache=[], editingId=null, deleteId=null, searchTimer=null;

  window.onload = function(){
    initDensity();
    document.getElementById('tbodyMain').innerHTML = skeletonRows(10,5);
    renderHead();
    loadTable();
    populateProvinceDropdown('f');
  };

  XLF.bindHeaderClicks('#theadMain', function(){ return cache; }, renderRows);

  function renderHead(){
    document.getElementById('theadMain').innerHTML =
      '<tr><th class="text-center">#</th>' +
      COLS.map(function(c){ return XLF.th(c.label, TABLE_KEY, c.col); }).join('') +
      '<th class="text-center col-sticky-right">จัดการ</th></tr>';
  }

  function loadTable(){
    document.getElementById('recordCount').innerText='กำลังโหลด';
    document.getElementById('tbodyMain').innerHTML = skeletonRows(10,5);
    callApi(API.list, [], function(data){
      cache = (data || []).map(function(item){
        item._taxStatus = (item.Tax_ID && item.Tax_ID.length === 13) ? 'มีเลขผู้เสียภาษีแล้ว' : 'ยังไม่มีเลขผู้เสียภาษี';
        return item;
      });
      renderRows();
    }, function(err){
      document.getElementById('tbodyMain').innerHTML = emptyStateHtml(10,{
        icon:'⚠️', title:'โหลดข้อมูลไม่สำเร็จ', sub:JSON.stringify(err),
        actions:[{label:'ลองอีกครั้ง',primary:true,onclick:'loadTable()'}]
      });
      document.getElementById('recordCount').innerText='ผิดพลาด';
    });
  }

  function onSearch(){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(renderRows,150);
  }

  function formatPhoneDisplay(raw){
    if(!raw) return '';
    var d=String(raw).replace(/\D/g,'').slice(0,10);
    if(d.length<=3) return d;
    if(d.length<=6) return d.slice(0,3)+'-'+d.slice(3);
    return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6,10);
  }

  function renderRows(){
    renderHead();
    var q=document.getElementById('searchInput').value.toLowerCase().trim();
    var searched = !q ? cache.slice() : cache.filter(function(it){
      return (it.id+it.Vendor_name+it.Contact_name+it.Phone+it.Email+it.Address).toLowerCase().indexOf(q)>-1;
    });

    var rows = XLF.apply(TABLE_KEY, searched, COLS);

    var labels={}; COLS.forEach(function(c){labels[c.col]=c.label;});
    var sum=document.getElementById('xlfSummary');
    if(XLF.anyActiveFilter(TABLE_KEY)){
      sum.classList.add('show');
      document.getElementById('xlfSummaryText').innerText='กรองอยู่ '+rows.length+' จาก '+cache.length+' รายการ — '+XLF.activeSummary(TABLE_KEY,labels);
    } else sum.classList.remove('show');

    document.getElementById('recordCount').innerText = cache.length + ' รายการ';
    document.getElementById('filterInfo').innerText = (q||XLF.anyActiveFilter(TABLE_KEY)) ? 'แสดง '+rows.length+' รายการ' : '';

    var tbody=document.getElementById('tbodyMain');
    if(!rows.length){
      tbody.innerHTML = cache.length
        ? emptyStateHtml(10,{ title:'ไม่พบรายการที่ตรงกับที่ค้นหา', sub:'ลองลดคำค้นหรือล้างตัวกรอง',
            actions:[{label:'ล้างตัวกรอง',onclick:'clearAllFilters()'},{label:'+ เพิ่ม'+ENTITY,primary:true,onclick:'openAddModal()'}] })
        : emptyStateHtml(10,{ icon:'🏢', title:'ยังไม่มีข้อมูล'+ENTITY, sub:'เพิ่มรายการแรกเพื่อเริ่มใช้งาน',
            actions:[{label:'+ เพิ่ม'+ENTITY,primary:true,onclick:'openAddModal()'}] });
      return;
    }

    tbody.innerHTML = rows.map(function(it,i){
      var isActive = (it.Status||'Active')==='Active';
      var statusHtml = '<span class="badge '+(isActive?'badge-ok':'badge-danger')+'">'+(isActive?'✅ Active':'❌ Inactive')+'</span>';
      var phoneTxt = it.Phone ? formatPhoneDisplay(it.Phone) : '<span class="cell-empty">—</span>';
      var emailTxt = it.Email ? esc(it.Email) : '<span class="cell-empty">—</span>';
      var addrTxt  = it.Address ? esc(it.Address) : '<span class="cell-empty">—</span>';
      var taxTxt = (it.Tax_ID && it.Tax_ID.length===13)
        ? '<div class="mono" style="font-size:12px">'+esc(it.Tax_ID)+'</div><div style="font-size:11px;color:var(--muted)">'+esc(it.Branch||'สำนักงานใหญ่')+'</div>'
        : '<span class="badge badge-warn">⚠️ ยังไม่มีเลขผู้เสียภาษี</span>';
      return '<tr>'+
        '<td class="text-center"><span class="rownum">'+(i+1)+'</span></td>'+
        '<td><span class="chip-code">'+esc(it.id)+'</span></td>'+
        '<td style="font-weight:600;color:var(--ink)">'+esc(it.Vendor_name)+'</td>'+
        '<td>'+esc(it.Contact_name||'—')+'</td>'+
        '<td>'+phoneTxt+'</td>'+
        '<td>'+emailTxt+'</td>'+
        '<td>'+addrTxt+'</td>'+
        '<td>'+taxTxt+'</td>'+
        '<td>'+statusHtml+'</td>'+
        '<td class="text-center col-sticky-right"><span class="row-actions">'+
          '<button class="btn btn-icon edit" title="แก้ไข" onclick="openEditModal(\''+escJs(it.id)+'\')">✏️</button>'+
          '<button class="btn btn-icon del" title="ลบ" onclick="confirmDelete(\''+escJs(it.id)+'\')">🗑️</button>'+
        '</span></td>'+
      '</tr>';
    }).join('');
  }

  function clearAllFilters(){
    XLF.clearAll(TABLE_KEY);
    document.getElementById('searchInput').value='';
    renderRows();
  }

  function clearErr(id){
    document.getElementById(id).classList.remove('is-invalid');
    document.getElementById('err_'+id).classList.remove('show');
  }

  /* ══ ที่อยู่แบบ Cascading Dropdown — จังหวัด → อำเภอ → ตำบล → รหัสไปรษณีย์ ══ */
  function populateProvinceDropdown(prefix){
    var sel=document.getElementById(prefix+'Province');
    if(!sel) return;
    if(typeof THAI_ADDRESS_DATA==='undefined' || !THAI_ADDRESS_DATA.length){
      sel.innerHTML='<option value="">-- ไม่พบข้อมูลจังหวัด (โหลดไม่สำเร็จ) --</option>';
      return;
    }
    var current=sel.value;
    sel.innerHTML='<option value="">-- เลือกจังหวัด --</option>'+
      THAI_ADDRESS_DATA.map(function(p){ return '<option value="'+esc(p[0])+'">'+esc(p[0])+'</option>'; }).join('');
    if(current) sel.value=current;
  }

  function onProvinceChange(prefix){
    var provinceName=document.getElementById(prefix+'Province').value;
    var districtSel=document.getElementById(prefix+'District');
    var subdistrictSel=document.getElementById(prefix+'Subdistrict');
    var postalInput=document.getElementById(prefix+'PostalCode');

    districtSel.innerHTML='<option value="">-- เลือกอำเภอ --</option>';
    subdistrictSel.innerHTML='<option value="">-- เลือกอำเภอก่อน --</option>';
    postalInput.value='';
    districtSel.disabled=true;
    subdistrictSel.disabled=true;

    if(typeof THAI_ADDRESS_DATA==='undefined') return;
    var province=THAI_ADDRESS_DATA.find(function(p){ return p[0]===provinceName; });
    if(!province){ districtSel.innerHTML='<option value="">-- เลือกจังหวัดก่อน --</option>'; return; }

    var amphures=province[1].slice().sort(function(a,b){ return a[0].localeCompare(b[0],'th'); });
    districtSel.innerHTML='<option value="">-- เลือกอำเภอ --</option>'+
      amphures.map(function(a){ return '<option value="'+esc(a[0])+'">'+esc(a[0])+'</option>'; }).join('');
    districtSel.disabled=false;
  }

  function onDistrictChange(prefix){
    var provinceName=document.getElementById(prefix+'Province').value;
    var districtName=document.getElementById(prefix+'District').value;
    var subdistrictSel=document.getElementById(prefix+'Subdistrict');
    var postalInput=document.getElementById(prefix+'PostalCode');

    subdistrictSel.innerHTML='<option value="">-- เลือกตำบล --</option>';
    postalInput.value='';
    subdistrictSel.disabled=true;

    if(typeof THAI_ADDRESS_DATA==='undefined') return;
    var province=THAI_ADDRESS_DATA.find(function(p){ return p[0]===provinceName; });
    if(!province) return;
    var amphure=province[1].find(function(a){ return a[0]===districtName; });
    if(!amphure){ subdistrictSel.innerHTML='<option value="">-- เลือกอำเภอก่อน --</option>'; return; }

    var tambons=amphure[1].slice().sort(function(a,b){ return a[0].localeCompare(b[0],'th'); });
    subdistrictSel.innerHTML='<option value="">-- เลือกตำบล --</option>'+
      tambons.map(function(t){ return '<option value="'+esc(t[0])+'" data-zip="'+t[1]+'">'+esc(t[0])+'</option>'; }).join('');
    subdistrictSel.disabled=false;
  }

  function onSubdistrictChange(prefix){
    var sel=document.getElementById(prefix+'Subdistrict');
    var postalInput=document.getElementById(prefix+'PostalCode');
    var opt=sel.options[sel.selectedIndex];
    postalInput.value=(opt && opt.dataset.zip) ? opt.dataset.zip : '';
  }

  function setAddressDropdowns(prefix, provinceVal, districtVal, subdistrictVal, postalVal){
    var provinceSel=document.getElementById(prefix+'Province');
    provinceSel.value=provinceVal||'';
    onProvinceChange(prefix);

    if(districtVal){
      var districtSel=document.getElementById(prefix+'District');
      districtSel.value=districtVal;
      onDistrictChange(prefix);

      if(subdistrictVal){
        var subdistrictSel=document.getElementById(prefix+'Subdistrict');
        subdistrictSel.value=subdistrictVal;
        onSubdistrictChange(prefix);
      }
    }
    if(postalVal && !document.getElementById(prefix+'PostalCode').value){
      document.getElementById(prefix+'PostalCode').value=postalVal;
    }
  }

  function formatPhoneInput(el){
    var digits=el.value.replace(/\D/g,'').slice(0,10);
    var formatted=digits;
    if(digits.length>6) formatted=digits.slice(0,3)+'-'+digits.slice(3,6)+'-'+digits.slice(6,10);
    else if(digits.length>3) formatted=digits.slice(0,3)+'-'+digits.slice(3,6);
    el.value=formatted;
  }

  function formatTaxIdInput(el){
    el.value=el.value.replace(/\D/g,'').slice(0,13);
  }

  /* ── เพิ่ม / แก้ไข ── */
  function resetForm(){
    document.getElementById('mainForm').reset();
    document.getElementById('fDocId').value='';
    document.getElementById('fVendorName').value='';
    document.getElementById('fContactName').value='';
    document.getElementById('fPhone').value='';
    document.getElementById('fEmail').value='';
    ['fAddressNo','fAddressMoo','fAddressRoad'].forEach(function(id){ document.getElementById(id).value=''; });
    document.getElementById('fTaxId').value='';
    document.getElementById('fBranch').value='สำนักงานใหญ่';
    document.getElementById('fStatus').value='Active';
    setAddressDropdowns('f','','','','');
    clearErr('fVendorName');
  }

  function openAddModal(){
    editingId=null;
    resetForm();
    document.getElementById('modalTitle').innerText='➕ เพิ่ม'+ENTITY;
    document.getElementById('btnSave').innerHTML='💾 บันทึก';
    document.getElementById('modalAlert').className='modal-alert';
    openModal('editModal');
  }

  function openEditModal(id){
    var it=cache.find(function(x){return x.id===id;});
    if(!it){ toast('ไม่พบข้อมูล','err'); return; }
    editingId=id;
    resetForm();
    document.getElementById('fDocId').value=it.id;
    document.getElementById('fVendorName').value=it.Vendor_name||'';
    document.getElementById('fContactName').value=it.Contact_name||'';
    document.getElementById('fPhone').value=formatPhoneDisplay(it.Phone||'');
    document.getElementById('fEmail').value=it.Email||'';
    document.getElementById('fAddressNo').value=it.Address_No||'';
    document.getElementById('fAddressMoo').value=it.Address_Moo||'';
    document.getElementById('fAddressRoad').value=it.Address_Road||'';
    setAddressDropdowns('f', it.Province, it.District, it.Subdistrict, it.Postal_Code);
    document.getElementById('fTaxId').value=it.Tax_ID||'';
    document.getElementById('fBranch').value=it.Branch||'สำนักงานใหญ่';
    document.getElementById('fStatus').value=it.Status||'Active';
    document.getElementById('modalTitle').innerText='✏️ แก้ไข'+ENTITY+' ('+id+')';
    document.getElementById('btnSave').innerHTML='💾 บันทึกการแก้ไข';
    document.getElementById('modalAlert').className='modal-alert';
    openModal('editModal');
  }

  function handleSubmit(e){
    e.preventDefault();
    var alertEl=document.getElementById('modalAlert');
    alertEl.className='modal-alert';

    var vendorName=document.getElementById('fVendorName').value.trim();
    if(!vendorName){
      document.getElementById('fVendorName').classList.add('is-invalid');
      document.getElementById('err_fVendorName').classList.add('show');
      return;
    }

    var taxIdVal=document.getElementById('fTaxId').value.trim();
    if(taxIdVal.length!==13){
      alertEl.className='modal-alert error';
      alertEl.innerText='❌ เลขประจำตัวผู้เสียภาษีอากรต้องมี 13 หลัก (กรอกมา '+taxIdVal.length+' หลัก)';
      return;
    }

    var payload = {
      docId       : editingId || null,
      vendorName  : vendorName,
      contact     : document.getElementById('fContactName').value.trim(),
      phone       : document.getElementById('fPhone').value.trim(),
      email       : document.getElementById('fEmail').value.trim(),
      addressNo   : document.getElementById('fAddressNo').value.trim(),
      addressMoo  : document.getElementById('fAddressMoo').value.trim(),
      addressRoad : document.getElementById('fAddressRoad').value.trim(),
      subdistrict : document.getElementById('fSubdistrict').value.trim(),
      district    : document.getElementById('fDistrict').value.trim(),
      province    : document.getElementById('fProvince').value.trim(),
      postalCode  : document.getElementById('fPostalCode').value.trim(),
      taxId       : taxIdVal,
      branch      : document.getElementById('fBranch').value.trim() || 'สำนักงานใหญ่',
      status      : document.getElementById('fStatus').value
    };

    var btn=document.getElementById('btnSave');
    btnBusy(btn);

    callApi(API.save, [payload], function(res){
      btnDone(btn);
      if(res && res.success){
        closeModal('editModal');
        toast((editingId?'แก้ไข':'เพิ่ม')+ENTITY+' “'+vendorName+'” เรียบร้อย');
        loadTable();
        notifyParentRefreshDropdowns();
      } else {
        alertEl.className='modal-alert error';
        alertEl.innerText='❌ '+((res&&res.message)||'บันทึกไม่สำเร็จ');
      }
    }, function(err){
      btnDone(btn);
      alertEl.className='modal-alert error';
      alertEl.innerText='❌ '+JSON.stringify(err);
    });
  }

  /* ── ลบ ── */
  function confirmDelete(id){
    var it=cache.find(function(x){return x.id===id;});
    if(!it){ toast('ไม่พบข้อมูล','err'); return; }
    deleteId=id;
    var title=(it.Vendor_name||'ไม่ระบุชื่อ')+(it.Contact_name?' (ผู้ติดต่อ: '+it.Contact_name+')':'');
    document.getElementById('deleteTarget').innerHTML=
      '<div style="font-size:14px;font-weight:600;color:var(--ink)">'+esc(title)+'</div>'+
      '<span class="chip-code" style="margin-top:5px">'+esc(it.id)+'</span>';
    var btn=document.getElementById('btnDelete');
    btnDone(btn); btn.innerHTML='🗑️ ลบข้อมูล';
    openModal('deleteModal');
  }

  function execDelete(){
    if(!deleteId) return;
    var btn=document.getElementById('btnDelete');
    btnBusy(btn,'กำลังลบ...');
    callApi(API.del,[deleteId],function(res){
      btnDone(btn);
      closeModal('deleteModal');
      if(res && res.success){
        toast('ลบ'+ENTITY+'เรียบร้อย');
        loadTable();
        notifyParentRefreshDropdowns();
      } else {
        swyError('ลบไม่สำเร็จ',(res&&res.message)||'');
      }
      deleteId=null;
    },function(err){
      btnDone(btn); closeModal('deleteModal');
      swyError('เกิดข้อผิดพลาด',esc(JSON.stringify(err)));
    });
  }
</script>
</body>
</html>
