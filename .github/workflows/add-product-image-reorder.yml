name: Add product image reorder

on:
  push:
    paths:
      - 'tools/add_product_image_reorder.py'
      - '.github/workflows/add-product-image-reorder.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch backend
        run: python tools/add_product_image_reorder.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('Code.gs').read_text(encoding='utf-8')
          assert 'function moveProductImage(productCode, fromSlot, toSlot)' in s
          assert re.search(r'^\s*moveProductImage\s*:\s*"staff"',s,re.M)
          assert re.search(r'^\s*moveProductImage\s*:\s*moveProductImage\b',s,re.M)
          PY
          git diff --check
          test -z "$(git diff --name-only | grep -v '^Code.gs$')"
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add Code.gs
          git commit -m 'Add product image reorder API'
          git push origin main
