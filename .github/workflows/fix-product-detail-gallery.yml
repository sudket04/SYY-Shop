name: Fix product detail gallery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-product-detail-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply fix
        run: python3 tools/fix_product_detail_gallery.py
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Master_Products.html').read_text(encoding='utf-8')
          assert 'openViewProductImageLightbox' in s
          assert 'viewProductImageUrls' in s
          section=s[s.find('function openViewModal'):s.find('function openViewModal')+6000]
          assert 'object-fit:cover' not in section
          assert 'object-fit:contain' in section
          print('Product detail gallery checks passed')
          PY
          git diff --check
      - name: Commit to main
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add Master_Products.html
          git commit -m 'Improve product detail image gallery'
          git push origin HEAD:main
