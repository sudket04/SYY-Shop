name: Harden legacy product images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-legacy-product-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply backend hardening
        run: python3 tools/harden_legacy_product_images.py

      - name: Verify compatibility rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Code.gs').read_text(encoding='utf-8')
          assert 'function normalizeProductImageData_' in s
          assert 'Backward compatibility' in s
          assert 'if (slot > cur.urls.length) slot = cur.urls.length;' in s
          assert 'เขียน metadata ใหม่ให้สำเร็จก่อน' in s
          assert s.count('function uploadProductImage(') == 1
          assert s.count('function deleteProductImage(') == 1
          assert s.count('function setPrimaryProductImage(') == 1
          print('Legacy product image compatibility checks passed')
          PY
          git diff --check

      - name: Commit to main
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add Code.gs
          git commit -m 'Harden legacy product image compatibility'
          git push origin HEAD:main
