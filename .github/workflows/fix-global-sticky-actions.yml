name: Fix global sticky actions header

on:
  push:
    paths:
      - 'tools/fix_global_sticky_actions.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply global sticky actions patch
        run: python tools/fix_global_sticky_actions.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('Styles.html').read_text(encoding='utf-8')
          assert 'th.col-sticky-right{position:sticky;top:0;right:0;z-index:30' in s
          assert '.table-compact tbody td.col-sticky-right{position:static' in s
          assert '.table-compact .col-sticky-right{position:static' not in s
          PY
          git diff --check
          test -z "$(git diff --name-only | grep -v '^Styles.html$')"
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add Styles.html
          git commit -m 'Fix sticky action headers across tables'
          git push origin main
