name: Fix dropdown and product image UI

on:
  push:
    paths:
      - '.github/workflows/fix-dropdown-image-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch UI only
        run: python tools/fix_dropdown_image_ui.py
      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          sh=Path('Shared.html').read_text(encoding='utf-8')
          mp=Path('Master_Products.html').read_text(encoding='utf-8')
          assert 'ensureSYYSelectRuntimeStyles' in sh
          assert "sel.style.opacity='0'" in sh
          assert 'product-image-slots-ui' in mp
          assert 'showProductImageLightbox' in mp
          assert 'openTableProductImageLightbox' in mp
          assert "callApi('uploadProductImage'" in mp
          assert "callApi('deleteProductImage'" in mp
          assert "callApi('setPrimaryProductImage'" in mp
          assert 'apiGatewayV2' not in mp
          PY
          git diff --check
          test -z "$(git diff --name-only | grep -vE '^(Shared.html|Master_Products.html)$')"
      - name: Commit to main
        shell: bash
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add Shared.html Master_Products.html
          git commit -m 'Fix searchable dropdown and product image preview UI'
          git push origin HEAD:main
