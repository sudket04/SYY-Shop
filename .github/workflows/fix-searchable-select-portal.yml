name: Fix searchable select modal portal

on:
  push:
    paths:
      - '.github/workflows/fix-searchable-select-portal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Shared searchable select
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Shared.html')
          s=p.read_text(encoding='utf-8')

          # 1) Portalled panel needs its own open state because it is no longer a child of .syy-select.
          old="    '.syy-select.open .syy-select-panel{display:flex;flex-direction:column}',"
          new="    '.syy-select.open .syy-select-panel{display:flex;flex-direction:column}',\n    '.syy-select-panel[data-syy-open=\"true\"]{display:flex;flex-direction:column}',"
          if old not in s:
              raise SystemExit('runtime panel css marker not found')
          s=s.replace(old,new,1)

          # 2) Close must also hide the portalled panel.
          old="  function close(inst){inst=inst||active;if(!inst)return;inst.wrap.classList.remove('open');inst.control.setAttribute('aria-expanded','false');if(active===inst)active=null;}"
          new="  function close(inst){inst=inst||active;if(!inst)return;inst.wrap.classList.remove('open');inst.panel.removeAttribute('data-syy-open');inst.control.setAttribute('aria-expanded','false');if(active===inst)active=null;}"
          if old not in s:
              raise SystemExit('close marker not found')
          s=s.replace(old,new,1)

          # 3) Keep native select/control in the form, but portal the floating panel to body.
          old="    sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);wrap.appendChild(control);wrap.appendChild(panel);sel.classList.add('syy-select-native');"
          new="    sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);wrap.appendChild(control);document.body.appendChild(panel);sel.classList.add('syy-select-native');"
          if old not in s:
              raise SystemExit('panel parent marker not found')
          s=s.replace(old,new,1)

          # 4) Open the portalled panel explicitly before positioning it.
          old="    function open(){if(control.disabled)return;if(active&&active!==inst)close(active);active=inst;sync();wrap.classList.add('open');control.setAttribute('aria-expanded','true');search.value='';render('');position(inst);setTimeout(function(){search.focus();},0);}"
          new="    function open(){if(control.disabled)return;if(active&&active!==inst)close(active);active=inst;sync();wrap.classList.add('open');panel.setAttribute('data-syy-open','true');control.setAttribute('aria-expanded','true');search.value='';render('');position(inst);setTimeout(function(){search.focus();},0);}"
          if old not in s:
              raise SystemExit('open marker not found')
          s=s.replace(old,new,1)

          # 5) Clicks inside the portalled search/list must not be treated as outside clicks.
          old="  function documentClick(e){if(active&&!active.wrap.contains(e.target))close(active);}"
          new="  function documentClick(e){if(active&&!active.wrap.contains(e.target)&&!active.panel.contains(e.target))close(active);}"
          if old not in s:
              raise SystemExit('documentClick marker not found')
          s=s.replace(old,new,1)

          # 6) Expose closeActive and close any floating dropdown when a modal closes.
          old="  return {init:init,refresh:refresh,enhance:enhance,documentClick:documentClick,reposition:reposition};"
          new="  return {init:init,refresh:refresh,enhance:enhance,documentClick:documentClick,reposition:reposition,closeActive:function(){close(active);}};"
          if old not in s:
              raise SystemExit('return marker not found')
          s=s.replace(old,new,1)

          old="function closeModal(id){\n  var el=document.getElementById(id);\n  if(el) el.classList.remove('active');\n}"
          new="function closeModal(id){\n  var el=document.getElementById(id);\n  if(window.SYYSelect) SYYSelect.closeActive();\n  if(el) el.classList.remove('active');\n}"
          if old not in s:
              raise SystemExit('closeModal marker not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('Shared.html').read_text(encoding='utf-8')
          assert 'document.body.appendChild(panel)' in s
          assert 'data-syy-open' in s
          assert '!active.panel.contains(e.target)' in s
          assert 'closeActive:function(){close(active);}' in s
          assert "if(window.SYYSelect) SYYSelect.closeActive();" in s
          assert "wrap.appendChild(panel)" not in s
          PY
          git diff --check
          test -z "$(git diff --name-only | grep -v '^Shared.html$')"
      - name: Commit to main
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add Shared.html
          git commit -m 'Fix searchable dropdown clipping in modals'
          git push origin main
