name: SYY Shop main refactor v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-refactor-main-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply refactor
        run: python3 tools/refactor_search_and_images.py

      - name: Static verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('Code.gs').read_text(encoding='utf-8')
          prod=Path('Master_Products.html').read_text(encoding='utf-8')
          shared=Path('Shared.html').read_text(encoding='utf-8')
          styles=Path('Styles.html').read_text(encoding='utf-8')
          assert 'setPrimaryProductImage' in code
          assert 'Image_Urls' in code and 'Drive_File_Ids' in code
          assert 'productImageSlots' in prod
          assert 'PROD_IMG_MAX_DIM=1600' in prod
          assert 'SYYSelect' in shared
          assert '.syy-select-panel' in styles
          assert 'object-fit:contain' in prod
          print('Static assertions passed')
          PY
          git diff --check

      - name: Commit to main
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add Code.gs Shared.html Styles.html Master_Products.html StockIssue.html Quotation.html Purchase_Orders.html Master_Tax_Invoice.html docs/CODE_AUDIT_TH.md
          if git diff --cached --quiet; then
            echo 'No source changes produced'
            exit 0
          fi
          git commit -m 'Improve searchable dropdowns and product image gallery'
          git push origin HEAD:main

# one-time trigger