<style>

  body[data-syy-layout]>.page>.page-head{border:1px solid var(--line,#dfe7ef);border-radius:12px}
  body[data-syy-layout] .page-body{gap:16px;padding-top:18px}

  body[data-syy-layout="compact"]>.page-body{padding-left:0;padding-right:0}
  body[data-syy-layout] .mono{font-variant-numeric:tabular-nums}
  body[data-syy-layout] .view-field-tile .vft-label,body[data-syy-layout] .view-price-pill .vpp-label{font-size:12.5px}
  body[data-syy-layout] .view-field-tile .vft-value{font-size:14px;line-height:1.6}

  body[data-syy-layout="users"] td{font-size:14px}

    body.syy-compact-list .table-compact{table-layout:fixed}

  }
  @media(max-width:767px){
    body[data-syy-layout]>.page{padding-top:8px}
    body[data-syy-layout]>.page-head{margin-top:8px;border-radius:0}
    body[data-syy-layout]>.page>.page-head{border-radius:0}
    body[data-syy-layout="compact"]>.page-head,body[data-syy-layout="compact"]>.page-body,body[data-syy-layout="compact"]>.syy-data-status{width:calc(100% - 20px)}
    body[data-syy-layout="compact"]>.page-head{border-radius:10px}
    body.syy-compact-list .table-compact{table-layout:fixed;min-width:0}

    body.syy-compact-list .table-compact col:first-child{width:30px!important}
    body.syy-compact-list .table-compact col:nth-child(2){width:78px!important}
    body.syy-compact-list .table-compact col:last-child{width:110px!important}
    body.syy-compact-list .table-compact th.xlf-th{padding-right:8px!important}
    body.syy-compact-list .table-compact .xlf-th-label{display:block;white-space:normal;overflow-wrap:anywhere}
    body.syy-compact-list .table-compact .xlf-th-btn{position:static;display:block;transform:none;margin-top:4px;width:44px;height:44px}
    body.syy-compact-list .table-compact td:nth-child(3){white-space:normal;overflow-wrap:anywhere}

/* Shared, dependency-free line icon system. */
.syy-icon{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn .syy-icon,.btn-icon .syy-icon,.row-actions .syy-icon{width:18px;height:18px}
.btn-icon .syy-icon,.row-actions .btn .syy-icon{width:19px;height:19px}
.modal-header .syy-icon,.empty-state .syy-icon{width:21px;height:21px}
.syy-password{position:relative;display:block;width:100%}
.syy-password input{padding-right:50px!important;box-sizing:border-box;width:100%}
.syy-password input::-ms-reveal,.syy-password input::-ms-clear{display:none}
.syy-password-toggle{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:6px;background:transparent;color:#64748b;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.syy-password-toggle svg{pointer-events:none}
.syy-password-toggle:hover{background:#f1f5f9;color:#005088}
.syy-password-toggle:focus-visible{outline:2px solid #005088;outline-offset:1px}
</style>

<script>
/* Presentation only: keep the same input, value, autocomplete and auth handlers. */
(function(){
  var eye='<path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/>';
  var eyeOff='<path d="m3 3 18 18M10.5 6.1A12 12 0 0 1 12 6c6 0 10 6 10 6a18 18 0 0 1-3 3.5M6 7.5A18 18 0 0 0 2 12s4 6 10 6c1.6 0 3.1-.4 4.4-1M10 10a3 3 0 0 0 4 4"/>';
  var active=null,controls=new WeakMap(),wrappers=document.getElementsByClassName('syy-password');
  function setType(input,type){
    if(input.type===type)return;
    var start=input.selectionStart,end=input.selectionEnd,direction=input.selectionDirection;
    input.type=type;
    if(start!==null)try{input.setSelectionRange(start,end,direction);}catch(e){}
  }
  function stop(){
    var held=active;active=null;if(!held)return;
    setType(held.input,'password');sync(held.input,held.btn);
    if(held.pointerId!=null)try{if(held.btn.hasPointerCapture(held.pointerId))held.btn.releasePointerCapture(held.pointerId);}catch(e){}
  }
  function sync(input,btn){
    var available=input.value.length>0&&!input.disabled;
    if(!available){if(active&&active.input===input)stop();setType(input,'password');}
    if(btn.hidden===available)btn.hidden=!available;
    var shown=input.type==='text',pressed=shown?'true':'false';
    if(btn.getAttribute('aria-pressed')!==pressed){
      btn.setAttribute('aria-label',shown?'ปล่อยเพื่อซ่อนรหัสผ่าน':'กดค้างเพื่อดูรหัสผ่าน');
      btn.setAttribute('aria-pressed',pressed);
      btn.title=shown?'ปล่อยเพื่อซ่อนรหัสผ่าน':'กดเมาส์ แตะ หรือกด Space / Enter ค้างเพื่อดูรหัสผ่าน';
      btn.innerHTML='<svg class="syy-icon" viewBox="0 0 24 24" aria-hidden="true">'+(shown?eyeOff:eye)+'</svg>';
    }
  }
  function refresh(){
    if(active&&(!active.input.isConnected||!active.btn.isConnected||!active.input.getClientRects().length||getComputedStyle(active.input).visibility==='hidden'))stop();
    for(var i=0;i<wrappers.length;i++){var input=wrappers[i].firstElementChild,btn=controls.get(input);if(btn)sync(input,btn);}
  }
  function begin(input,btn,pointerId,key){
    sync(input,btn);if(btn.hidden||!input.getClientRects().length)return;
    stop();active={input:input,btn:btn,pointerId:pointerId,key:key};setType(input,'text');sync(input,btn);
    if(pointerId!=null)try{btn.setPointerCapture(pointerId);}catch(e){}
  }
  function enhance(input){
    if(input.dataset.syyPassword==='true')return;
    input.dataset.syyPassword='true';
    var wrap=document.createElement('span');wrap.className='syy-password';
    input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);
    var btn=document.createElement('button');btn.type='button';btn.className='syy-password-toggle';
    if(input.id)btn.setAttribute('aria-controls',input.id);
    btn.addEventListener('pointerdown',function(e){if(e.button!==0||e.isPrimary===false)return;e.preventDefault();begin(input,btn,e.pointerId,null);});
    btn.addEventListener('keydown',function(e){if((e.key!==' '&&e.key!=='Enter')||e.altKey||e.ctrlKey||e.metaKey)return;e.preventDefault();if(!e.repeat)begin(input,btn,null,e.key);});
    ['pointerleave','lostpointercapture'].forEach(function(name){btn.addEventListener(name,function(e){if(active&&active.btn===btn&&active.pointerId===e.pointerId)stop();});});
    btn.addEventListener('blur',function(){if(active&&active.btn===btn)stop();});
    btn.addEventListener('click',function(e){e.preventDefault();}); // A click alone never leaves the password visible.
    btn.addEventListener('contextmenu',function(e){e.preventDefault();stop();});
    ['input','change'].forEach(function(name){input.addEventListener(name,function(){if(active&&active.input===input)stop();sync(input,btn);});});
    input.addEventListener('focus',function(){sync(input,btn);});
    input.addEventListener('blur',function(){if(active&&active.input===input)stop();sync(input,btn);});
    wrap.appendChild(btn);controls.set(input,btn);sync(input,btn);
    if(input.form)input.form.addEventListener('reset',function(){hide(input.form);setTimeout(refresh,0);});
  }

    if(root.matches&&root.matches('input[type="password"]'))enhance(root);
    if(root.querySelectorAll)root.querySelectorAll('input[type="password"]').forEach(enhance);
  }
  function hide(root){(root||document).querySelectorAll('.syy-password input').forEach(function(input){if(active&&active.input===input)stop();setType(input,'password');sync(input,controls.get(input));});}
  window.SYYPassword={hide:hide};
  ['pointerup','pointercancel'].forEach(function(name){document.addEventListener(name,function(e){if(active&&active.pointerId===e.pointerId)stop();},true);});
  document.addEventListener('pointermove',function(e){if(!active||active.pointerId!==e.pointerId)return;var rect=active.btn.getBoundingClientRect();if(!(e.buttons&1)||e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)stop();},true);
  document.addEventListener('pointerdown',function(e){if(active&&!active.btn.contains(e.target))stop();},true);
  document.addEventListener('keyup',function(e){if(active&&active.key===e.key){e.preventDefault();stop();}},true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')stop();},true);
  document.addEventListener('submit',function(){hide(document);},true);
  document.addEventListener('visibilitychange',function(){if(document.hidden)hide(document);});
  window.addEventListener('blur',function(){hide(document);});
  window.addEventListener('pagehide',function(){hide(document);});
  window.addEventListener('pageshow',function(){hide(document);refresh();});
  window.addEventListener('focus',refresh);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){init(document);});else init(document);
  new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1)init(n);});});refresh();}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['value','disabled','hidden','class','style']});
})();
