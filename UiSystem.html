<script>
(function(){'use strict';
var UI={galleryCode:null,gallery:[],galleryMax:6};window.SYY_UI=UI;

window.openImagePreview=function(url,title){if(!url)return;ensureLightbox();var el=document.getElementById('syyLightbox');el.querySelector('img').src=url;el.querySelector('.syy-lightbox-title').textContent=title||'';el.classList.add('open');document.body.style.overflow='hidden'};window.closeImagePreview=function(){var el=document.getElementById('syyLightbox');if(el)el.classList.remove('open');document.body.style.overflow=''};
function decorateImages(root){(root||document).querySelectorAll('#productTable img,#imgPreviewBox img,#viewImgBox img,#pdImgBox img').forEach(function(img){if(img.dataset.syyZoom)return;img.dataset.syyZoom='1';img.classList.add('syy-image-clickable');img.title='คลิกเพื่อดูรูปขนาดใหญ่';img.addEventListener('click',function(e){e.stopPropagation();openImagePreview(img.currentSrc||img.src,img.alt||'รูปสินค้า')})})}
function shouldSearch(sel){if(!sel||sel.dataset.searchable==='false'||sel.multiple||sel.size>1||sel.closest('.syy-select-wrap'))return false;if(['pageSizeSelect','printLabelSize','selValidDays'].indexOf(sel.id)>-1)return false;var opts=[].slice.call(sel.options||[]).filter(function(o){return !o.disabled});return sel.dataset.searchable==='true'||opts.length>=8||/(brand|category|vendor|zone|customer|province|district|subdistrict|car|product)/i.test(sel.id||'')}
function makeSearchable(sel){if(!shouldSearch(sel)||sel.dataset.syySelect)return;sel.dataset.syySelect='1';sel.classList.add('syy-select-native');var wrap=document.createElement('div');wrap.className='syy-select-wrap';sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);var ctl=document.createElement('div');ctl.className='syy-select-control';ctl.innerHTML='<input type="text" autocomplete="off"><span class="syy-select-arrow">⌄</span>';wrap.appendChild(ctl);var menu=document.createElement('div');menu.className='syy-select-menu';wrap.appendChild(menu);var input=ctl.querySelector('input'),active=-1;function txt(){var o=sel.options[sel.selectedIndex];return o?o.text:''}function render(q){q=String(q||'').trim().toLowerCase();var arr=[].slice.call(sel.options).filter(function(o){return !o.disabled&&(!q||String(o.text).toLowerCase().indexOf(q)>-1||String(o.value).toLowerCase().indexOf(q)>-1)}).slice(0,60);active=-1;menu.innerHTML=arr.length?arr.map(function(o){return '<div class="syy-select-option'+(o.value===sel.value?' selected':'')+'" data-value="'+ha(o.value)+'">'+h(o.text)+'</div>'}).join(''):'<div class="syy-select-empty">ไม่พบรายการ</div>';menu.querySelectorAll('.syy-select-option').forEach(function(el){el.addEventListener('mousedown',function(e){e.preventDefault();sel.value=el.dataset.value;input.value=txt();wrap.classList.remove('open');sel.dispatchEvent(new Event('change',{bubbles:true}))})})}function sync(){if(document.activeElement!==input||!wrap.classList.contains('open'))input.value=txt();render('')}input.value=txt();input.addEventListener('focus',function(){wrap.classList.add('open');input.select();render('')});input.addEventListener('input',function(){wrap.classList.add('open');render(input.value)});input.addEventListener('keydown',function(e){var els=menu.querySelectorAll('.syy-select-option');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!els.length)return;active=Math.max(0,Math.min(els.length-1,active+(e.key==='ArrowDown'?1:-1)));els.forEach(function(el,i){el.classList.toggle('active',i===active)});els[active].scrollIntoView({block:'nearest'})}else if(e.key==='Enter'&&active>=0){e.preventDefault();els[active].dispatchEvent(new MouseEvent('mousedown',{bubbles:true}))}else if(e.key==='Escape'){wrap.classList.remove('open');input.value=txt()}});sel.addEventListener('change',sync);new MutationObserver(sync).observe(sel,{childList:true,subtree:true});document.addEventListener('mousedown',function(e){if(!wrap.contains(e.target)){wrap.classList.remove('open');input.value=txt()}})}
function initSelects(root){(root||document).querySelectorAll('select').forEach(makeSearchable)}window.initSearchableSelects=initSelects;
function compactHeaders(){document.querySelectorAll('.page-head').forEach(function(head){var groups=head.querySelectorAll(':scope > div');if(groups.length<2)return;var actions=groups[groups.length-1];if(actions.dataset.syyCompact)return;actions.dataset.syyCompact='1';[].slice.call(actions.querySelectorAll('button')).forEach(function(b){if((b.title||'').indexOf('ความหนาแน่น')>-1||String(b.getAttribute('onclick')||'').indexOf('toggleDensity')>-1)b.style.display='none'});var second=[].slice.call(actions.querySelectorAll('button')).filter(function(b){return b.style.display!=='none'&&!b.classList.contains('btn-primary')&&!/เพิ่ม|สร้างใหม่|บันทึก/.test(b.textContent||'')});if(second.length<2)return;var more=document.createElement('div');more.className='syy-page-more';more.innerHTML='<button type="button" class="btn btn-ghost btn-icon" aria-label="เพิ่มเติม">•••</button><div class="syy-page-more-menu"></div>';var menu=more.querySelector('.syy-page-more-menu');second.forEach(function(b){var clone=document.createElement('button');clone.type='button';clone.innerHTML=b.innerHTML;clone.addEventListener('click',function(){b.click();more.classList.remove('open')});menu.appendChild(clone);b.style.display='none'});more.firstElementChild.addEventListener('click',function(e){e.stopPropagation();more.classList.toggle('open')});actions.insertBefore(more,actions.firstChild);document.addEventListener('click',function(e){if(!more.contains(e.target))more.classList.remove('open')})})}
function call(fn,args,ok,fail){if(typeof window.callApi!=='function'){setTimeout(function(){call(fn,args,ok,fail)},30);return}window.callApi(fn,args||[],ok||function(){},fail)}
function compressFile(file,done){if(!file||!/^image\//.test(file.type)){done(null,'กรุณาเลือกไฟล์รูปภาพ');return}if(file.size>5*1024*1024){done(null,'ไฟล์ต้นฉบับต้องไม่เกิน 5MB');return}var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var w=img.width,hg=img.height,max=900;if(w>max||hg>max){if(w>=hg){hg=Math.round(hg*max/w);w=max}else{w=Math.round(w*max/hg);hg=max}}var c=document.createElement('canvas');c.width=w;c.height=hg;c.getContext('2d').drawImage(img,0,0,w,hg);done(c.toDataURL('image/jpeg',.82).split(',')[1],null)};img.onerror=function(){done(null,'เปิดไฟล์รูปไม่สำเร็จ')};img.src=e.target.result};r.readAsDataURL(file)}
function ensureGalleryUi(){var preview=document.getElementById('imgPreviewBox');if(!preview||document.getElementById('syyProductGallery'))return;var host=preview.parentElement&&preview.parentElement.parentElement;if(!host)return;var g=document.createElement('div');g.id='syyProductGallery';g.className='syy-gallery';g.innerHTML='<div class="syy-gallery-head"><span>รูปสินค้า</span><span id="syyGalleryCount">0 / 6 รูป</span></div><div class="syy-gallery-grid" id="syyGalleryGrid"></div>';host.appendChild(g);var input=document.getElementById('inp_imageFile');if(input){var clone=input.cloneNode(true);clone.multiple=true;clone.removeAttribute('onchange');input.parentNode.replaceChild(clone,input);clone.addEventListener('change',function(){uploadFiles([].slice.call(clone.files||[]));clone.value=''})}var b=document.getElementById('btnPickImage');if(b)b.textContent='เพิ่มรูปสินค้า';var del=document.getElementById('btnDeleteImage');if(del)del.style.display='none'}
function renderGallery(){var box=document.getElementById('syyGalleryGrid'),count=document.getElementById('syyGalleryCount');if(!box)return;if(count)count.textContent=UI.gallery.length+' / '+UI.galleryMax+' รูป';if(!UI.gallery.length){box.innerHTML='<div class="syy-gallery-empty">ยังไม่มีรูปสินค้า</div>';return}box.innerHTML=UI.gallery.map(function(im,i){return '<div class="syy-gallery-card '+(i===0?'primary':'')+'">'+(i===0?'<span class="syy-gallery-primary-badge">รูปหลัก</span>':'')+'<img src="'+ha(im.url)+'" alt="รูปสินค้า '+(i+1)+'" data-zoom="'+ha(im.url)+'"><div class="syy-gallery-actions">'+(i?'<button type="button" data-primary="'+ha(im.id)+'" title="ตั้งเป็นรูปหลัก">★</button>':'')+'<button type="button" data-delete="'+ha(im.id)+'" title="ลบรูป">×</button></div></div>'}).join('');box.querySelectorAll('img[data-zoom]').forEach(function(img){img.addEventListener('click',function(){openImagePreview(img.dataset.zoom,'รูปสินค้า')})});box.querySelectorAll('[data-primary]').forEach(function(b){b.addEventListener('click',function(){setPrimary(b.dataset.primary)})});box.querySelectorAll('[data-delete]').forEach(function(b){b.addEventListener('click',function(){deleteImage(b.dataset.delete)})});var main=document.getElementById('imgPreviewBox');if(main)main.innerHTML='<img src="'+ha(UI.gallery[0].url)+'" alt="รูปหลัก" style="width:100%;height:100%;object-fit:contain">';decorateImages(document)}
function loadGallery(code){code=String(code||'');UI.galleryCode=code;if(!code){UI.gallery=[];renderGallery();return}call('getProductGallery',[code],function(res){if(UI.galleryCode!==code)return;if(res&&res.success){UI.gallery=res.images||[];UI.galleryMax=res.maxImages||6;renderGallery();renderViewGallery(code)}})}
function uploadFiles(files){var code=String(window.editingDocId||'');if(!code){if(window.swyWarning)swyWarning('บันทึกสินค้าก่อน','กรุณาบันทึกข้อมูลสินค้าก่อนจึงจะอัปโหลดรูปได้');return}var slots=Math.max(0,UI.galleryMax-UI.gallery.length);files=files.slice(0,slots);if(!files.length){if(window.swyWarning)swyWarning('รูปครบแล้ว','สินค้า 1 รายการรองรับสูงสุด '+UI.galleryMax+' รูป');return}var i=0;function next(){if(i>=files.length){loadGallery(code);return}compressFile(files[i++],function(base64,err){if(err){if(window.swyError)swyError('อัปโหลดรูปไม่ได้',err);next();return}call('uploadProductGalleryImage',[code,base64],function(res){if(res&&res.success){UI.gallery=res.images||UI.gallery;UI.galleryMax=res.maxImages||UI.galleryMax;renderGallery();next()}else if(window.swyError)swyError('อัปโหลดไม่สำเร็จ',(res&&res.message)||'ไม่ทราบสาเหตุ')})})}next()}
function setPrimary(id){var code=UI.galleryCode;if(!code)return;call('setProductGalleryPrimary',[code,id],function(res){if(res&&res.success){UI.gallery=res.images||[];renderGallery();if(window.toast)toast('ตั้งเป็นรูปหลักแล้ว')}else if(window.swyError)swyError('ตั้งรูปหลักไม่ได้',(res&&res.message)||'ไม่ทราบสาเหตุ')})}
function deleteImage(id){var code=UI.galleryCode;if(!code)return;var go=function(){call('deleteProductGalleryImage',[code,id],function(res){if(res&&res.success){UI.gallery=res.images||[];renderGallery();if(window.toast)toast('ลบรูปแล้ว')}else if(window.swyError)swyError('ลบรูปไม่ได้',(res&&res.message)||'ไม่ทราบสาเหตุ')})};if(window.swyConfirm)swyConfirm({icon:'warning',title:'ลบรูปนี้?',html:'การลบรูปไม่สามารถย้อนกลับได้',confirmText:'ลบรูป',danger:true}).then(function(ok){if(ok)go()});else if(confirm('ลบรูปนี้?'))go()}
function renderViewGallery(code){var modal=document.getElementById('viewProductModal');if(!modal||String(window.viewingDocId||'')!==String(code))return;var old=document.getElementById('syyViewGallery');if(old)old.remove();if(!UI.gallery.length)return;var hero=document.getElementById('viewImgBox');if(hero)hero.innerHTML='<img src="'+ha(UI.gallery[0].url)+'" style="width:100%;height:100%;object-fit:contain" alt="รูปสินค้า">';var g=document.createElement('div');g.id='syyViewGallery';g.className='syy-view-gallery';g.innerHTML=UI.gallery.map(function(im,i){return '<button type="button" class="'+(i===0?'on':'')+'" data-url="'+ha(im.url)+'"><img src="'+ha(im.url)+'" alt="รูป '+(i+1)+'"></button>'}).join('');var body=modal.querySelector('.modal-body'),first=body&&body.firstElementChild;if(first)body.insertBefore(g,first.nextSibling);g.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){g.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');if(hero)hero.innerHTML='<img src="'+ha(b.dataset.url)+'" style="width:100%;height:100%;object-fit:contain" alt="รูปสินค้า">';decorateImages(document)})})}
function installProductGallery(){ensureGalleryUi();var pm=document.getElementById('productModal');if(pm&&!pm.dataset.syyGalleryWatch){pm.dataset.syyGalleryWatch='1';new MutationObserver(function(){if(pm.classList.contains('active'))setTimeout(function(){loadGallery(String(window.editingDocId||''))},0)}).observe(pm,{attributes:true,attributeFilter:['class']})}var vm=document.getElementById('viewProductModal');if(vm&&!vm.dataset.syyGalleryWatch){vm.dataset.syyGalleryWatch='1';new MutationObserver(function(){if(vm.classList.contains('active')){var c=String(window.viewingDocId||'');if(c)loadGallery(c)}}).observe(vm,{attributes:true,attributeFilter:['class']})}}
function installStockAdjustment(){var stock=document.getElementById('inp_currentStock');if(!stock||document.getElementById('syyAdjustStockBtn'))return;stock.readOnly=true;var row=document.createElement('div');row.className='syy-stock-adjust-row';row.innerHTML='<span class="field-hint">สต๊อกเปลี่ยนผ่านธุรกรรมและมี Audit</span><button type="button" class="btn btn-ghost" id="syyAdjustStockBtn">ปรับยอดสต๊อก</button>';stock.parentElement.appendChild(row);row.querySelector('button').addEventListener('click',function(){var code=String(window.editingDocId||'');if(!code)return;if(!window.Swal)return;var cur=parseFloat(stock.value||0);Swal.fire({title:'ปรับยอดสต๊อก',html:'<div style="text-align:left"><label>ยอดปัจจุบัน</label><div style="padding:9px;background:#f1f5f9;border-radius:7px;margin:4px 0 10px">'+cur+' ชิ้น</div><label>ยอดใหม่ *</label><input id="syyAdjNew" type="number" min="0" class="swal2-input" style="margin:4px 0 10px;width:100%" value="'+cur+'"><label>เหตุผล *</label><input id="syyAdjReason" class="swal2-input" style="margin:4px 0 10px;width:100%" placeholder="เช่น ตรวจนับสต๊อกจริง"><label>หมายเหตุ</label><input id="syyAdjNote" class="swal2-input" style="margin:4px 0;width:100%"></div>',showCancelButton:true,confirmButtonText:'บันทึกปรับยอด',cancelButtonText:'ยกเลิก',preConfirm:function(){var n=document.getElementById('syyAdjNew').value,r=document.getElementById('syyAdjReason').value.trim(),note=document.getElementById('syyAdjNote').value.trim();if(n===''||parseFloat(n)<0){Swal.showValidationMessage('กรุณากรอกยอดใหม่ให้ถูกต้อง');return false}if(r.length<3){Swal.showValidationMessage('กรุณาระบุเหตุผล');return false}return{newStock:parseFloat(n),reason:r,note:note}}}).then(function(x){if(!x.isConfirmed)return;call('adjustProductStock',[{productCode:code,newStock:x.value.newStock,reason:x.value.reason,note:x.value.note}],function(res){if(res&&res.success){stock.value=res.after;if(window.filterAndRenderTable)filterAndRenderTable();if(window.notifyParentRefreshProducts)notifyParentRefreshProducts();if(window.toast)toast('ปรับยอดสต๊อกเรียบร้อย')}else if(window.swyError)swyError('ปรับยอดไม่สำเร็จ',(res&&res.message)||'ไม่ทราบสาเหตุ')})})})}
function boot(){ensureLightbox();initSelects(document);decorateImages(document);compactHeaders();installProductGallery();installStockAdjustment()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();window.addEventListener('load',function(){installProductGallery();installStockAdjustment();compactHeaders()});new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1){initSelects(n);decorateImages(n)}})})}).observe(document.documentElement,{childList:true,subtree:true});document.addEventListener('keydown',function(e){if(e.key==='Escape'){var lb=document.getElementById('syyLightbox');if(lb&&lb.classList.contains('open'))closeImagePreview()}})})();
</script>
