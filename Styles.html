<style>
/* ═══════════════════════════════════════════════════════════
   SYY Shop Control — Styles.html  (CSS กลางของทั้งระบบ)
   ใช้: <?!= include_('Styles'); ?>  ไว้ใน <head> ของทุกหน้า
   แก้สี/ระยะที่ไฟล์นี้ที่เดียว มีผลทุกหน้า
   ═══════════════════════════════════════════════════════════ */

:root{
  --primary:#005088; --primary-dark:#002e52; --primary-soft:#e6f0fa; --primary-line:#bfdcf5;
  --nav:#012a49; --nav-hi:#0a4877; --nav-txt:#e2eaf1; --nav-dim:#7cb3d4; --nav-label:#5f93b8;
  --ink:#0f172a; --text:#334155; --muted:#475569; --faint:#64748b;
  --line:#dfe7ef; --line-soft:#f1f5f9; --bg:#f3f6fa;
  --ok:#15803d; --ok-bg:#dcfce7; --ok-line:#86efac;
  --warn:#b45309; --warn-bg:#fef3c7; --warn-line:#fcd34d;
  --danger:#dc2626; --danger-dark:#b91c1c; --danger-bg:#fef2f2; --danger-line:#fecaca;
  --info:#1d4ed8; --info-bg:#eff6ff; --info-line:#93c5fd;
  --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(15,23,42,.04),0 5px 18px rgba(15,23,42,.06); --shadow-lg:0 10px 30px rgba(15,23,42,.18);
  --hit:36px;
  --font-sans:'Noto Sans Thai','Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --fs-body:15px; --lh-body:1.65; --tracking-body:0;
}
.syy-dialog-fallback.swal2-container{position:fixed;inset:0;z-index:100100;display:flex;align-items:center;justify-content:center;background:#0f172a66;padding:20px}
.syy-dialog-fallback>.swy-popup{width:min(540px,100%);max-height:90vh;overflow:auto;background:white;color:var(--ink);border-radius:16px;box-shadow:0 16px 48px #0f172a40;padding:28px;text-align:center}
.syy-dialog-fallback .swy-title{margin:0 0 16px;font-size:20px}
.syy-dialog-fallback .swy-html{overflow-wrap:anywhere}
.syy-dialog-actions{display:flex;justify-content:center;gap:10px;margin-top:24px}
.syy-dialog-actions button{border:0;min-height:42px;cursor:pointer}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);font-size:var(--fs-body);line-height:var(--lh-body);letter-spacing:var(--tracking-body);font-weight:400}
button,input,select,textarea{font:inherit;letter-spacing:inherit}
input,select,textarea{line-height:1.5}
::placeholder{color:var(--faint);opacity:1}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-dark);text-decoration:underline}
.text-center{text-align:center}.text-right{text-align:right}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:0}

/* ── โครงหน้า: header แถวเดียว (breadcrumb + action) ── */
.page{width:100%;min-width:0;margin:0 auto;padding:0 0 20px}
.page-head{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 8px 0 var(--bg);margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;flex-wrap:wrap;min-height:52px}
.crumb{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--faint);min-width:0}
.crumb b{color:var(--ink);font-size:17px;font-weight:600}
.crumb .sep{color:#cbd5e1}
.page-body{padding:14px 18px;display:flex;flex-direction:column;gap:12px}

/* ── ปุ่ม ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-sm);
  padding:8px 14px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;min-height:var(--hit);white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-ghost{background:#fff;border-color:var(--line);color:#475569}
.btn-ghost:hover:not(:disabled){background:var(--bg);border-color:#cbd5e1}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-soft:hover:not(:disabled){background:#d6e6f5}
.btn-ok{background:#f0fdf4;border-color:var(--ok-line);color:var(--ok)}
.btn-ok:hover:not(:disabled){background:var(--ok-bg)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:var(--danger-dark)}
.btn-icon{width:var(--hit);height:var(--hit);padding:0;border-radius:9px;font-size:14px;min-height:0}
.btn-icon.edit{background:var(--primary-soft);color:var(--primary)}
.btn-icon.edit:hover{background:var(--primary);color:#fff}
.btn-icon.del{background:var(--danger-bg);color:var(--danger)}
.btn-icon.del:hover{background:var(--danger);color:#fff}
.btn-icon.view{background:var(--warn-bg);color:var(--warn)}
.btn-icon.view:hover{background:#f59e0b;color:#fff}
.row-actions{display:inline-flex;gap:6px;justify-content:center;align-items:center}

/* ── การ์ด / toolbar ── */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-pad{padding:16px 18px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:11px 13px;border-bottom:1px solid var(--line-soft)}
.search{position:relative;flex:1;min-width:200px}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;font-size:14px}
.input,.select{width:100%;border:1px solid #cbd5e1;border-radius:var(--r-sm);padding:9px 11px;font-family:'Noto Sans Thai','Inter',system-ui,sans-serif;
  font-size:14px;color:var(--ink);background:#fff;outline:none;transition:.15s;min-height:var(--hit)}
.search .input{padding-left:36px}
.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,80,136,.12)}
.input:disabled{background:var(--line-soft);color:var(--muted)}
.select{cursor:pointer;width:auto}


/* ── Searchable select: dependency-free progressive enhancement ── */
.syy-select{position:relative;display:inline-block;width:auto;min-width:160px;max-width:100%}
.syy-select.syy-select-block{display:block;width:100%;min-width:0}
.syy-select.syy-select-compact{width:auto;min-width:120px;flex:0 1 auto}
.syy-select-native{position:absolute!important;opacity:0!important;pointer-events:none!important;width:1px!important;height:1px!important;margin:0!important;padding:0!important}
.syy-select-control{width:100%;min-height:var(--hit);border:1px solid #cbd5e1;border-radius:var(--r-sm);background:#fff;color:var(--ink);padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;font:inherit}
.syy-select-control:focus,.syy-select.open .syy-select-control{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,80,136,.12)}
.syy-select-control:disabled{background:var(--line-soft);color:var(--muted);cursor:not-allowed}
.syy-select-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.syy-select-caret{color:var(--faint);flex:none}
.syy-select-panel{display:none;position:fixed;z-index:5000;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden;min-width:220px;max-width:calc(100vw - 16px)}
.syy-select.open .syy-select-panel{display:flex;flex-direction:column}
.syy-select-search{width:calc(100% - 16px);margin:8px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;outline:none;font:inherit;flex:none}.syy-select-search:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,80,136,.10)}
.syy-select-list{min-height:0;max-height:260px;overflow:auto;overscroll-behavior:contain;border-top:1px solid var(--line-soft);flex:1 1 auto}
.syy-select-option{display:block;width:100%;border:0;background:#fff;text-align:left;padding:8px 11px;color:var(--text);cursor:pointer;font:inherit}.syy-select-option:hover,.syy-select-option:focus{outline:none;background:var(--primary-soft);color:var(--primary)}.syy-select-option.selected{font-weight:600;background:#f8fbfe}.syy-select-empty{padding:13px;text-align:center;color:var(--faint);font-size:12px}
.syy-select-meta{padding:5px 9px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--faint);background:var(--bg);flex:none}
@media(max-width:767px){.syy-select:not(.syy-select-block){min-width:110px}.syy-select-panel{min-width:min(280px,calc(100vw - 16px))}}
.product-image-frame{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}.product-image-frame img,.product-image-contain{width:100%;height:100%;object-fit:contain!important;object-position:center;background:#fff}.product-image-clickable{cursor:zoom-in}
.count{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}

.pill{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:12px;
  font-weight:600;cursor:pointer;font-family:'Noto Sans Thai','Inter',system-ui,sans-serif;min-height:32px}
.pill:hover{border-color:#94a3b8;color:#334155}
.pill.active{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.pill.danger.active{background:var(--danger-bg);border-color:#fca5a5;color:var(--danger-dark)}
.pill.ok.active{background:#f0fdf4;border-color:var(--ok-line);color:var(--ok)}

/* ── สถิติ: กดเพื่อกรองได้ ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}
.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;transition:.15s;position:relative;text-align:left;font-family:'Noto Sans Thai','Inter',system-ui,sans-serif}
.stat:hover{border-color:#cbd5e1;box-shadow:var(--shadow)}
.stat .lb{font-size:11.5px;color:var(--muted)}
.stat .vl{font-size:21px;font-weight:600;color:var(--ink);margin-top:3px;line-height:1.15}
.stat.on{border:2px solid var(--primary);padding:11px 13px}
.stat.on .lb{color:var(--primary);font-weight:600}
.stat.danger .vl{color:var(--danger-dark)}
.stat.danger.on{border-color:var(--danger-dark)}
.stat.danger.on .lb{color:var(--danger-dark)}
.stat.ok .vl{color:var(--ok)}
.stat .clear{position:absolute;right:8px;bottom:7px;font-size:10.5px;color:var(--primary)}

/* ── ตาราง: หัวสีอ่อน, hover ไม่ทำให้แถวขยับ ── */
.table-wrap{overflow:auto;max-height:calc(100dvh - 220px);overscroll-behavior:contain;scrollbar-gutter:stable;border-radius:0 0 var(--r) var(--r);scroll-padding-block:8px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;table-layout:auto;font-variant-numeric:tabular-nums}
.table-wrap table.table-compact,.table-container table.table-compact{width:100%;min-width:min(100%,720px)}
.table-wrap table.table-standard,.table-container table.table-standard{width:100%;min-width:840px}
.table-wrap table.table-wide,.table-container table.table-wide{min-width:max-content}
th{position:sticky;top:0;z-index:10;background:var(--line-soft);color:#475569;font-weight:600;font-size:12.5px;
  text-align:left;padding:10px 13px;border-bottom:1px solid #e2e8f0;box-shadow:0 6px 0 #fff;white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--line-soft);color:var(--text);vertical-align:middle;line-height:1.55}
.table-compact th,.table-compact td{white-space:nowrap}
.table-compact tbody td.col-sticky-right{position:static;box-shadow:none}
.table-standard th,.table-standard td{white-space:nowrap}
.table-wide th,.table-wide td{white-space:nowrap}
.table-wide .product-name-cell,.table-wide .models-cell{white-space:normal}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8fbfe}
tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--primary)}
tbody tr.sel td{background:#f8fbfe}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--primary)}
.col-sticky-right{position:sticky;right:0;background:#fff;background-clip:padding-box;box-shadow:-2px 0 5px rgba(15,23,42,.08)}
td.col-sticky-right{z-index:4}
th.col-sticky-right{position:sticky;top:0;right:0;z-index:30;background:var(--line-soft);background-clip:padding-box;box-shadow:-2px 1px 6px rgba(15,23,42,.10)}
tbody tr:hover td.col-sticky-right{background:#f8fbfe}
.rownum{color:var(--faint);font-size:12px;font-weight:600}
[data-density="compact"] td{padding:6px 13px}
[data-density="compact"] .btn-icon{width:30px;height:30px}

/* ── badge ── */
.badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge-ok{background:var(--ok-bg);color:#166534}
.badge-warn{background:var(--warn-bg);color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.badge-mute{background:var(--line-soft);color:var(--muted)}
.chip-code{font-family:'Courier New',monospace;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-soft);
  border:1px solid var(--primary-line);border-radius:6px;padding:2px 8px;display:inline-block;white-space:nowrap}
.chip-pn{font-family:'Courier New',monospace;font-size:11px;color:#475569;background:var(--line-soft);border:1px solid var(--line);
  border-radius:6px;padding:2px 8px;display:inline-block;white-space:nowrap}
.chip-zone{font-size:11px;color:#0f766e;background:#f0fdfa;border:1px solid #99f6e4;border-radius:20px;padding:2px 9px;
  display:inline-block;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip-model{font-size:11px;color:#4338ca;background:#eef2ff;border:1px solid #c7d2fe;border-radius:20px;padding:2px 9px;
  display:inline-block;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.cell-empty{color:#cbd5e1;font-size:12px}

/* ── skeleton / empty ── */
.sk{display:block;height:9px;border-radius:4px;background:linear-gradient(90deg,#eef1f5 25%,#f6f8fa 50%,#eef1f5 75%);
  background-size:200% 100%;animation:skm 1.2s linear infinite}
@keyframes skm{from{background-position:200% 0}to{background-position:-200% 0}}
.syy-loading-host{position:relative}.syy-loading-overlay{position:absolute;left:0;right:0;z-index:12;background:var(--surface,#fff);overflow:hidden;pointer-events:auto;box-sizing:border-box}.syy-loading-overlay table{width:100%;table-layout:fixed}.syy-loading-overlay td{padding:16px 12px}.syy-sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.syy-skeleton-block{padding:16px;display:grid;gap:12px;box-sizing:border-box}.syy-skeleton-item{padding:14px;border:1px solid var(--line,#e2e8f0);border-radius:10px;display:grid;gap:12px}.syy-skeleton-item .sk{height:12px;width:80%}.syy-skeleton-item .sk:nth-child(2){width:55%}.syy-skeleton-item .sk:nth-child(3){width:65%}.syy-skeleton-images{grid-template-columns:repeat(3,minmax(0,1fr));padding:0}.syy-skeleton-images .syy-skeleton-item{min-height:128px}.syy-skeleton-detail{grid-template-columns:repeat(2,minmax(0,1fr))}@media(prefers-reduced-motion:reduce){.sk{animation:none}}@media(max-width:640px){.syy-skeleton-images,.syy-skeleton-detail{grid-template-columns:1fr}}
.empty-state{text-align:center;padding:34px 20px}
.empty-state .ic{font-size:28px}
.empty-state .ti{font-size:14px;font-weight:600;color:var(--ink);margin-top:7px}
.empty-state .su{font-size:12.5px;color:var(--faint);margin-top:3px}
.empty-state .ac{display:flex;gap:8px;justify-content:center;margin-top:13px;flex-wrap:wrap}

/* ── pagination ── */
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.pager .info{font-size:12.5px;color:var(--muted)}
.page-btn{min-width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);cursor:pointer;
  font-size:12.5px;font-family:'Noto Sans Thai','Inter',system-ui,sans-serif;color:#475569}
.page-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.page-btn:disabled{color:#cbd5e1;cursor:not-allowed}
.page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}

/* ── modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;justify-content:center;align-items:center;
  overflow:auto;padding:24px 16px;z-index:2000;backdrop-filter:blur(2px);overscroll-behavior:contain;scrollbar-gutter:stable}
.modal-overlay.active{display:flex}
/* ★ SweetAlert2 (swyError/swyWarning/swySuccess/swyConfirm) เดิม z-index ต่ำกว่า .modal-overlay (2000)
   ทำให้ป๊อปอัปแจ้งเตือนที่ยิงขึ้นมาระหว่างเปิด modal อยู่ (เช่น อัปโหลดรูปไม่สำเร็จตอนฟอร์มแก้ไขสินค้าเปิดอยู่)
   ไปโผล่ "อยู่หลัง" modal มองไม่เห็น/กดไม่ได้ — ดันให้สูงกว่า modal เสมอ */
.swal2-container{z-index:4000!important}
.modal-box{background:#fff;width:560px;max-width:min(96%,calc(100vw - 24px));max-height:calc(100dvh - 48px);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;
  display:flex;flex-direction:column;animation:mIn .18s ease-out;contain:layout paint}
.modal-box>form{display:flex;flex-direction:column;min-height:0;max-height:inherit}
@keyframes mIn{from{transform:translateY(-14px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{background:var(--primary);color:#fff;padding:15px 22px;font-size:16px;font-weight:600;display:flex;
  justify-content:space-between;align-items:center;gap:10px;flex-shrink:0}
.modal-header.danger{background:var(--danger)}
.modal-header.view{background:var(--warn)}
.modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:0 2px}
.modal-body{padding:20px 22px;overflow-y:auto;min-height:0;overscroll-behavior:contain;scrollbar-gutter:stable;scroll-behavior:auto;-webkit-overflow-scrolling:touch}
.modal-footer{background:var(--bg);padding:13px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;flex-shrink:0;flex-wrap:wrap}
.section-label{font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:1.2px;text-transform:uppercase;
  margin:16px 0 10px;border-top:1px solid var(--line-soft);padding-top:13px}
.section-label:first-child{border-top:none;margin-top:0;padding-top:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12.5px;font-weight:600;color:#475569}
.form-control{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:9px 11px;font-family:'Noto Sans Thai','Inter',system-ui,sans-serif;
  font-size:13px;color:var(--ink);outline:none;background:#fff;min-height:var(--hit)}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,80,136,.12)}
.form-control:disabled{background:var(--line-soft);color:var(--muted)}
.form-control.is-invalid{border-color:var(--danger);background:var(--danger-bg)}
.field-hint{font-size:11.5px;color:var(--faint)}
.field-error{font-size:11.5px;color:var(--danger);display:none}
.field-error.show{display:block}
.modal-alert{display:none;margin-top:12px;padding:10px 13px;border-radius:8px;font-size:13px;text-align:center}
.modal-alert.success{display:block;background:var(--ok-bg);color:#065f46;border:1px solid var(--ok-line)}
.modal-alert.error{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.confirm-ic{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:30px;
  background:var(--danger-bg);border:2px solid var(--danger-line)}
.confirm-card{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:10px;padding:12px 15px;text-align:left}

/* ── toast ── */
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:3500;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:11px 15px;font-size:13px;display:flex;align-items:center;gap:10px;
