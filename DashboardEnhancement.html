<script>
(function(){
  'use strict';
  function installDashboardBootstrapV2(){
    if(typeof window.callApi!=='function'||window.callApi.__syyDashboardV2)return;
    var original=window.callApi;
    var wrapped=function(fnName,args,onSuccess,onFailure){
      if(fnName!=='getDashboardBootstrap') return original.apply(this,arguments);
      var token=(typeof AUTH_TOKEN!=='undefined')?AUTH_TOKEN:'';
      if(!token){
        if(typeof WEB_APP_URL!=='undefined')window.top.location.href=WEB_APP_URL+'?page=login';
        return;
      }
      google.script.run
        .withSuccessHandler(function(res){
          if(res&&res.__authError){
            if(typeof swyError==='function'){
              swyError('เซสชันหมดอายุ','กรุณาเข้าสู่ระบบใหม่').then(function(){
                if(typeof WEB_APP_URL!=='undefined')window.top.location.href=WEB_APP_URL+'?page=login';
              });
            }
            return;
          }
          if(res&&res.success===false&&res.message){
            if(onFailure)onFailure(res);
            else if(typeof swyError==='function')swyError('โหลด Dashboard ไม่สำเร็จ',res.message);
            return;
          }
          if(onSuccess)onSuccess(res);
        })
        .withFailureHandler(onFailure||function(err){
          if(typeof swyError==='function')swyError('โหลด Dashboard ไม่สำเร็จ',String((err&&err.message)||err));
        })
        .apiDashboardBootstrap(token,(typeof navigator!=='undefined'&&navigator.userAgent)||'');
    };
    wrapped.__syyDashboardV2=true;
    wrapped.__originalCallApi=original;
    window.callApi=wrapped;
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',installDashboardBootstrapV2);
  else installDashboardBootstrapV2();
})();
</script>
