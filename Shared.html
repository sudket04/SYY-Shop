/* Frame messages are scoped to a random per-frame channel, an Apps Script origin and a known window. */
function syyMessageOriginAllowed(origin){
  if(origin===location.origin && origin!=='null') return true;
  try{var u=new URL(origin);return u.protocol==='https:' && (u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||u.hostname.endsWith('-script.googleusercontent.com'));}catch(e){return false;}
}
function syyFrameChannel(){var el=document.querySelector('meta[name="syy-frame-channel"]');return el ? el.content : '';}
function syyIsAncestor(source){var p=window;for(var i=0;i<8;i++){try{if(p.parent===p)break;p=p.parent;if(p===source)return true;}catch(e){break;}}return false;}
function syyValidMessageData(d){
  if(!d || typeof d!=='object' || Array.isArray(d) || typeof d.action!=='string')return false;
  if(['PREFILL_BASKET','PREFILL_INVOICE','OPEN_STOCK_ISSUE','OPEN_TAX_INVOICE'].indexOf(d.action)>=0){
    return Array.isArray(d.items) && d.items.length<=200 && d.items.every(function(it){return it && typeof it==='object' && isFinite(Number(it.qty)) && Number(it.qty)>0 && (typeof it.productCode==='string'||typeof it.name==='string'||typeof it.productName==='string');});
  }
  if(d.action==='STOCK_DELTA')return Array.isArray(d.productStocks)&&d.productStocks.length<=200&&d.productStocks.every(function(x){return x&&typeof x.productCode==='string'&&isFinite(Number(x.currentStock));});
  if(d.action==='PRODUCT_DELTA')return d.product && typeof d.product==='object' && typeof (d.product.productCode||d.product.id)==='string';
  if(d.action==='MASTER_DELTA')return ['brands','categories','vendors','zones','cars','customers'].indexOf(d.kind)>=0 && d.item && typeof d.item==='object' && typeof d.item.id==='string';
  if(d.action==='OPEN_PRODUCT_ADD')return typeof d.barcode==='string' && d.barcode.length<=200;
  return ['REFRESH_DROPDOWNS','REFRESH_PRODUCTS','REFRESH_STOCK_FULL','STOCKISSUE_READY','PRODUCTS_READY','TAXINVOICE_READY','PAGE_ACTIVATED','PAGE_HIDDEN','PAGE_READY'].indexOf(d.action)>=0;
}
function syyTrustedParentMessage(e){return syyFrameChannel() && e.data && e.data.channel===syyFrameChannel() && syyMessageOriginAllowed(e.origin) && syyIsAncestor(e.source) && syyValidMessageData(e.data);}
function syyPostParent(data){
  var channel=syyFrameChannel();if(!channel||window.parent===window)return;
  data=Object.assign({},data,{channel:channel});
  var origins=[location.origin];
  [document.referrer,typeof WEB_APP_URL!=='undefined'?WEB_APP_URL:''].forEach(function(url){try{var origin=new URL(url).origin;if(syyMessageOriginAllowed(origin)&&origins.indexOf(origin)<0)origins.push(origin);}catch(e){}});
  var p=window;
  for(var i=0;i<8;i++){try{if(p.parent===p)break;p=p.parent;origins.forEach(function(origin){p.postMessage(data,origin);});}catch(e){break;}}
}
function syyPostFrame(frame,data){
  if(!frame||!frame.contentWindow||!frame.dataset.channel)return;
  var target=frame.syyReceiver||frame.contentWindow, origin=frame.syyOrigin||new URL(frame.src||frame.dataset.src,location.href).origin;
  target.postMessage(Object.assign({},data,{channel:frame.dataset.channel}),origin);
}
function syyFrameOwnsSource(frame,source){
  var queue=[frame.contentWindow],depth=0;
  while(queue.length&&depth++<30){var win=queue.shift();if(win===source)return true;try{for(var i=0;i<Math.min(win.length,8);i++)queue.push(win[i]);}catch(e){}}
  return false;
}
function syyTrustedChildMessage(e){
  if(!syyMessageOriginAllowed(e.origin)||!syyValidMessageData(e.data)||!e.source)return false;
  var frames=Array.from(document.querySelectorAll('iframe[data-channel]'));
  var frame=frames.find(function(f){return f.dataset.channel===e.data.channel&&syyFrameOwnsSource(f,e.source);});
  if(!frame)return false;
  var page=frame.id.replace('iframe-',''),allowed={stockissue:['STOCKISSUE_READY','OPEN_PRODUCT_ADD','OPEN_TAX_INVOICE','STOCK_DELTA','REFRESH_STOCK_FULL'],products:['PRODUCTS_READY','PRODUCT_DELTA','REFRESH_PRODUCTS'],orders:['STOCK_DELTA','REFRESH_STOCK_FULL'],quotation:['OPEN_STOCK_ISSUE','MASTER_DELTA'],taxinvoice:['TAXINVOICE_READY','MASTER_DELTA']};
  var actions=allowed[page]||['MASTER_DELTA','REFRESH_DROPDOWNS'];
  if(e.data.action!=='PAGE_READY'&&actions.indexOf(e.data.action)<0)return false;
  if(e.data.action==='MASTER_DELTA' && e.data.kind!==page && !(['quotation','taxinvoice'].indexOf(page)>=0 && e.data.kind==='customers'))return false;
  frame.syyReceiver=e.source;frame.syyOrigin=e.origin;
  return true;
}
/* Calendar dates use Thailand's business timezone regardless of browser locale. */
function businessDate(instant){return new Date((instant?new Date(instant):new Date()).getTime()+7*3600000).toISOString().slice(0,10);}
function addCalendarDays(value,days){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||!Number.isInteger(Number(days)))return '';
  var date=new Date(value+'T00:00:00Z');if(isNaN(date.getTime())||date.toISOString().slice(0,10)!==value)return '';
  date.setUTCDate(date.getUTCDate()+Number(days));return date.toISOString().slice(0,10);
}
var syyFreshState=null;
function syyDataRevision(){return syyFreshState?syyFreshState.revision:0;}
function syyDataLoaded(){if(syyFreshState){syyFreshState.busy=false;syyFreshState.lastLoaded=Date.now();syyFreshState.dirty=syyFreshState.startRevision!==syyFreshState.revision;}}
function syyDataFailed(){if(syyFreshState)syyFreshState.busy=false;}
function syyRegisterFreshness(options){
  var state=syyFreshState={revision:0,startRevision:0,lastLoaded:Date.now(),lastAttempt:0,busy:false,dirty:false,active:window.parent===window};
  function refresh(){
    if(!state.active||document.hidden||state.busy||Date.now()-state.lastAttempt<10000||options.canRefresh&& !options.canRefresh())return;
    if(!state.dirty&&Date.now()-state.lastLoaded<120000)return;
    state.busy=true;state.startRevision=state.revision;state.lastAttempt=Date.now();options.reload();
  }
  window.addEventListener('message',function(event){
    if(!syyTrustedParentMessage(event))return;var data=event.data;
    if(data.action==='PAGE_HIDDEN'){state.active=false;return;}
    if(data.action==='PAGE_ACTIVATED'){state.active=true;refresh();return;}
    if(['STOCK_DELTA','PRODUCT_DELTA','MASTER_DELTA'].indexOf(data.action)<0)return;
    state.revision++;state.dirty=true;
    if(data.action==='STOCK_DELTA'&&options.stock)options.stock(data.productStocks);
    if(data.action==='PRODUCT_DELTA'&&options.product)options.product(data.product,!!data.deleted);
    if(data.action==='MASTER_DELTA'&&options.master)options.master(data);
    if(data.action==='MASTER_DELTA' && state.active)setTimeout(refresh,500);
  });
  window.addEventListener('load',function(){syyPostParent({action:'PAGE_READY'});});
  window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',refresh);
  setInterval(refresh,60000);
  return {refresh:refresh};
}
function syyApplyProductRows(rows,product,deleted){
  var code=product.productCode||product.id,index=rows.findIndex(function(p){return (p.productCode||p.id)===code;});
  if(deleted){if(index>=0)rows.splice(index,1);}else if(index>=0)rows[index]=Object.assign({},rows[index],product);else rows.push(Object.assign({},product));
}
function syyApplyStockRows(rows,stocks){(stocks||[]).forEach(function(stock){var row=rows.find(function(p){return (p.productCode||p.id)===stock.productCode;});if(row)row.currentStock=Number(stock.currentStock);});}
/* ── escape / format ── */
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// ★ ใช้แทน esc() เฉพาะตอนฝังค่าไว้ในสตริง JS ที่ครอบด้วย ' อยู่แล้ว (เช่น onclick="fn('...')")
//   esc() เพียงอย่างเดียวไม่ escape เครื่องหมาย ' — ถ้าค่านั้นมี ' ปนอยู่จะหลุดออกจากสตริงกลางทาง
//   ทำให้ onclick พังหรือรันโค้ดแปลกปลอมได้ ปัจจุบันทุกจุดที่ใช้ esc() แบบนี้ฝังแต่รหัส/รหัสเอกสารที่
//   ระบบสร้างเอง (ไม่มี ' ปนอยู่แน่ๆ) จึงยังไม่เคยเป็นปัญหาจริง แต่เป็นจุดเสี่ยงถ้าวันหลังมีใครเผลอเอา
//   ข้อความที่ผู้ใช้พิมพ์เองมาฝังแบบเดียวกัน
function escJs(v){return esc(v).replace(/'/g,"\\'");}
function num(v){return parseFloat(v)||0;}
function money(n){return '฿ '+num(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});}
var TH_MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(iso,withTime){
  var d=new Date(iso);
  if(isNaN(d.getTime())) return iso||'-';
  var s=d.getDate()+' '+TH_MONTHS[d.getMonth()]+' '+(d.getFullYear()+543);
  if(withTime) s+=' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return s;
}

/* ── Toast: ใช้แทน popup "บันทึกสำเร็จ" ที่ต้องกดตกลง ── */
function toast(msg,type,ms){
  var wrap=document.getElementById('toastWrap');
  if(!wrap){wrap=document.createElement('div');wrap.id='toastWrap';wrap.className='toast-wrap';document.body.appendChild(wrap);}
  var t=document.createElement('div');
  t.className='toast '+(type||'ok');
  var ic=type==='err'?'✕':(type==='warn'?'!':'✓');
  t.innerHTML='<span class="ic">'+ic+'</span><span>'+esc(msg)+'</span>';
  wrap.appendChild(t);
  setTimeout(function(){t.classList.add('out');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},260);},ms||2800);
}

/* ── Modal: เปิด/ปิด (ทุกหน้าได้เหมือนกัน) ──
   ★ Static/Persistent Modal — ปิดได้เฉพาะกดปุ่มในตัว Modal เอง (× / ยกเลิก / บันทึก / ปิด ฯลฯ
   ซึ่งเรียก closeModal() ตรงๆ อยู่แล้วทุกจุด) ไม่มีทางปิดโดยไม่ตั้งใจจากคลิกฉากหลังหรือกด Esc
   เพื่อกันข้อมูลที่กรอกในฟอร์มหายจากการคลิกพลาด — ใช้จุดเดียวนี้จุดเดียวทั้งโปรเจกต์ ไม่ต้องแก้ทีละหน้า */
var syyModalStack=[],syyModalInert=new Map(),syyModalBodyOverflow='';
function syyModalFocusables(modal){return Array.from(modal.querySelectorAll('button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')).filter(function(element){return !element.closest('[inert]')&&element.getClientRects().length&&getComputedStyle(element).visibility!=='hidden'&& !element.classList.contains('syy-select-native');});}
function syySyncModals(){
  var active=Array.from(document.querySelectorAll('.modal-overlay.active')),closed=syyModalStack.filter(function(item){return active.indexOf(item.element)<0;});
  syyModalStack=syyModalStack.filter(function(item){return active.indexOf(item.element)>=0;});
  active.forEach(function(element){if(syyModalStack.some(function(item){return item.element===element;}))return;
    if(!syyModalStack.length)syyModalBodyOverflow=document.body.style.overflow;
    var dialog=element.querySelector('.modal-box,.modal')||element;dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.tabIndex=-1;
    var title=dialog.querySelector('.modal-title,h2,h3');if(title){if(!title.id)title.id='dialog-title-'+element.id;dialog.setAttribute('aria-labelledby',title.id);}else dialog.setAttribute('aria-label','หน้าต่างข้อมูล');
    syyModalStack.push({element:element,dialog:dialog,returnFocus:document.activeElement});
    setTimeout(function(){if(syyModalStack.at(-1)?.element===element)(syyModalFocusables(element)[0]||dialog).focus();},0);
  });
  syyModalInert.forEach(function(value,element){element.inert=value;});syyModalInert.clear();
  var top=syyModalStack.at(-1);
  if(top){document.body.style.overflow='hidden';var branch=top.element;
    while(branch&&branch!==document.body){var parent=branch.parentElement;if(!parent)break;Array.from(parent.children).forEach(function(element){if(element!==branch&&!element.classList.contains('swal2-container')){syyModalInert.set(element,element.inert);element.inert=true;}});branch=parent;}
  }
  else document.body.style.overflow=syyModalBodyOverflow;
  if(closed.length){var target=closed.at(-1).returnFocus;if(target&&target.isConnected&&!target.closest('[inert]'))target.focus();else if(top)(syyModalFocusables(top.element)[0]||top.dialog).focus();}
}
function openModal(id){var element=document.getElementById(id);if(!element)return;element.classList.add('active');if(window.SYYSelect)SYYSelect.refresh(element);syySyncModals();}
function closeModal(id){var element=document.getElementById(id);if(element&&window.SYYPassword)SYYPassword.hide(element);if(window.SYYSelect)SYYSelect.closeActive();if(element)element.classList.remove('active');syySyncModals();}
document.addEventListener('keydown',function(event){
  var top=syyModalStack.at(-1);if(!top||event.key!=='Tab'||document.querySelector('.swal2-container'))return;var targets=syyModalFocusables(top.element);
  if(!targets.length){event.preventDefault();top.dialog.focus();return;}
  var first=targets[0],last=targets.at(-1);if(event.shiftKey&&(document.activeElement===first||!top.element.contains(document.activeElement))){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&(document.activeElement===last||!top.element.contains(document.activeElement))){event.preventDefault();first.focus();}
});
document.addEventListener('focusin',function(event){var top=syyModalStack.at(-1);if(top&&!document.querySelector('.swal2-container')&&!top.element.contains(event.target))(syyModalFocusables(top.element)[0]||top.dialog).focus();});
document.addEventListener('DOMContentLoaded',function(){new MutationObserver(function(records){if(records.some(function(record){return record.target.classList?.contains('modal-overlay');}))syySyncModals();}).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});});

    '.syy-select-empty{padding:13px;text-align:center;color:#94a3b8;font-size:12px}.syy-select-meta{padding:5px 9px;border-top:1px solid #f1f5f9;font-size:10.5px;color:#94a3b8;background:#f8fafc}',
    '@media(max-width:767px){.syy-select:not(.syy-select-block){min-width:110px}.syy-select-panel{min-width:min(280px,calc(100vw - 16px))}}'
  ].join('');
  (document.head||document.documentElement).appendChild(st);

ensureSYYSelectRuntimeStyles();

var SYYSelect=(function(){
  var registry=new WeakMap(),active=null,RENDER_LIMIT=200;
  function norm(v){return String(v==null?'':v).toLocaleLowerCase('th-TH').normalize('NFKC').trim();}
  function position(inst){
    if(!inst||!inst.wrap.classList.contains('open'))return;
    var r=inst.control.getBoundingClientRect(),p=inst.panel,margin=8;
    var width=Math.max(r.width,220),maxWidth=window.innerWidth-margin*2;
    width=Math.min(width,maxWidth);
    var left=Math.min(Math.max(margin,r.left),window.innerWidth-width-margin);
    var below=window.innerHeight-r.bottom-margin,above=r.top-margin;
    p.style.left=Math.round(left)+'px';p.style.width=Math.round(width)+'px';p.style.right='auto';
    if(below>=180||below>=above){p.style.top=Math.round(r.bottom+4)+'px';p.style.bottom='auto';p.style.maxHeight=Math.max(150,Math.min(360,below))+'px';}
    else{p.style.top='auto';p.style.bottom=Math.round(window.innerHeight-r.top+4)+'px';p.style.maxHeight=Math.max(150,Math.min(360,above))+'px';}
  }
  function close(inst){inst=inst||active;if(!inst)return;inst.wrap.classList.remove('open');inst.panel.removeAttribute('data-syy-open');inst.control.setAttribute('aria-expanded','false');if(active===inst)active=null;}
  function enhance(sel){
    if(!sel||registry.has(sel)||sel.multiple||sel.dataset.syyNoSearch==='true')return;
    var wrap=document.createElement('div');wrap.className='syy-select';
    if(sel.closest('.form-group,.form-grid'))wrap.classList.add('syy-select-block');
    if(sel.closest('.toolbar,.pagination-bar,.pill-row,.page-head')||sel.classList.contains('page-size-select')||sel.classList.contains('dash-picksel'))wrap.classList.add('syy-select-compact');
    var control=document.createElement('button');control.type='button';control.className='syy-select-control';control.setAttribute('aria-haspopup','listbox');control.setAttribute('aria-expanded','false');
    var label=document.createElement('span');label.className='syy-select-label';var caret=document.createElement('span');caret.className='syy-select-caret';caret.textContent='⌄';control.appendChild(label);control.appendChild(caret);
    var panel=document.createElement('div');panel.className='syy-select-panel';
    var search=document.createElement('input');search.type='search';search.className='syy-select-search';search.placeholder='ค้นหา...';search.autocomplete='off';
    var list=document.createElement('div');list.className='syy-select-list';list.setAttribute('role','listbox');
    var meta=document.createElement('div');meta.className='syy-select-meta';panel.appendChild(search);panel.appendChild(list);panel.appendChild(meta);
    sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);wrap.appendChild(control);(sel.closest('.modal-overlay')||document.body).appendChild(panel);sel.classList.add('syy-select-native');sel.style.position='absolute';sel.style.opacity='0';sel.style.pointerEvents='none';sel.style.width='1px';sel.style.height='1px';sel.style.margin='0';sel.style.padding='0';sel.setAttribute('aria-hidden','true');sel.tabIndex=-1;
    var inst={sel:sel,wrap:wrap,control:control,label:label,panel:panel,search:search,list:list,meta:meta};
    function sync(){var o=sel.options[sel.selectedIndex];label.textContent=o?o.text:'เลือก...';control.disabled=sel.disabled;}
    function render(q){
      var nq=norm(q),matches=[];Array.from(sel.options).forEach(function(o,i){if(o.disabled&&!o.value)return;if(nq&&norm(o.text).indexOf(nq)<0&&norm(o.value).indexOf(nq)<0)return;matches.push({o:o,i:i});});
      var frag=document.createDocumentFragment();matches.slice(0,RENDER_LIMIT).forEach(function(x){var b=document.createElement('button');b.type='button';b.className='syy-select-option'+(x.o.selected?' selected':'');b.textContent=x.o.text;b.setAttribute('role','option');b.setAttribute('aria-selected',x.o.selected?'true':'false');b.onclick=function(){sel.selectedIndex=x.i;sel.dispatchEvent(new Event('change',{bubbles:true}));sync();close(inst);};frag.appendChild(b);});
      list.innerHTML='';if(!matches.length){var e=document.createElement('div');e.className='syy-select-empty';e.textContent='ไม่พบข้อมูล';list.appendChild(e);}else list.appendChild(frag);
      meta.textContent=matches.length>RENDER_LIMIT?'แสดง '+RENDER_LIMIT+' จาก '+matches.length+' รายการ · พิมพ์เพิ่มเพื่อกรอง':'ทั้งหมด '+matches.length+' รายการ';
    }
    function open(){if(control.disabled)return;if(active&&active!==inst)close(active);active=inst;sync();wrap.classList.add('open');panel.setAttribute('data-syy-open','true');control.setAttribute('aria-expanded','true');search.value='';render('');position(inst);setTimeout(function(){search.focus();},0);}
    control.onclick=function(){wrap.classList.contains('open')?close(inst):open();};
    control.onkeydown=function(e){if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();open();}};
    search.oninput=function(){render(search.value);position(inst);};
    function keynav(e){var opts=Array.from(list.querySelectorAll('.syy-select-option')),idx=opts.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();(opts[Math.min(idx+1,opts.length-1)]||opts[0])?.focus();}else if(e.key==='ArrowUp'){e.preventDefault();(opts[Math.max(idx-1,0)]||opts[opts.length-1])?.focus();}else if(e.key==='Escape'){e.preventDefault();close(inst);control.focus();}}
    search.onkeydown=keynav;list.onkeydown=keynav;
    new MutationObserver(function(){sync();if(wrap.classList.contains('open'))render(search.value);}).observe(sel,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});
    sel.addEventListener('change',sync);registry.set(sel,inst);sync();
  }
  function init(root){root=root||document;if(root.matches&&root.matches('select'))enhance(root);if(root.querySelectorAll)root.querySelectorAll('select').forEach(enhance);}
  function refresh(root){init(root);if(root&&root.matches&&root.matches('select')){var one=registry.get(root);if(one){var o=root.options[root.selectedIndex];one.label.textContent=o?o.text:'เลือก...';}}if((root||document).querySelectorAll)(root||document).querySelectorAll('select').forEach(function(sel){var x=registry.get(sel);if(x){var o=sel.options[sel.selectedIndex];x.label.textContent=o?o.text:'เลือก...';x.control.disabled=sel.disabled;}});}
  function documentClick(e){if(active&&!active.wrap.contains(e.target)&&!active.panel.contains(e.target))close(active);}
  function reposition(){if(active)position(active);}
  return {init:init,refresh:refresh,enhance:enhance,documentClick:documentClick,reposition:reposition,closeActive:function(){close(active);}};
})();
window.SYYSelect=SYYSelect;

window.addEventListener('resize',SYYSelect.reposition,{passive:true});window.addEventListener('scroll',SYYSelect.reposition,true);

/* ── Skeleton / Empty state ── */
function skeletonRows(cols,rows){
  var out='';
  for(var r=0;r<(rows||4);r++){
    out+='<tr>';
    for(var c=0;c<cols;c++){
      var w=[70,90,60,50,80][c%5];
      out+='<td><span class="sk" style="width:'+w+'%"></span></td>';
    }
    out+='</tr>';
  }
  return out;
}
function emptyStateHtml(colspan,opt){
  opt=opt||{};
  var ac='';
  (opt.actions||[]).forEach(function(a){
    ac+='<button type="button" class="btn '+(a.primary?'btn-primary':'btn-ghost')+'" onclick="'+a.onclick+'">'+esc(a.label)+'</button>';
  });
  return '<tr><td colspan="'+colspan+'"><div class="empty-state">'+
    '<div class="ic">'+(opt.icon||'📭')+'</div>'+
    '<div class="ti">'+esc(opt.title||'ไม่พบข้อมูล')+'</div>'+
    (opt.sub?'<div class="su">'+esc(opt.sub)+'</div>':'')+
    (ac?'<div class="ac">'+ac+'</div>':'')+
    '</div></td></tr>';
}

/* ── ปุ่มที่กำลังโหลด ── */
function btnBusy(el,text){
  if(!el) return;
  el.dataset.label=el.innerHTML;
  el.disabled=true;
  el.innerHTML='<span class="spinner"></span>'+(text||'กำลังบันทึก...');
}
function btnDone(el){
  if(!el) return;
  el.disabled=false;
  if(el.dataset.label) el.innerHTML=el.dataset.label;
}

/* ── ความหนาแน่นแถว (จำค่าไว้ต่อเบราว์เซอร์) ── */
function initDensity(){
  var d=localStorage.getItem('syy_density')||'normal';
  document.body.setAttribute('data-density',d);
}
function toggleDensity(){
  var d=document.body.getAttribute('data-density')==='compact'?'normal':'compact';
  document.body.setAttribute('data-density',d);
  localStorage.setItem('syy_density',d);
  toast(d==='compact'?'แสดงแบบแน่น':'แสดงแบบสบายตา');
}

/* ── แจ้ง index (parent shell) ว่าข้อมูลเปลี่ยน — แยกตามผลกระทบจริง กันยิง Firestore reads เกินจำเป็น
   ★ FIX (โควตา Firestore Reads): เดิมมี notifyParentRefresh() ตัวเดียวใช้ร่วมกันทุกหน้า แล้ว index.html
   ตีความเป็น "รีโหลด dashboard เต็ม" (อ่าน Stock_Movements ทั้งหมด + Master_Products + Purchase_Orders)
   ทุกครั้ง — ทำให้บันทึก/ลบ 1 รายการในหน้า master data ที่ไม่เกี่ยวกับสต๊อกเลย (โซน/หมวดหมู่/แบรนด์/
   ผู้จำหน่าย/รุ่นรถ/ลูกค้า) ไปลากอ่านประวัติสต๊อกทั้งร้านซ้ำเบื้องหลังโดยไม่จำเป็น แยกเป็น 3 ระดับ:
     1) REFRESH_DROPDOWNS — ข้อมูลที่เป็น dropdown ของฟอร์มอื่น (brand/category/vendor/zone/car) เปลี่ยน
        → index.html แค่ loadMasters() (ใช้ cache เดิม เบามาก)
     2) REFRESH_PRODUCTS  — สินค้าเปลี่ยน (เพิ่ม/แก้/ลบ) → อ่านแค่ Master_Products ใหม่ ไม่แตะ
        Stock_Movements/Purchase_Orders เพราะบันทึกสินค้าไม่ได้สร้างรายการเคลื่อนไหวสต๊อก
     3) REFRESH_STOCK_FULL — สต๊อกเคลื่อนไหวจริง (ตัดสต๊อก) → ต้องรีโหลด dashboard เต็มเท่านั้น */

}

}

}

}

/* ── SweetAlert2 helper (เหลือใช้เฉพาะยืนยัน / error) ── */
/* ★ ทุกกล่อง SweetAlert ปิดได้เฉพาะกดปุ่มในตัวเองเท่านั้น (allowOutsideClick/allowEscapeKey: false)
   ให้สอดคล้องกับนโยบาย Static/Persistent Modal เดียวกับ .modal-overlay (ดู openModal/closeModal
   ด้านบน) — กันคลิกพลาด/กด Esc หลุดโดยไม่ตั้งใจ โดยเฉพาะ swyConfirm ที่เป็นกล่องยืนยันการกระทำสำคัญ
   (เช่น ลบข้อมูล/ยืนยันตัดสต๊อก) */
function swySuccess(title,html){
  return Swal.fire({icon:'success',title:title,html:html||'',confirmButtonText:'ตกลง',
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',confirmButton:'swy-confirm-btn'},buttonsStyling:false});
}
function swyError(title,html){
  return Swal.fire({icon:'error',title:title,html:html||'',confirmButtonText:'ตกลง',
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',confirmButton:'swy-confirm-btn danger'},buttonsStyling:false});
}
function swyWarning(title,html){
  return Swal.fire({icon:'warning',title:title,html:html||'',confirmButtonText:'ตกลง',
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',confirmButton:'swy-confirm-btn'},buttonsStyling:false});
}
function swyConfirm(o){
  return Swal.fire({
    icon:o.icon||'question',title:o.title,html:o.html||'',showCancelButton:true,
    confirmButtonText:o.confirmText||'ยืนยัน',cancelButtonText:o.cancelText||'ยกเลิก',reverseButtons:true,
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',
      confirmButton:'swy-confirm-btn'+(o.danger?' danger':''),cancelButton:'swy-cancel-btn'},
    buttonsStyling:false
  }).then(function(r){return r.isConfirmed;});
}

/* ── เรียก backend: ต้องผ่าน apiGateway เท่านั้น (เช็คสิทธิ์ role + ลง Activity_Log ทุกครั้ง) ──
   ★ FIX: เดิมถ้าไม่มี token จะเรียกฟังก์ชัน backend ตรงๆ (runner[fnName]) ข้าม apiGateway ทั้งหมด —
   ไม่เช็ค role, ไม่ลง log — เป็นช่องโหว่จริงถ้าหน้าไหนโหลดมาโดยไม่มี token (เช่นเปิด URL ตรงๆ)
   หน้า login ไม่ได้เรียกผ่าน callApi() นี้เลย (เรียก google.script.run ตรงๆ เฉพาะฟังก์ชัน auth ที่
   ตั้งใจเปิดให้ก่อน login อยู่แล้ว — authLogin/authForgotPassword/authResetPassword/ฯลฯ) จึงตัด
   ทางลัดนี้ออกได้โดยไม่กระทบการ login */
function syyCallApiRaw(fnName,args,onSuccess,onFailure){
  var token=(typeof AUTH_TOKEN!=='undefined')?AUTH_TOKEN:'';
  if(!token){
    if(typeof WEB_APP_URL!=='undefined') window.top.location.href=WEB_APP_URL+'?page=login';
    return;
  }
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.__authError){
        swyError('เซสชันหมดอายุ','กรุณาเข้าสู่ระบบใหม่').then(function(){
          if(typeof WEB_APP_URL!=='undefined') window.top.location.href=WEB_APP_URL+'?page=login';
        });
        return;
      }
      if(res && res.success===false && /^(get|fetch)/.test(fnName)) {
        if(onFailure) onFailure({message:res.message});
        else swyError('โหลดข้อมูลไม่สำเร็จ',esc(res.message||'กรุณาลองใหม่'));
        return;
      }
      if(onSuccess) onSuccess(res);
    })
    .withFailureHandler(onFailure||function(err){ swyError('เกิดข้อผิดพลาด',esc(JSON.stringify(err))); })
    .apiGateway(token,fnName,args||[],navigator.userAgent);
}

// Fetch only requested pages; incomplete lists are visibly marked and cannot claim full totals.
function syyDocumentPager(options){
 var info={hasMore:false,nextCursor:''},generation=0,busy=false;
 var host=document.createElement('div');host.className='pagination-bar';host.style.cssText='padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap';host.setAttribute('aria-live','polite');
 host.innerHTML='<span></span><button type="button" class="btn btn-ghost">โหลดเพิ่ม</button><button type="button" class="btn btn-ghost">โหลดทั้งหมดเพื่อสรุป</button>';
 document.querySelector(options.container).appendChild(host);var label=host.querySelector('span'),buttons=host.querySelectorAll('button');
 function render(){label.textContent='โหลดแล้ว '+options.rows().length+' รายการ'+(info.hasMore?' · ยังไม่ครบ · ตัวกรอง/ผลรวมใช้เฉพาะรายการที่โหลด':' · ครบช่วงที่เลือก');buttons.forEach(function(b){b.hidden=!info.hasMore;b.style.display=info.hasMore?'':'none';b.disabled=busy;});}
 function next(all){if(busy||!info.hasMore)return;busy=true;render();var request=generation,year=options.year?options.year():null,params={cursor:info.nextCursor,pageSize:200};
 callApi(options.api,options.year?[year,params]:[params],function(data){if(request!==generation)return;busy=false;var rows=data&&data[options.key];if(!Array.isArray(rows)||!data.pageInfo){toast('หน้าข้อมูลไม่ถูกต้อง กรุณารีเฟรช','err');render();return;}
 var existing=options.rows(),seen={};existing.forEach(function(x){seen[x[options.id||'id']]=true;});rows.forEach(function(x){if(!seen[x[options.id||'id']])existing.push(x);});info=data.pageInfo;options.render();render();if(all&&info.hasMore)setTimeout(function(){if(request===generation)next(true);},0);
 },function(){if(request!==generation)return;busy=false;render();toast('โหลดเพิ่มไม่สำเร็จ ข้อมูลเดิมยังอยู่ กรุณาลองใหม่หรือรีเฟรช','err');});}
 buttons[0].onclick=function(){next(false);};buttons[1].onclick=function(){next(true);};
 return {reset:function(value){generation++;busy=false;info=value||{hasMore:false,nextCursor:''};render();},render:render,hasMore:function(){return !!info.hasMore;},busy:function(){return busy;},cancel:function(){generation++;busy=false;render();},next:next};
}

var syyPendingReads=new Map();
function callApi(fnName,args,onSuccess,onFailure){
 if(!/^(get|fetch)/.test(fnName))return syyCallApiRaw(fnName,args,onSuccess,onFailure);
 var key=fnName+JSON.stringify(args||[]),listeners=syyPendingReads.get(key);if(listeners){listeners.push({ok:onSuccess,fail:onFailure});return;}
 listeners=[{ok:onSuccess,fail:onFailure}];syyPendingReads.set(key,listeners);
 syyCallApiRaw(fnName,args,function(data){syyPendingReads.delete(key);listeners.forEach(function(x){try{if(x.ok)x.ok(data);}catch(e){setTimeout(function(){throw e;},0);}});},function(error){syyPendingReads.delete(key);listeners.forEach(function(x){if(x.fail)x.fail(error);else swyError('โหลดข้อมูลไม่สำเร็จ',esc(error.message||''));});});
}
