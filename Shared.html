<script>

/* ── escape / format ── */
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// ★ ใช้แทน esc() เฉพาะตอนฝังค่าไว้ในสตริง JS ที่ครอบด้วย ' อยู่แล้ว (เช่น onclick="fn('...')")
//   esc() เพียงอย่างเดียวไม่ escape เครื่องหมาย ' — ถ้าค่านั้นมี ' ปนอยู่จะหลุดออกจากสตริงกลางทาง
//   ทำให้ onclick พังหรือรันโค้ดแปลกปลอมได้ ปัจจุบันทุกจุดที่ใช้ esc() แบบนี้ฝังแต่รหัส/รหัสเอกสารที่
//   ระบบสร้างเอง (ไม่มี ' ปนอยู่แน่ๆ) จึงยังไม่เคยเป็นปัญหาจริง แต่เป็นจุดเสี่ยงถ้าวันหลังมีใครเผลอเอา
//   ข้อความที่ผู้ใช้พิมพ์เองมาฝังแบบเดียวกัน
function escJs(v){return esc(v).replace(/'/g,"\\'");}
function num(v){return parseFloat(v)||0;}
function money(n){return '฿ '+num(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});}
var TH_MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(iso,withTime){
  var d=new Date(iso);
  if(isNaN(d.getTime())) return iso||'-';
  var s=d.getDate()+' '+TH_MONTHS[d.getMonth()]+' '+(d.getFullYear()+543);
  if(withTime) s+=' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return s;
}

/* ── Toast: ใช้แทน popup "บันทึกสำเร็จ" ที่ต้องกดตกลง ── */
function toast(msg,type,ms){
  var wrap=document.getElementById('toastWrap');
  if(!wrap){wrap=document.createElement('div');wrap.id='toastWrap';wrap.className='toast-wrap';document.body.appendChild(wrap);}
  var t=document.createElement('div');
  t.className='toast '+(type||'ok');
  var ic=type==='err'?'✕':(type==='warn'?'!':'✓');
  t.innerHTML='<span class="ic">'+ic+'</span><span>'+esc(msg)+'</span>';
  wrap.appendChild(t);
  setTimeout(function(){t.classList.add('out');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},260);},ms||2800);
}

/* ── Modal: เปิด/ปิด (ทุกหน้าได้เหมือนกัน) ──
   ★ Static/Persistent Modal — ปิดได้เฉพาะกดปุ่มในตัว Modal เอง (× / ยกเลิก / บันทึก / ปิด ฯลฯ
   ซึ่งเรียก closeModal() ตรงๆ อยู่แล้วทุกจุด) ไม่มีทางปิดโดยไม่ตั้งใจจากคลิกฉากหลังหรือกด Esc
   เพื่อกันข้อมูลที่กรอกในฟอร์มหายจากการคลิกพลาด — ใช้จุดเดียวนี้จุดเดียวทั้งโปรเจกต์ ไม่ต้องแก้ทีละหน้า */
function openModal(id){
  var el=document.getElementById(id);
  if(!el) return;
  el.classList.add('active');
  if(window.SYYSelect) SYYSelect.refresh(el);
  var first=el.querySelector('input:not([type="hidden"]):not([disabled]),textarea:not([disabled]),.syy-select-control:not([disabled])');
  if(first) setTimeout(function(){first.focus();},60);
}
function closeModal(id){
  var el=document.getElementById(id);
  if(el) el.classList.remove('active');
}


/* ── SYY Searchable Select ────────────────────────────────────────────────
   Progressive enhancement for native <select>. Search is 100% client-side. */
function ensureSYYSelectRuntimeStyles(){
  if(document.getElementById('syy-select-runtime-style'))return;
  var st=document.createElement('style');st.id='syy-select-runtime-style';
  st.textContent=[
    '.syy-select{position:relative;display:inline-block;width:auto;min-width:160px;max-width:100%}',
    '.syy-select.syy-select-block{display:block;width:100%;min-width:0}',
    '.syy-select.syy-select-compact{width:auto;min-width:120px;flex:0 1 auto}',
    '.syy-select-native{position:absolute!important;opacity:0!important;pointer-events:none!important;width:1px!important;height:1px!important;margin:0!important;padding:0!important;overflow:hidden!important}',
    '.syy-select-control{width:100%;min-height:36px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#0f172a;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;font:inherit}',
    '.syy-select-control:focus,.syy-select.open .syy-select-control{outline:none;border-color:#005088;box-shadow:0 0 0 3px rgba(0,80,136,.12)}',
    '.syy-select-control:disabled{background:#f1f5f9;color:#64748b;cursor:not-allowed}',
    '.syy-select-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.syy-select-caret{color:#94a3b8;flex:none}',
    '.syy-select-panel{display:none;position:fixed;z-index:10000;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.18);overflow:hidden;min-width:220px;max-width:calc(100vw - 16px)}',
    '.syy-select.open .syy-select-panel{display:flex;flex-direction:column}',
    '.syy-select-search{width:calc(100% - 16px);margin:8px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;outline:none;font:inherit;flex:none;box-sizing:border-box}',
    '.syy-select-list{min-height:0;max-height:260px;overflow:auto;border-top:1px solid #f1f5f9;flex:1 1 auto}',
    '.syy-select-option{display:block;width:100%;border:0;background:#fff;text-align:left;padding:8px 11px;color:#334155;cursor:pointer;font:inherit}',
    '.syy-select-option:hover,.syy-select-option:focus{outline:none;background:#e6f0fa;color:#005088}.syy-select-option.selected{font-weight:600;background:#f8fbfe}',
    '.syy-select-empty{padding:13px;text-align:center;color:#94a3b8;font-size:12px}.syy-select-meta{padding:5px 9px;border-top:1px solid #f1f5f9;font-size:10.5px;color:#94a3b8;background:#f8fafc}',
    '@media(max-width:767px){.syy-select:not(.syy-select-block){min-width:110px}.syy-select-panel{min-width:min(280px,calc(100vw - 16px))}}'
  ].join('');
  (document.head||document.documentElement).appendChild(st);
}
ensureSYYSelectRuntimeStyles();

var SYYSelect=(function(){
  var registry=new WeakMap(),active=null,RENDER_LIMIT=200;
  function norm(v){return String(v==null?'':v).toLocaleLowerCase('th-TH').normalize('NFKC').trim();}
  function position(inst){
    if(!inst||!inst.wrap.classList.contains('open'))return;
    var r=inst.control.getBoundingClientRect(),p=inst.panel,margin=8;
    var width=Math.max(r.width,220),maxWidth=window.innerWidth-margin*2;
    width=Math.min(width,maxWidth);
    var left=Math.min(Math.max(margin,r.left),window.innerWidth-width-margin);
    var below=window.innerHeight-r.bottom-margin,above=r.top-margin;
    p.style.left=Math.round(left)+'px';p.style.width=Math.round(width)+'px';p.style.right='auto';
    if(below>=180||below>=above){p.style.top=Math.round(r.bottom+4)+'px';p.style.bottom='auto';p.style.maxHeight=Math.max(150,Math.min(360,below))+'px';}
    else{p.style.top='auto';p.style.bottom=Math.round(window.innerHeight-r.top+4)+'px';p.style.maxHeight=Math.max(150,Math.min(360,above))+'px';}
  }
  function close(inst){inst=inst||active;if(!inst)return;inst.wrap.classList.remove('open');inst.control.setAttribute('aria-expanded','false');if(active===inst)active=null;}
  function enhance(sel){
    if(!sel||registry.has(sel)||sel.multiple||sel.dataset.syyNoSearch==='true')return;
    var wrap=document.createElement('div');wrap.className='syy-select';
    if(sel.closest('.form-group,.form-grid'))wrap.classList.add('syy-select-block');
    if(sel.closest('.toolbar,.pagination-bar,.pill-row,.page-head')||sel.classList.contains('page-size-select')||sel.classList.contains('dash-picksel'))wrap.classList.add('syy-select-compact');
    var control=document.createElement('button');control.type='button';control.className='syy-select-control';control.setAttribute('aria-haspopup','listbox');control.setAttribute('aria-expanded','false');
    var label=document.createElement('span');label.className='syy-select-label';var caret=document.createElement('span');caret.className='syy-select-caret';caret.textContent='⌄';control.appendChild(label);control.appendChild(caret);
    var panel=document.createElement('div');panel.className='syy-select-panel';
    var search=document.createElement('input');search.type='search';search.className='syy-select-search';search.placeholder='ค้นหา...';search.autocomplete='off';
    var list=document.createElement('div');list.className='syy-select-list';list.setAttribute('role','listbox');
    var meta=document.createElement('div');meta.className='syy-select-meta';panel.appendChild(search);panel.appendChild(list);panel.appendChild(meta);
    sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);wrap.appendChild(control);wrap.appendChild(panel);sel.classList.add('syy-select-native');sel.style.position='absolute';sel.style.opacity='0';sel.style.pointerEvents='none';sel.style.width='1px';sel.style.height='1px';sel.style.margin='0';sel.style.padding='0';sel.setAttribute('aria-hidden','true');sel.tabIndex=-1;
    var inst={sel:sel,wrap:wrap,control:control,label:label,panel:panel,search:search,list:list,meta:meta};
    function sync(){var o=sel.options[sel.selectedIndex];label.textContent=o?o.text:'เลือก...';control.disabled=sel.disabled;}
    function render(q){
      var nq=norm(q),matches=[];Array.from(sel.options).forEach(function(o,i){if(o.disabled&&!o.value)return;if(nq&&norm(o.text).indexOf(nq)<0&&norm(o.value).indexOf(nq)<0)return;matches.push({o:o,i:i});});
      var frag=document.createDocumentFragment();matches.slice(0,RENDER_LIMIT).forEach(function(x){var b=document.createElement('button');b.type='button';b.className='syy-select-option'+(x.o.selected?' selected':'');b.textContent=x.o.text;b.setAttribute('role','option');b.setAttribute('aria-selected',x.o.selected?'true':'false');b.onclick=function(){sel.selectedIndex=x.i;sel.dispatchEvent(new Event('change',{bubbles:true}));sync();close(inst);};frag.appendChild(b);});
      list.innerHTML='';if(!matches.length){var e=document.createElement('div');e.className='syy-select-empty';e.textContent='ไม่พบข้อมูล';list.appendChild(e);}else list.appendChild(frag);
      meta.textContent=matches.length>RENDER_LIMIT?'แสดง '+RENDER_LIMIT+' จาก '+matches.length+' รายการ · พิมพ์เพิ่มเพื่อกรอง':'ทั้งหมด '+matches.length+' รายการ';
    }
    function open(){if(control.disabled)return;if(active&&active!==inst)close(active);active=inst;sync();wrap.classList.add('open');control.setAttribute('aria-expanded','true');search.value='';render('');position(inst);setTimeout(function(){search.focus();},0);}
    control.onclick=function(){wrap.classList.contains('open')?close(inst):open();};
    control.onkeydown=function(e){if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();open();}};
    search.oninput=function(){render(search.value);position(inst);};
    function keynav(e){var opts=Array.from(list.querySelectorAll('.syy-select-option')),idx=opts.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();(opts[Math.min(idx+1,opts.length-1)]||opts[0])?.focus();}else if(e.key==='ArrowUp'){e.preventDefault();(opts[Math.max(idx-1,0)]||opts[opts.length-1])?.focus();}else if(e.key==='Escape'){e.preventDefault();close(inst);control.focus();}}
    search.onkeydown=keynav;list.onkeydown=keynav;
    new MutationObserver(function(){sync();if(wrap.classList.contains('open'))render(search.value);}).observe(sel,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});
    sel.addEventListener('change',sync);registry.set(sel,inst);sync();
  }
  function init(root){root=root||document;if(root.matches&&root.matches('select'))enhance(root);if(root.querySelectorAll)root.querySelectorAll('select').forEach(enhance);}
  function refresh(root){init(root);if(root&&root.matches&&root.matches('select')){var one=registry.get(root);if(one){var o=root.options[root.selectedIndex];one.label.textContent=o?o.text:'เลือก...';}}if((root||document).querySelectorAll)(root||document).querySelectorAll('select').forEach(function(sel){var x=registry.get(sel);if(x){var o=sel.options[sel.selectedIndex];x.label.textContent=o?o.text:'เลือก...';x.control.disabled=sel.disabled;}});}
  function documentClick(e){if(active&&!active.wrap.contains(e.target))close(active);}
  function reposition(){if(active)position(active);}
  return {init:init,refresh:refresh,enhance:enhance,documentClick:documentClick,reposition:reposition};
})();
window.SYYSelect=SYYSelect;
document.addEventListener('click',SYYSelect.documentClick);
window.addEventListener('resize',SYYSelect.reposition,{passive:true});window.addEventListener('scroll',SYYSelect.reposition,true);
document.addEventListener('DOMContentLoaded',function(){
  SYYSelect.init(document);
  new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1)SYYSelect.init(n);});});}).observe(document.documentElement,{childList:true,subtree:true});
});

/* ── Skeleton / Empty state ── */
function skeletonRows(cols,rows){
  var out='';
  for(var r=0;r<(rows||4);r++){
    out+='<tr>';
    for(var c=0;c<cols;c++){
      var w=[70,90,60,50,80][c%5];
      out+='<td><span class="sk" style="width:'+w+'%"></span></td>';
    }
    out+='</tr>';
  }
  return out;
}
function emptyStateHtml(colspan,opt){
  opt=opt||{};
  var ac='';
  (opt.actions||[]).forEach(function(a){
    ac+='<button type="button" class="btn '+(a.primary?'btn-primary':'btn-ghost')+'" onclick="'+a.onclick+'">'+esc(a.label)+'</button>';
  });
  return '<tr><td colspan="'+colspan+'"><div class="empty-state">'+
    '<div class="ic">'+(opt.icon||'📭')+'</div>'+
    '<div class="ti">'+esc(opt.title||'ไม่พบข้อมูล')+'</div>'+
    (opt.sub?'<div class="su">'+esc(opt.sub)+'</div>':'')+
    (ac?'<div class="ac">'+ac+'</div>':'')+
    '</div></td></tr>';
}

/* ── ปุ่มที่กำลังโหลด ── */
function btnBusy(el,text){
  if(!el) return;
  el.dataset.label=el.innerHTML;
  el.disabled=true;
  el.innerHTML='<span class="spinner"></span>'+(text||'กำลังบันทึก...');
}
function btnDone(el){
  if(!el) return;
  el.disabled=false;
  if(el.dataset.label) el.innerHTML=el.dataset.label;
}

/* ── ความหนาแน่นแถว (จำค่าไว้ต่อเบราว์เซอร์) ── */
function initDensity(){
  var d=localStorage.getItem('syy_density')||'normal';
  document.body.setAttribute('data-density',d);
}
function toggleDensity(){
  var d=document.body.getAttribute('data-density')==='compact'?'normal':'compact';
  document.body.setAttribute('data-density',d);
  localStorage.setItem('syy_density',d);
  toast(d==='compact'?'แสดงแบบแน่น':'แสดงแบบสบายตา');
}

/* ── แจ้ง index (parent shell) ว่าข้อมูลเปลี่ยน — แยกตามผลกระทบจริง กันยิง Firestore reads เกินจำเป็น
   ★ FIX (โควตา Firestore Reads): เดิมมี notifyParentRefresh() ตัวเดียวใช้ร่วมกันทุกหน้า แล้ว index.html
   ตีความเป็น "รีโหลด dashboard เต็ม" (อ่าน Stock_Movements ทั้งหมด + Master_Products + Purchase_Orders)
   ทุกครั้ง — ทำให้บันทึก/ลบ 1 รายการในหน้า master data ที่ไม่เกี่ยวกับสต๊อกเลย (โซน/หมวดหมู่/แบรนด์/
   ผู้จำหน่าย/รุ่นรถ/ลูกค้า) ไปลากอ่านประวัติสต๊อกทั้งร้านซ้ำเบื้องหลังโดยไม่จำเป็น แยกเป็น 3 ระดับ:
     1) REFRESH_DROPDOWNS — ข้อมูลที่เป็น dropdown ของฟอร์มอื่น (brand/category/vendor/zone/car) เปลี่ยน
        → index.html แค่ loadMasters() (ใช้ cache เดิม เบามาก)
     2) REFRESH_PRODUCTS  — สินค้าเปลี่ยน (เพิ่ม/แก้/ลบ) → อ่านแค่ Master_Products ใหม่ ไม่แตะ
        Stock_Movements/Purchase_Orders เพราะบันทึกสินค้าไม่ได้สร้างรายการเคลื่อนไหวสต๊อก
     3) REFRESH_STOCK_FULL — สต๊อกเคลื่อนไหวจริง (ตัดสต๊อก) → ต้องรีโหลด dashboard เต็มเท่านั้น */
function notifyParentRefreshDropdowns(){
  try{ window.parent.postMessage({action:'REFRESH_DROPDOWNS'},'*'); }catch(e){}
}
function notifyParentRefreshProducts(){
  try{ window.parent.postMessage({action:'REFRESH_PRODUCTS'},'*'); }catch(e){}
}
function notifyParentRefreshStockFull(){
  try{ window.parent.postMessage({action:'REFRESH_STOCK_FULL'},'*'); }catch(e){}
}

/* ── SweetAlert2 helper (เหลือใช้เฉพาะยืนยัน / error) ── */
/* ★ ทุกกล่อง SweetAlert ปิดได้เฉพาะกดปุ่มในตัวเองเท่านั้น (allowOutsideClick/allowEscapeKey: false)
   ให้สอดคล้องกับนโยบาย Static/Persistent Modal เดียวกับ .modal-overlay (ดู openModal/closeModal
   ด้านบน) — กันคลิกพลาด/กด Esc หลุดโดยไม่ตั้งใจ โดยเฉพาะ swyConfirm ที่เป็นกล่องยืนยันการกระทำสำคัญ
   (เช่น ลบข้อมูล/ยืนยันตัดสต๊อก) */
function swySuccess(title,html){
  return Swal.fire({icon:'success',title:title,html:html||'',confirmButtonText:'ตกลง',
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',confirmButton:'swy-confirm-btn'},buttonsStyling:false});
}
function swyError(title,html){
  return Swal.fire({icon:'error',title:title,html:html||'',confirmButtonText:'ตกลง',
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',confirmButton:'swy-confirm-btn danger'},buttonsStyling:false});
}
function swyWarning(title,html){
  return Swal.fire({icon:'warning',title:title,html:html||'',confirmButtonText:'ตกลง',
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',confirmButton:'swy-confirm-btn'},buttonsStyling:false});
}
function swyConfirm(o){
  return Swal.fire({
    icon:o.icon||'question',title:o.title,html:o.html||'',showCancelButton:true,
    confirmButtonText:o.confirmText||'ยืนยัน',cancelButtonText:o.cancelText||'ยกเลิก',reverseButtons:true,
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',
      confirmButton:'swy-confirm-btn'+(o.danger?' danger':''),cancelButton:'swy-cancel-btn'},
    buttonsStyling:false
  }).then(function(r){return r.isConfirmed;});
}

/* ── เรียก backend: ต้องผ่าน apiGateway เท่านั้น (เช็คสิทธิ์ role + ลง Activity_Log ทุกครั้ง) ──
   ★ FIX: เดิมถ้าไม่มี token จะเรียกฟังก์ชัน backend ตรงๆ (runner[fnName]) ข้าม apiGateway ทั้งหมด —
   ไม่เช็ค role, ไม่ลง log — เป็นช่องโหว่จริงถ้าหน้าไหนโหลดมาโดยไม่มี token (เช่นเปิด URL ตรงๆ)
   หน้า login ไม่ได้เรียกผ่าน callApi() นี้เลย (เรียก google.script.run ตรงๆ เฉพาะฟังก์ชัน auth ที่
   ตั้งใจเปิดให้ก่อน login อยู่แล้ว — authLogin/authForgotPassword/authResetPassword/ฯลฯ) จึงตัด
   ทางลัดนี้ออกได้โดยไม่กระทบการ login */
function callApi(fnName,args,onSuccess,onFailure){
  var token=(typeof AUTH_TOKEN!=='undefined')?AUTH_TOKEN:'';
  if(!token){
    if(typeof WEB_APP_URL!=='undefined') window.top.location.href=WEB_APP_URL+'?page=login';
    return;
  }
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.__authError){
        swyError('เซสชันหมดอายุ','กรุณาเข้าสู่ระบบใหม่').then(function(){
          if(typeof WEB_APP_URL!=='undefined') window.top.location.href=WEB_APP_URL+'?page=login';
        });
        return;
      }
      if(onSuccess) onSuccess(res);
    })
    .withFailureHandler(onFailure||function(err){ swyError('เกิดข้อผิดพลาด',esc(JSON.stringify(err))); })
    .apiGateway(token,fnName,args||[],navigator.userAgent);
}
</script>
