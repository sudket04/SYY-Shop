<script>
/* ═══════════════════════════════════════════════════════════
   SYY Shop Control — Shared.html  (ฟังก์ชันกลางของทุกหน้า)
   ใช้: <?!= include('Shared'); ?>  ก่อน </body>
   ต้องมี SweetAlert2 โหลดไว้แล้วใน <head>
  <meta charset="UTF-8">
   ═══════════════════════════════════════════════════════════ */

/* ── escape / format ── */
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// ★ ใช้แทน esc() เฉพาะตอนฝังค่าไว้ในสตริง JS ที่ครอบด้วย ' อยู่แล้ว (เช่น onclick="fn('...')")
//   esc() เพียงอย่างเดียวไม่ escape เครื่องหมาย ' — ถ้าค่านั้นมี ' ปนอยู่จะหลุดออกจากสตริงกลางทาง
//   ทำให้ onclick พังหรือรันโค้ดแปลกปลอมได้ ปัจจุบันทุกจุดที่ใช้ esc() แบบนี้ฝังแต่รหัส/รหัสเอกสารที่
//   ระบบสร้างเอง (ไม่มี ' ปนอยู่แน่ๆ) จึงยังไม่เคยเป็นปัญหาจริง แต่เป็นจุดเสี่ยงถ้าวันหลังมีใครเผลอเอา
//   ข้อความที่ผู้ใช้พิมพ์เองมาฝังแบบเดียวกัน
function escJs(v){return esc(v).replace(/'/g,"\\'");}
function num(v){return parseFloat(v)||0;}
function money(n){return '฿ '+num(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});}
var TH_MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(iso,withTime){
  var d=new Date(iso);
  if(isNaN(d.getTime())) return iso||'-';
  var s=d.getDate()+' '+TH_MONTHS[d.getMonth()]+' '+(d.getFullYear()+543);
  if(withTime) s+=' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return s;
}

/* ── Toast: ใช้แทน popup "บันทึกสำเร็จ" ที่ต้องกดตกลง ── */
function toast(msg,type,ms){
  var wrap=document.getElementById('toastWrap');
  if(!wrap){wrap=document.createElement('div');wrap.id='toastWrap';wrap.className='toast-wrap';document.body.appendChild(wrap);}
  var t=document.createElement('div');
  t.className='toast '+(type||'ok');
  var ic=type==='err'?'✕':(type==='warn'?'!':'✓');
  t.innerHTML='<span class="ic">'+ic+'</span><span>'+esc(msg)+'</span>';
  wrap.appendChild(t);
  setTimeout(function(){t.classList.add('out');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},260);},ms||2800);
}

/* ── Modal: เปิด/ปิด (ทุกหน้าได้เหมือนกัน) ──
   ★ Static/Persistent Modal — ปิดได้เฉพาะกดปุ่มในตัว Modal เอง (× / ยกเลิก / บันทึก / ปิด ฯลฯ
   ซึ่งเรียก closeModal() ตรงๆ อยู่แล้วทุกจุด) ไม่มีทางปิดโดยไม่ตั้งใจจากคลิกฉากหลังหรือกด Esc
   เพื่อกันข้อมูลที่กรอกในฟอร์มหายจากการคลิกพลาด — ใช้จุดเดียวนี้จุดเดียวทั้งโปรเจกต์ ไม่ต้องแก้ทีละหน้า */
function openModal(id){
  var el=document.getElementById(id);
  if(!el) return;
  el.classList.add('active');
  var first=el.querySelector('.form-control:not([disabled]),.input:not([disabled])');
  if(first) setTimeout(function(){first.focus();},60);
}
function closeModal(id){
  var el=document.getElementById(id);
  if(el) el.classList.remove('active');
}


/* ── SYY Searchable Select ────────────────────────────────────────────────
   Progressive enhancement for native <select>. Existing .value and change
   handlers remain intact. Filtering is client-side and adds no Firestore read. */
var SYYSelect=(function(){
  var registry=new WeakMap();
  function norm(v){return String(v==null?'':v).toLocaleLowerCase('th-TH').normalize('NFKC').trim();}
  function enhance(sel){
    if(!sel||registry.has(sel)||sel.multiple||sel.dataset.syyNoSearch==='true')return;
    var wrap=document.createElement('div');wrap.className='syy-select';
    var control=document.createElement('button');control.type='button';control.className='syy-select-control';
    var label=document.createElement('span');label.className='syy-select-label';
    var caret=document.createElement('span');caret.className='syy-select-caret';caret.textContent='⌄';
    control.appendChild(label);control.appendChild(caret);
    var panel=document.createElement('div');panel.className='syy-select-panel';
    var search=document.createElement('input');search.type='search';search.className='syy-select-search';search.placeholder='ค้นหา...';search.autocomplete='off';
    var list=document.createElement('div');list.className='syy-select-list';panel.appendChild(search);panel.appendChild(list);
    sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);wrap.appendChild(control);wrap.appendChild(panel);sel.classList.add('syy-select-native');
    function sync(){var o=sel.options[sel.selectedIndex];label.textContent=o?o.text:'เลือก...';control.disabled=sel.disabled;}
    function render(q){
      var nq=norm(q),frag=document.createDocumentFragment(),shown=0;
      Array.from(sel.options).forEach(function(o,i){
        if(o.disabled&&!o.value)return;
        if(nq&&norm(o.text).indexOf(nq)<0&&norm(o.value).indexOf(nq)<0)return;
        var b=document.createElement('button');b.type='button';b.className='syy-select-option'+(o.selected?' selected':'');b.textContent=o.text;b.dataset.index=i;
        b.onclick=function(){sel.selectedIndex=i;sel.dispatchEvent(new Event('change',{bubbles:true}));sync();close();};frag.appendChild(b);shown++;
      });
      list.innerHTML='';if(!shown){var e=document.createElement('div');e.className='syy-select-empty';e.textContent='ไม่พบข้อมูล';list.appendChild(e);}else list.appendChild(frag);
    }
    function open(){if(control.disabled)return;document.querySelectorAll('.syy-select.open').forEach(function(x){if(x!==wrap)x.classList.remove('open');});wrap.classList.add('open');search.value='';render('');setTimeout(function(){search.focus();},0);}
    function close(){wrap.classList.remove('open');}
    control.onclick=function(){wrap.classList.contains('open')?close():open();};search.oninput=function(){render(search.value);};
    function keynav(e){var opts=Array.from(list.querySelectorAll('.syy-select-option')),idx=opts.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();(opts[Math.min(idx+1,opts.length-1)]||opts[0])?.focus();}if(e.key==='ArrowUp'){e.preventDefault();(opts[Math.max(idx-1,0)]||opts[opts.length-1])?.focus();}if(e.key==='Escape'){e.preventDefault();close();control.focus();}}
    search.onkeydown=keynav;list.onkeydown=keynav;document.addEventListener('click',function(e){if(!wrap.contains(e.target))close();});
    new MutationObserver(function(){sync();if(wrap.classList.contains('open'))render(search.value);}).observe(sel,{childList:true,subtree:true,attributes:true});
    sel.addEventListener('change',sync);registry.set(sel,{sync:sync});sync();
  }
  function init(root){(root||document).querySelectorAll('select').forEach(enhance);}
  function refresh(root){init(root);(root||document).querySelectorAll('select').forEach(function(s){var x=registry.get(s);if(x)x.sync();});}
  return {init:init,refresh:refresh,enhance:enhance};
})();
document.addEventListener('DOMContentLoaded',function(){SYYSelect.init(document);new MutationObserver(function(m){if(m.some(function(x){return x.addedNodes&&x.addedNodes.length;}))SYYSelect.init(document);}).observe(document.documentElement,{childList:true,subtree:true});});

/* ── Skeleton / Empty state ── */
function skeletonRows(cols,rows){
  var out='';
  for(var r=0;r<(rows||4);r++){
    out+='<tr>';
    for(var c=0;c<cols;c++){
      var w=[70,90,60,50,80][c%5];
      out+='<td><span class="sk" style="width:'+w+'%"></span></td>';
    }
    out+='</tr>';
  }
  return out;
}
function emptyStateHtml(colspan,opt){
  opt=opt||{};
  var ac='';
  (opt.actions||[]).forEach(function(a){
    ac+='<button type="button" class="btn '+(a.primary?'btn-primary':'btn-ghost')+'" onclick="'+a.onclick+'">'+esc(a.label)+'</button>';
  });
  return '<tr><td colspan="'+colspan+'"><div class="empty-state">'+
    '<div class="ic">'+(opt.icon||'📭')+'</div>'+
    '<div class="ti">'+esc(opt.title||'ไม่พบข้อมูล')+'</div>'+
    (opt.sub?'<div class="su">'+esc(opt.sub)+'</div>':'')+
    (ac?'<div class="ac">'+ac+'</div>':'')+
    '</div></td></tr>';
}

/* ── ปุ่มที่กำลังโหลด ── */
function btnBusy(el,text){
  if(!el) return;
  el.dataset.label=el.innerHTML;
  el.disabled=true;
  el.innerHTML='<span class="spinner"></span>'+(text||'กำลังบันทึก...');
}
function btnDone(el){
  if(!el) return;
  el.disabled=false;
  if(el.dataset.label) el.innerHTML=el.dataset.label;
}

/* ── ความหนาแน่นแถว (จำค่าไว้ต่อเบราว์เซอร์) ── */
function initDensity(){
  var d=localStorage.getItem('syy_density')||'normal';
  document.body.setAttribute('data-density',d);
}
function toggleDensity(){
  var d=document.body.getAttribute('data-density')==='compact'?'normal':'compact';
  document.body.setAttribute('data-density',d);
  localStorage.setItem('syy_density',d);
  toast(d==='compact'?'แสดงแบบแน่น':'แสดงแบบสบายตา');
}

/* ── แจ้ง index (parent shell) ว่าข้อมูลเปลี่ยน — แยกตามผลกระทบจริง กันยิง Firestore reads เกินจำเป็น
   ★ FIX (โควตา Firestore Reads): เดิมมี notifyParentRefresh() ตัวเดียวใช้ร่วมกันทุกหน้า แล้ว index.html
   ตีความเป็น "รีโหลด dashboard เต็ม" (อ่าน Stock_Movements ทั้งหมด + Master_Products + Purchase_Orders)
   ทุกครั้ง — ทำให้บันทึก/ลบ 1 รายการในหน้า master data ที่ไม่เกี่ยวกับสต๊อกเลย (โซน/หมวดหมู่/แบรนด์/
   ผู้จำหน่าย/รุ่นรถ/ลูกค้า) ไปลากอ่านประวัติสต๊อกทั้งร้านซ้ำเบื้องหลังโดยไม่จำเป็น แยกเป็น 3 ระดับ:
     1) REFRESH_DROPDOWNS — ข้อมูลที่เป็น dropdown ของฟอร์มอื่น (brand/category/vendor/zone/car) เปลี่ยน
        → index.html แค่ loadMasters() (ใช้ cache เดิม เบามาก)
     2) REFRESH_PRODUCTS  — สินค้าเปลี่ยน (เพิ่ม/แก้/ลบ) → อ่านแค่ Master_Products ใหม่ ไม่แตะ
        Stock_Movements/Purchase_Orders เพราะบันทึกสินค้าไม่ได้สร้างรายการเคลื่อนไหวสต๊อก
     3) REFRESH_STOCK_FULL — สต๊อกเคลื่อนไหวจริง (ตัดสต๊อก) → ต้องรีโหลด dashboard เต็มเท่านั้น */
function notifyParentRefreshDropdowns(){
  try{ window.parent.postMessage({action:'REFRESH_DROPDOWNS'},'*'); }catch(e){}
}
function notifyParentRefreshProducts(){
  try{ window.parent.postMessage({action:'REFRESH_PRODUCTS'},'*'); }catch(e){}
}
function notifyParentRefreshStockFull(){
  try{ window.parent.postMessage({action:'REFRESH_STOCK_FULL'},'*'); }catch(e){}
}

/* ── SweetAlert2 helper (เหลือใช้เฉพาะยืนยัน / error) ── */
/* ★ ทุกกล่อง SweetAlert ปิดได้เฉพาะกดปุ่มในตัวเองเท่านั้น (allowOutsideClick/allowEscapeKey: false)
   ให้สอดคล้องกับนโยบาย Static/Persistent Modal เดียวกับ .modal-overlay (ดู openModal/closeModal
   ด้านบน) — กันคลิกพลาด/กด Esc หลุดโดยไม่ตั้งใจ โดยเฉพาะ swyConfirm ที่เป็นกล่องยืนยันการกระทำสำคัญ
   (เช่น ลบข้อมูล/ยืนยันตัดสต๊อก) */
function swySuccess(title,html){
  return Swal.fire({icon:'success',title:title,html:html||'',confirmButtonText:'ตกลง',
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',confirmButton:'swy-confirm-btn'},buttonsStyling:false});
}
function swyError(title,html){
  return Swal.fire({icon:'error',title:title,html:html||'',confirmButtonText:'ตกลง',
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',confirmButton:'swy-confirm-btn danger'},buttonsStyling:false});
}
function swyWarning(title,html){
  return Swal.fire({icon:'warning',title:title,html:html||'',confirmButtonText:'ตกลง',
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',confirmButton:'swy-confirm-btn'},buttonsStyling:false});
}
function swyConfirm(o){
  return Swal.fire({
    icon:o.icon||'question',title:o.title,html:o.html||'',showCancelButton:true,
    confirmButtonText:o.confirmText||'ยืนยัน',cancelButtonText:o.cancelText||'ยกเลิก',reverseButtons:true,
    allowOutsideClick:false,allowEscapeKey:false,
    customClass:{popup:'swy-popup',title:'swy-title',htmlContainer:'swy-html',
      confirmButton:'swy-confirm-btn'+(o.danger?' danger':''),cancelButton:'swy-cancel-btn'},
    buttonsStyling:false
  }).then(function(r){return r.isConfirmed;});
}

/* ── เรียก backend: ต้องผ่าน apiGateway เท่านั้น (เช็คสิทธิ์ role + ลง Activity_Log ทุกครั้ง) ──
   ★ FIX: เดิมถ้าไม่มี token จะเรียกฟังก์ชัน backend ตรงๆ (runner[fnName]) ข้าม apiGateway ทั้งหมด —
   ไม่เช็ค role, ไม่ลง log — เป็นช่องโหว่จริงถ้าหน้าไหนโหลดมาโดยไม่มี token (เช่นเปิด URL ตรงๆ)
   หน้า login ไม่ได้เรียกผ่าน callApi() นี้เลย (เรียก google.script.run ตรงๆ เฉพาะฟังก์ชัน auth ที่
   ตั้งใจเปิดให้ก่อน login อยู่แล้ว — authLogin/authForgotPassword/authResetPassword/ฯลฯ) จึงตัด
   ทางลัดนี้ออกได้โดยไม่กระทบการ login */
function callApi(fnName,args,onSuccess,onFailure){
  var token=(typeof AUTH_TOKEN!=='undefined')?AUTH_TOKEN:'';
  if(!token){
    if(typeof WEB_APP_URL!=='undefined') window.top.location.href=WEB_APP_URL+'?page=login';
    return;
  }
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.__authError){
        swyError('เซสชันหมดอายุ','กรุณาเข้าสู่ระบบใหม่').then(function(){
          if(typeof WEB_APP_URL!=='undefined') window.top.location.href=WEB_APP_URL+'?page=login';
        });
        return;
      }
      if(onSuccess) onSuccess(res);
    })
    .withFailureHandler(onFailure||function(err){ swyError('เกิดข้อผิดพลาด',esc(JSON.stringify(err))); })
    .apiGateway(token,fnName,args||[],navigator.userAgent);
}
</script>
