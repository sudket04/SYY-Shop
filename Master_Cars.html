<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <?!= include('Styles'); ?>
</head>
<body>

<div class="page-head">
  <div class="crumb">
    <span>ข้อมูลหลัก</span><span class="sep">›</span>
    <b>ข้อมูลรถ</b>
    <span class="badge badge-mute" id="recordCount">—</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-ghost btn-icon" title="สลับความหนาแน่นแถว" onclick="toggleDensity()">≡</button>
    <button class="btn btn-ghost" onclick="loadTable()">🔄 รีเฟรช</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ เพิ่มรถยนต์</button>
  </div>
</div>

<div class="page-body">
  <div class="card">
    <div class="toolbar">
      <div class="search">
        <span class="ico">⌕</span>
        <input type="text" id="searchInput" class="input" placeholder="ค้นหารถยนต์ (ยี่ห้อ, รุ่น, รหัส)" oninput="onSearch()" autocomplete="off">
      </div>
      <span class="count" id="filterInfo"></span>
    </div>

    <div class="xlf-filter-summary" id="xlfSummary">
      <span id="xlfSummaryText"></span>
      <button type="button" onclick="XLF.clearAll(TABLE_KEY); renderRows();">ล้างตัวกรองทั้งหมด</button>
    </div>

    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:44px"><col style="width:100px"><col style="width:120px"><col style="width:110px">
          <col style="width:120px"><col style="width:90px"><col style="width:130px"><col><col style="width:100px">
        </colgroup>
        <thead id="theadMain"></thead>
        <tbody id="tbodyMain"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══ Modal: เพิ่ม / แก้ไข ═══ -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box" style="width:560px">
    <div class="modal-header">
      <span id="modalTitle">🚗 เพิ่มข้อมูลรถยนต์</span>
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
    </div>
    <form id="mainForm" onsubmit="handleSubmit(event)">
      <div class="modal-body">
        <div class="section-label">ข้อมูลรถยนต์</div>
        <div class="form-grid">
          <div class="form-group full">
            <label>รหัสอ้างอิง (Car ID)</label>
            <input type="text" id="fDocId" class="form-control" disabled placeholder="สร้างอัตโนมัติ">
          </div>
          <div class="form-group">
            <label>รหัสรุ่น</label>
            <input type="text" id="fModelCode" class="form-control" placeholder="เช่น KUN15, TGN36 (ไม่บังคับ)">
          </div>
          <div class="form-group">
            <label>ยี่ห้อ (Brand)</label>
            <select id="fBrand" class="form-control select">
              <option value="">-- เลือกรถยี่ห้อ --</option>
              <option value="Toyota">Toyota</option>
              <option value="Honda">Honda</option>
              <option value="Mitsubishi">Mitsubishi</option>
              <option value="Isuzu">Isuzu</option>
              <option value="Nissan">Nissan</option>
              <option value="Datsun">Datsun</option>
              <option value="Suzuki">Suzuki</option>
              <option value="Mazda">Mazda</option>
              <option value="Hino">Hino</option>
              <option value="Mercedes-Benz">Mercedes-Benz</option>
              <option value="BMW">BMW</option>
              <option value="Audi">Audi</option>
              <option value="Volkswagen">Volkswagen</option>
              <option value="Volvo">Volvo</option>
              <option value="Scania">Scania</option>
              <option value="Ford">Ford</option>
              <option value="Chevrolet">Chevrolet</option>
            </select>
          </div>
          <div class="form-group">
            <label>รุ่น (Model)</label>
            <input type="text" id="fModel" class="form-control" placeholder="เช่น Hilux Revo, D-Max">
          </div>
          <div class="form-group">
            <label>ปีรถ (Car Year)</label>
            <input type="text" id="fYear" class="form-control" placeholder="เช่น 2022 หรือ 2020-2024">
          </div>
          <div class="form-group full">
            <label>ประเภทรถ</label>
            <select id="fType" class="form-control select">
              <option value="">-- เลือกประเภทรถ --</option>
              <option value="บรรทุก 6 ล้อ">บรรทุก 6 ล้อ</option>
              <option value="บรรทุก 10 ล้อ">บรรทุก 10 ล้อ</option>
              <option value="หัวลาก 10 ล้อ">หัวลาก 10 ล้อ</option>
              <option value="หัวลาก 18 ล้อ">หัวลาก 18 ล้อ</option>
              <option value="กระบะตอนเดียว">กระบะตอนเดียว</option>
              <option value="กระบะแคบ">กระบะแคบ</option>
              <option value="กระบะ 4 ประตู">กระบะ 4 ประตู</option>
              <option value="เก๋ง 4 ประตู">เก๋ง 4 ประตู</option>
              <option value="เก๋ง 2 ประตู">เก๋ง 2 ประตู</option>
            </select>
          </div>
          <div class="form-group full">
            <label>หมายเหตุ</label>
            <input type="text" id="fNote" class="form-control" placeholder="รายละเอียดเพิ่มเติม">
          </div>
        </div>
        <div id="modalAlert" class="modal-alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('editModal')">ยกเลิก</button>
        <button type="submit" class="btn btn-primary" id="btnSave">💾 บันทึก</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══ Modal: ยืนยันลบ ═══ -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box" style="width:420px">
    <div class="modal-body" style="text-align:center;padding:30px 24px 18px">
      <div class="confirm-ic">🗑️</div>
      <h3 style="margin:15px 0 5px;color:var(--ink);font-size:18px;font-weight:600">ยืนยันการลบ?</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 15px">ลบแล้วกู้คืนไม่ได้ และสินค้าที่อ้างอิงรถรุ่นนี้จะแสดงรุ่นรถเป็นค่าว่าง</p>
      <div class="confirm-card" id="deleteTarget"></div>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button type="button" class="btn btn-ghost" style="min-width:100px" onclick="closeModal('deleteModal')">ยกเลิก</button>
      <button type="button" class="btn btn-danger" style="min-width:120px" id="btnDelete" onclick="execDelete()">🗑️ ลบข้อมูล</button>
    </div>
  </div>
</div>

<?!= include('XLFilter'); ?>
<?!= include('Shared'); ?>
<script>
  var AUTH_TOKEN  = "<?= authToken ?>";
  var WEB_APP_URL = "<?= webAppUrl ?>";

  var TABLE_KEY   = 'cars';
  var ENTITY      = 'รถยนต์';
  var API         = { list:'getCarsFull', save:'saveCar', del:'deleteCar' };
  var COLS        = [
    { col:'_code',      label:'รหัสรถ' },
    { col:'_modelCode', label:'รหัสรุ่น' },
    { col:'_brand',     label:'ยี่ห้อ' },
    { col:'_model',     label:'รุ่น' },
    { col:'_year',      label:'ปีรถ' },
    { col:'_type',      label:'ประเภท' },
    { col:'_note',      label:'หมายเหตุ' }
  ];

  var cache=[], editingId=null, deleteId=null, searchTimer=null;

  window.onload = function(){
    initDensity();
    document.getElementById('tbodyMain').innerHTML = skeletonRows(9,5);
    renderHead();
    loadTable();
  };

  XLF.bindHeaderClicks('#theadMain', function(){ return cache; }, renderRows);

  function renderHead(){
    document.getElementById('theadMain').innerHTML =
      '<tr><th class="text-center">#</th>' +
      COLS.map(function(c){ return XLF.th(c.label, TABLE_KEY, c.col); }).join('') +
      '<th class="text-center col-sticky-right">จัดการ</th></tr>';
  }

  function loadTable(){
    document.getElementById('recordCount').innerText='กำลังโหลด';
    document.getElementById('tbodyMain').innerHTML = skeletonRows(9,5);
    callApi(API.list, [], function(data){
      // normalize ชื่อ field ให้เหลือชื่อเดียวต่อคอลัมน์ ไม่ว่า backend จะคืนรูปแบบไหน
      cache = (data || []).map(function(item){
        item._code      = item.id || item.carCode || '';
        item._modelCode = item.Model_Code || item.modelCode || '';
        item._brand     = item.Brand || item.brand || '';
        item._model     = item.Model || item.model || '';
        item._year      = item.Year || item.Car_Year || item.year || '';
        item._type      = item.Type_Car || item.typeCar || '';
        item._note      = item.Note || item.note || '';
        return item;
      });
      renderRows();
    }, function(err){
      document.getElementById('tbodyMain').innerHTML = emptyStateHtml(9,{
        icon:'⚠️', title:'โหลดข้อมูลไม่สำเร็จ', sub:JSON.stringify(err),
        actions:[{label:'ลองอีกครั้ง',primary:true,onclick:'loadTable()'}]
      });
      document.getElementById('recordCount').innerText='ผิดพลาด';
    });
  }

  function onSearch(){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(renderRows,150);
  }

  function renderRows(){
    renderHead();
    var q=document.getElementById('searchInput').value.toLowerCase().trim();
    var searched = !q ? cache.slice() : cache.filter(function(it){
      return (it._code+it._modelCode+it._brand+it._model+it._year+it._type+it._note).toLowerCase().indexOf(q)>-1;
    });

    var rows = XLF.apply(TABLE_KEY, searched, COLS);

    var labels={}; COLS.forEach(function(c){labels[c.col]=c.label;});
    var sum=document.getElementById('xlfSummary');
    if(XLF.anyActiveFilter(TABLE_KEY)){
      sum.classList.add('show');
      document.getElementById('xlfSummaryText').innerText='กรองอยู่ '+rows.length+' จาก '+cache.length+' รายการ — '+XLF.activeSummary(TABLE_KEY,labels);
    } else sum.classList.remove('show');

    document.getElementById('recordCount').innerText = cache.length + ' รายการ';
    document.getElementById('filterInfo').innerText = (q||XLF.anyActiveFilter(TABLE_KEY)) ? 'แสดง '+rows.length+' รายการ' : '';

    var tbody=document.getElementById('tbodyMain');
    if(!rows.length){
      tbody.innerHTML = cache.length
        ? emptyStateHtml(9,{ title:'ไม่พบรายการที่ตรงกับที่ค้นหา', sub:'ลองลดคำค้นหรือล้างตัวกรอง',
            actions:[{label:'ล้างตัวกรอง',onclick:'clearAllFilters()'},{label:'+ เพิ่ม'+ENTITY,primary:true,onclick:'openAddModal()'}] })
        : emptyStateHtml(9,{ icon:'🚗', title:'ยังไม่มีข้อมูล'+ENTITY, sub:'เพิ่มรายการแรกเพื่อเริ่มใช้งาน',
            actions:[{label:'+ เพิ่ม'+ENTITY,primary:true,onclick:'openAddModal()'}] });
      return;
    }

    tbody.innerHTML = rows.map(function(it,i){
      var modelCode = it._modelCode ? '<span class="chip-code">'+esc(it._modelCode)+'</span>' : '<span class="cell-empty">—</span>';
      var year = it._year ? '<span class="chip-model">'+esc(it._year)+'</span>' : '<span class="cell-empty">—</span>';
      return '<tr>'+
        '<td class="text-center"><span class="rownum">'+(i+1)+'</span></td>'+
        '<td><span class="chip-code">'+esc(it._code)+'</span></td>'+
        '<td>'+modelCode+'</td>'+
        '<td style="font-weight:500;color:var(--ink)">'+esc(it._brand||'—')+'</td>'+
        '<td>'+esc(it._model||'—')+'</td>'+
        '<td class="text-center">'+year+'</td>'+
        '<td>'+esc(it._type||'—')+'</td>'+
        '<td style="color:var(--muted)">'+esc(it._note||'—')+'</td>'+
        '<td class="text-center col-sticky-right"><span class="row-actions">'+
          '<button class="btn btn-icon edit" title="แก้ไข" onclick="openEditModal(\''+escJs(it._code)+'\')">✏️</button>'+
          '<button class="btn btn-icon del" title="ลบ" onclick="confirmDelete(\''+escJs(it._code)+'\')">🗑️</button>'+
        '</span></td>'+
      '</tr>';
    }).join('');
  }

  function clearAllFilters(){
    XLF.clearAll(TABLE_KEY);
    document.getElementById('searchInput').value='';
    renderRows();
  }

  /* ── เพิ่ม / แก้ไข ── */
  function resetForm(){
    document.getElementById('mainForm').reset();
    document.getElementById('fDocId').value='';
    document.getElementById('fModelCode').value='';
    document.getElementById('fBrand').value='';
    document.getElementById('fModel').value='';
    document.getElementById('fYear').value='';
    document.getElementById('fType').value='';
    document.getElementById('fNote').value='';
  }

  function openAddModal(){
    editingId=null;
    resetForm();
    document.getElementById('modalTitle').innerText='🚗 เพิ่มข้อมูล'+ENTITY;
    document.getElementById('btnSave').innerHTML='💾 บันทึก';
    document.getElementById('modalAlert').className='modal-alert';
    openModal('editModal');
  }

  function openEditModal(id){
    var it=cache.find(function(x){return x._code===id;});
    if(!it){ toast('ไม่พบข้อมูล','err'); return; }
    editingId=id;
    resetForm();
    document.getElementById('fDocId').value=it._code;
    document.getElementById('fModelCode').value=it._modelCode;
    document.getElementById('fBrand').value=it._brand;
    document.getElementById('fModel').value=it._model;
    document.getElementById('fYear').value=it._year;
    document.getElementById('fType').value=it._type;
    document.getElementById('fNote').value=it._note;
    document.getElementById('modalTitle').innerText='✏️ แก้ไขข้อมูล'+ENTITY+' ('+id+')';
    document.getElementById('btnSave').innerHTML='💾 บันทึกการแก้ไข';
    document.getElementById('modalAlert').className='modal-alert';
    openModal('editModal');
  }

  function handleSubmit(e){
    e.preventDefault();
    var alertEl=document.getElementById('modalAlert');
    alertEl.className='modal-alert';

    var inputModelCode = document.getElementById('fModelCode').value.trim();
    if(inputModelCode !== ''){
      var isDuplicate = cache.some(function(it){
        if(editingId && it._code===editingId) return false;
        return it._modelCode && it._modelCode.toLowerCase() === inputModelCode.toLowerCase();
      });
      if(isDuplicate){
        alertEl.className='modal-alert error';
        alertEl.innerText='❌ รหัสรุ่น "'+inputModelCode+'" มีอยู่ในระบบแล้ว';
        return;
      }
    }

    var formData = {
      docId    : editingId || null,
      modelCode: inputModelCode,
      brand    : document.getElementById('fBrand').value.trim(),
      model    : document.getElementById('fModel').value.trim(),
      year     : document.getElementById('fYear').value.trim(),
      typeCar  : document.getElementById('fType').value.trim(),
      note     : document.getElementById('fNote').value.trim()
    };

    var btn=document.getElementById('btnSave');
    btnBusy(btn);

    callApi(API.save, [formData], function(res){
      btnDone(btn);
      if(res && res.success){
        closeModal('editModal');
        toast((editingId?'แก้ไข':'เพิ่ม')+ENTITY+'เรียบร้อย');
        loadTable();
        notifyParentRefreshDropdowns();
      } else {
        alertEl.className='modal-alert error';
        alertEl.innerText='❌ '+((res&&res.message)||'บันทึกไม่สำเร็จ');
      }
    }, function(err){
      btnDone(btn);
      alertEl.className='modal-alert error';
      alertEl.innerText='❌ '+JSON.stringify(err);
    });
  }

  /* ── ลบ ── */
  function confirmDelete(id){
    var it=cache.find(function(x){return x._code===id;});
    if(!it){ toast('ไม่พบข้อมูล','err'); return; }
    deleteId=id;
    var brandModel=(it._brand+' '+it._model).trim();
    var title=(it._modelCode||'ไม่ระบุรหัสรุ่น')+(brandModel?' ('+brandModel+')':'')+(it._year?' — '+it._year:'');
    document.getElementById('deleteTarget').innerHTML=
      '<div style="font-size:14px;font-weight:600;color:var(--ink)">'+esc(title)+'</div>'+
      '<span class="chip-code" style="margin-top:5px">'+esc(id)+'</span>';
    var btn=document.getElementById('btnDelete');
    btnDone(btn); btn.innerHTML='🗑️ ลบข้อมูล';
    openModal('deleteModal');
  }

  function execDelete(){
    if(!deleteId) return;
    var btn=document.getElementById('btnDelete');
    btnBusy(btn,'กำลังลบ...');
    callApi(API.del,[deleteId],function(res){
      btnDone(btn);
      closeModal('deleteModal');
      if(res && res.success){
        toast('ลบ'+ENTITY+'เรียบร้อย');
        loadTable();
        notifyParentRefreshDropdowns();
      } else {
        swyError('ลบไม่สำเร็จ',(res&&res.message)||'');
      }
      deleteId=null;
    },function(err){
      btnDone(btn); closeModal('deleteModal');
      swyError('เกิดข้อผิดพลาด',esc(JSON.stringify(err)));
    });
  }
</script>
</body>
</html>
