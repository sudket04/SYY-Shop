<style>
/* SYY Shop — searchable select + product image gallery */
.syy-native-select{position:absolute!important;opacity:0!important;pointer-events:none!important;width:1px!important;height:1px!important;margin:0!important;padding:0!important;border:0!important}
.syy-select{position:relative;display:inline-block;vertical-align:middle;max-width:100%;min-width:150px}.syy-select.syy-select-block{display:block;width:100%}
.syy-select-btn{width:100%;min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;color:var(--ink,#0f172a);font:inherit;text-align:left;cursor:pointer;outline:none}.syy-select-btn:focus,.syy-select.open .syy-select-btn{border-color:var(--primary,#005088);box-shadow:0 0 0 3px rgba(0,80,136,.12)}.syy-select-btn:disabled{background:#f1f5f9;color:#94a3b8;cursor:not-allowed}.syy-select-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.syy-select-caret{font-size:10px;color:#64748b;flex:none}
.syy-select-panel{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:3600;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.2);overflow:hidden;min-width:220px;max-width:min(420px,calc(100vw - 24px))}.syy-select.open .syy-select-panel{display:block}.syy-select-search-wrap{padding:8px;border-bottom:1px solid #eef2f7;background:#fff;position:sticky;top:0;z-index:2}.syy-select-search{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:8px 10px;outline:none;font:inherit;color:#0f172a;background:#fff}.syy-select-search:focus{border-color:var(--primary,#005088);box-shadow:0 0 0 2px rgba(0,80,136,.1)}.syy-select-options{max-height:280px;overflow:auto;overscroll-behavior:contain;padding:4px}.syy-select-option{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:7px;cursor:pointer;color:#334155;line-height:1.4}.syy-select-option:hover,.syy-select-option.active{background:#eff6ff;color:#0f4c81}.syy-select-option.selected{font-weight:600;background:#eaf3fb;color:#005088}.syy-select-option.disabled{opacity:.45;cursor:not-allowed;background:transparent}.syy-select-empty,.syy-select-more{padding:12px;text-align:center;color:#94a3b8;font-size:12px}.syy-select-more{border-top:1px solid #f1f5f9;background:#fafcff}
@media(max-width:767px){.syy-select-panel{position:fixed;left:10px!important;right:10px!important;top:auto!important;bottom:16px;max-width:none;max-height:70vh}.syy-select-options{max-height:50vh}}
#productTable img,#viewImgBox img,#pdImgBox img,.syy-product-fit{object-fit:contain!important;object-position:center!important;background:#f8fafc!important}
.syy-product-gallery-manager{width:100%}.syy-product-gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(105px,1fr));gap:10px;width:100%}.syy-product-slot{position:relative;border:1px solid #dbe3eb;border-radius:10px;background:#fff;min-height:150px;padding:7px;display:flex;flex-direction:column;gap:6px;overflow:hidden}.syy-product-slot.empty{border-style:dashed;align-items:center;justify-content:center;color:#94a3b8;cursor:pointer;background:#f8fafc}.syy-product-slot-img{width:100%;height:105px;border:0;background:#f8fafc;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px;cursor:zoom-in}.syy-product-slot-img img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}.syy-product-primary{position:absolute;top:10px;left:10px;background:#005088;color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:2px 7px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.16)}.syy-product-slot-actions{display:flex;gap:5px;flex-wrap:wrap}.syy-product-slot-actions button{flex:1;min-width:54px;border:1px solid #e2e8f0;background:#fff;color:#475569;border-radius:6px;padding:5px 6px;font:inherit;font-size:10.5px;cursor:pointer}.syy-product-slot-actions button:hover{border-color:#94a3b8;background:#f8fafc}.syy-product-slot-actions .danger{color:#b91c1c;background:#fff7f7;border-color:#fecaca}.syy-product-gallery-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.syy-product-gallery-hint{font-size:11.5px;color:#64748b;line-height:1.55}.syy-product-view-thumbs{display:flex;gap:6px;margin-top:7px;justify-content:center;flex-wrap:wrap}.syy-product-view-thumb{width:42px;height:42px;border:1px solid #dbe3eb;border-radius:7px;padding:2px;background:#fff;cursor:pointer}.syy-product-view-thumb.active{border-color:#005088;box-shadow:0 0 0 1px #005088}.syy-product-view-thumb img{width:100%;height:100%;object-fit:contain;background:#f8fafc}@media(max-width:600px){.syy-product-gallery-grid{grid-template-columns:1fr}.syy-product-slot{min-height:165px}.syy-product-slot-img{height:120px}}
.syy-lightbox{display:none;position:fixed;inset:0;z-index:5000;background:rgba(2,8,23,.9);padding:18px;align-items:center;justify-content:center}.syy-lightbox.open{display:flex}.syy-lightbox-card{width:min(1100px,96vw);height:min(820px,94vh);display:flex;flex-direction:column;position:relative;color:#fff}.syy-lightbox-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 10px}.syy-lightbox-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.syy-lightbox-close{width:38px;height:38px;border:1px solid rgba(255,255,255,.25);border-radius:9px;background:rgba(255,255,255,.08);color:#fff;font-size:25px;cursor:pointer}.syy-lightbox-main{flex:1;min-height:0;display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center}.syy-lightbox-img-wrap{min-width:0;min-height:0;height:100%;display:flex;align-items:center;justify-content:center}.syy-lightbox-img{max-width:100%;max-height:100%;object-fit:contain;object-position:center;border-radius:8px;background:#fff}.syy-lightbox-nav{width:44px;height:60px;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:rgba(255,255,255,.08);color:#fff;font-size:26px;cursor:pointer}.syy-lightbox-nav:disabled{opacity:.25;cursor:default}.syy-lightbox-foot{text-align:center;padding-top:10px;font-size:12px;color:#cbd5e1}.syy-lightbox-thumbs{display:flex;justify-content:center;gap:7px;margin-top:7px;overflow:auto}.syy-lightbox-thumb{width:48px;height:48px;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:2px;background:rgba(255,255,255,.08);cursor:pointer;flex:none}.syy-lightbox-thumb.active{border-color:#fff}.syy-lightbox-thumb img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:4px}
</style>
<script>
(function(){
'use strict';
var SELECT_LIMIT=200,selectInstances=[];
function norm(v){v=String(v==null?'':v).toLowerCase();try{return v.normalize('NFKD');}catch(e){return v;}}
function escHtml(v){return window.esc?esc(v):String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function debounce(fn,ms){var t;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a);},ms||80);};}
function closeAll(except){selectInstances.forEach(function(x){if(x!==except)x.close();});}
function enhanceSelect(sel){
 if(!sel||sel.dataset.syyEnhanced==='1'||sel.multiple||sel.size>1||sel.hasAttribute('data-no-search')||sel.classList.contains('syy-no-search'))return;
 sel.dataset.syyEnhanced='1';
 var rect=sel.getBoundingClientRect(),block=sel.classList.contains('form-control')||getComputedStyle(sel).width==='100%';
 var wrap=document.createElement('div');wrap.className='syy-select'+(block?' syy-select-block':'');if(!block&&rect.width>0)wrap.style.width=Math.max(150,Math.round(rect.width))+'px';if(sel.style.maxWidth)wrap.style.maxWidth=sel.style.maxWidth;
 var btn=document.createElement('button');btn.type='button';btn.className='syy-select-btn';btn.setAttribute('role','combobox');btn.setAttribute('aria-expanded','false');btn.innerHTML='<span class="syy-select-value"></span><span class="syy-select-caret">▼</span>';
 var panel=document.createElement('div');panel.className='syy-select-panel';panel.innerHTML='<div class="syy-select-search-wrap"><input type="text" class="syy-select-search" autocomplete="off" placeholder="ค้นหา..."></div><div class="syy-select-options" role="listbox"></div>';
 sel.parentNode.insertBefore(wrap,sel.nextSibling);wrap.appendChild(btn);wrap.appendChild(panel);sel.classList.add('syy-native-select');
 var input=panel.querySelector('.syy-select-search'),box=panel.querySelector('.syy-select-options');
 var state={sel:sel,wrap:wrap,btn:btn,input:input,box:box,active:-1,lastValue:null,lastText:null};
 state.sync=function(){var op=sel.options[sel.selectedIndex],text=op?op.text:'—';btn.querySelector('.syy-select-value').textContent=text||'—';btn.disabled=!!sel.disabled;state.lastValue=sel.value;state.lastText=text;};
 state.render=function(q){var query=norm(q).trim(),options=Array.prototype.slice.call(sel.options),matched=[];options.forEach(function(o,i){if(!query||norm(o.text).indexOf(query)>-1||norm(o.value).indexOf(query)>-1)matched.push({o:o,i:i});});var visible=matched.slice(0,SELECT_LIMIT);state.active=-1;if(!visible.length){box.innerHTML='<div class="syy-select-empty">ไม่พบข้อมูลที่ค้นหา</div>';return;}box.innerHTML=visible.map(function(x){var o=x.o;return '<div class="syy-select-option'+(o.selected?' selected':'')+(o.disabled?' disabled':'')+'" data-index="'+x.i+'" role="option" aria-selected="'+(o.selected?'true':'false')+'">'+escHtml(o.text)+'</div>';}).join('')+(matched.length>SELECT_LIMIT?'<div class="syy-select-more">แสดง '+SELECT_LIMIT+' จาก '+matched.length+' รายการ — พิมพ์เพิ่มเพื่อกรองให้แคบลง</div>':'');box.querySelectorAll('.syy-select-option').forEach(function(row){row.addEventListener('mousedown',function(e){e.preventDefault();var idx=parseInt(row.dataset.index,10),o=sel.options[idx];if(!o||o.disabled)return;sel.selectedIndex=idx;state.sync();sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}));state.close();});});};
 state.open=function(seed){if(sel.disabled)return;closeAll(state);state.sync();wrap.classList.add('open');btn.setAttribute('aria-expanded','true');input.value=seed||'';state.render(input.value);setTimeout(function(){input.focus();if(seed)input.setSelectionRange(input.value.length,input.value.length);},0);};
 state.close=function(){wrap.classList.remove('open');btn.setAttribute('aria-expanded','false');state.active=-1;};
 state.move=function(delta){var rows=box.querySelectorAll('.syy-select-option:not(.disabled)');if(!rows.length)return;state.active=Math.max(0,Math.min(rows.length-1,state.active+delta));rows.forEach(function(r,i){r.classList.toggle('active',i===state.active);});rows[state.active].scrollIntoView({block:'nearest'});};
 btn.addEventListener('click',function(){wrap.classList.contains('open')?state.close():state.open('');});btn.addEventListener('keydown',function(e){if(e.key==='ArrowDown'||e.key==='Enter'||e.key===' '){e.preventDefault();state.open('');}else if(e.key&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();state.open(e.key);}});input.addEventListener('input',debounce(function(){state.render(input.value);},70));input.addEventListener('keydown',function(e){if(e.key==='ArrowDown'){e.preventDefault();state.move(1);}else if(e.key==='ArrowUp'){e.preventDefault();state.move(-1);}else if(e.key==='Enter'){e.preventDefault();var rows=box.querySelectorAll('.syy-select-option:not(.disabled)');if(state.active>=0&&rows[state.active])rows[state.active].dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));}else if(e.key==='Escape'){state.close();btn.focus();}});sel.addEventListener('change',state.sync);sel.addEventListener('input',state.sync);new MutationObserver(function(){state.sync();if(wrap.classList.contains('open'))state.render(input.value);}).observe(sel,{childList:true,subtree:true,attributes:true});var form=sel.form;if(form&&!form.dataset.syySelectReset){form.dataset.syySelectReset='1';form.addEventListener('reset',function(){setTimeout(syncAllSelects,0);});}state.sync();selectInstances.push(state);
}
function enhanceSelects(root){(root||document).querySelectorAll('select').forEach(enhanceSelect);}function syncAllSelects(){selectInstances.forEach(function(s){var op=s.sel.options[s.sel.selectedIndex],text=op?op.text:'—';if(s.lastValue!==s.sel.value||s.lastText!==text||s.btn.disabled!==!!s.sel.disabled)s.sync();});}window.syyEnhanceSelects=enhanceSelects;window.syySyncSelects=syncAllSelects;document.addEventListener('mousedown',function(e){selectInstances.forEach(function(s){if(!s.wrap.contains(e.target))s.close();});});

var lb={urls:[],index:0,title:''};
function ensureLightbox(){var el=document.getElementById('syyLightbox');if(el)return el;el=document.createElement('div');el.id='syyLightbox';el.className='syy-lightbox';el.innerHTML='<div class="syy-lightbox-card"><div class="syy-lightbox-head"><div class="syy-lightbox-title" id="syyLbTitle"></div><button type="button" class="syy-lightbox-close" id="syyLbClose">×</button></div><div class="syy-lightbox-main"><button type="button" class="syy-lightbox-nav" id="syyLbPrev">‹</button><div class="syy-lightbox-img-wrap"><img class="syy-lightbox-img" id="syyLbImg" alt=""></div><button type="button" class="syy-lightbox-nav" id="syyLbNext">›</button></div><div class="syy-lightbox-foot"><div id="syyLbCount"></div><div class="syy-lightbox-thumbs" id="syyLbThumbs"></div></div></div>';document.body.appendChild(el);document.getElementById('syyLbClose').onclick=closeLightbox;document.getElementById('syyLbPrev').onclick=function(){showLb(lb.index-1);};document.getElementById('syyLbNext').onclick=function(){showLb(lb.index+1);};el.addEventListener('mousedown',function(e){if(e.target===el)closeLightbox();});return el;}
function showLb(i){if(!lb.urls.length)return;lb.index=(i+lb.urls.length)%lb.urls.length;ensureLightbox();document.getElementById('syyLbImg').src=lb.urls[lb.index];document.getElementById('syyLbTitle').textContent=lb.title||'รูปสินค้า';document.getElementById('syyLbCount').textContent=(lb.index+1)+' / '+lb.urls.length;document.getElementById('syyLbPrev').disabled=lb.urls.length<2;document.getElementById('syyLbNext').disabled=lb.urls.length<2;document.getElementById('syyLbThumbs').innerHTML=lb.urls.map(function(u,n){return '<button type="button" class="syy-lightbox-thumb'+(n===lb.index?' active':'')+'" data-i="'+n+'"><img src="'+escHtml(u)+'" alt=""></button>';}).join('');document.querySelectorAll('#syyLbThumbs .syy-lightbox-thumb').forEach(function(b){b.onclick=function(){showLb(parseInt(b.dataset.i,10));};});}
function closeLightbox(){var el=document.getElementById('syyLightbox');if(el)el.classList.remove('open');}window.syyOpenImageLightbox=function(urls,index,title){lb.urls=(urls||[]).filter(Boolean);if(!lb.urls.length)return;lb.index=Math.max(0,Math.min(parseInt(index,10)||0,lb.urls.length-1));lb.title=title||'รูปสินค้า';ensureLightbox().classList.add('open');showLb(lb.index);};window.syyCloseImageLightbox=closeLightbox;

var pg={productCode:'',urls:[],primaryIndex:-1,busy:false};
function callV2(fn,args,ok,fail){var token=(typeof AUTH_TOKEN!=='undefined')?AUTH_TOKEN:'';if(!token){if(fail)fail({message:'ไม่มี session'});return;}google.script.run.withSuccessHandler(function(res){if(res&&res.__authError){if(typeof swyError==='function')swyError('เซสชันหมดอายุ','กรุณาเข้าสู่ระบบใหม่');return;}if(ok)ok(res);}).withFailureHandler(fail||function(err){if(typeof swyError==='function')swyError('เกิดข้อผิดพลาด',String((err&&err.message)||err));}).apiGatewayV2(token,fn,args||[],'');}window.syyCallApiV2=callV2;
function updateCachedPrimary(url){try{if(typeof productsCache!=='undefined'){var p=productsCache.find(function(x){return x.id===pg.productCode||x.productCode===pg.productCode;});if(p){p.imageUrl=url||'';p.imageUrls=pg.urls.slice();}}if(typeof products!=='undefined'){var q=products.find(function(x){return x.productCode===pg.productCode;});if(q){q.imageUrl=url||'';q.imageUrls=pg.urls.slice();}}}catch(e){}try{if(typeof filterAndRenderTable==='function')filterAndRenderTable();}catch(e2){}try{if(typeof renderResults==='function')renderResults();}catch(e3){}try{if(typeof notifyParentRefreshProducts==='function')notifyParentRefreshProducts();}catch(e4){}}
function applyGalleryResult(res){if(!res||res.success===false)return false;pg.urls=(res.imageUrls||[]).slice(0,3);pg.primaryIndex=typeof res.primaryIndex==='number'?res.primaryIndex:parseInt(res.primaryIndex,10);if(isNaN(pg.primaryIndex))pg.primaryIndex=pg.urls.length?0:-1;renderProductGallery();updateCachedPrimary(res.imageUrl||(pg.primaryIndex>=0?pg.urls[pg.primaryIndex]:'')||'');return true;}
function renderProductGallery(){var grid=document.getElementById('syyProductGalleryGrid');if(!grid)return;var html='';for(var i=0;i<3;i++){var u=pg.urls[i];if(u){html+='<div class="syy-product-slot">'+(i===pg.primaryIndex?'<span class="syy-product-primary">รูปหลัก</span>':'')+'<button type="button" class="syy-product-slot-img" data-view="'+i+'"><img src="'+escHtml(u)+'" alt="รูปสินค้า '+(i+1)+'"></button><div class="syy-product-slot-actions">'+(i===pg.primaryIndex?'':'<button type="button" data-primary="'+i+'">ตั้งรูปหลัก</button>')+'<button type="button" data-replace="'+i+'">เปลี่ยน</button><button type="button" class="danger" data-delete="'+i+'">ลบ</button></div></div>';}else{html+='<div class="syy-product-slot empty" data-add="1"><div style="font-size:25px">＋</div><div>เพิ่มรูป '+(i+1)+'</div></div>';}}grid.innerHTML=html;grid.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){syyOpenImageLightbox(pg.urls,parseInt(b.dataset.view,10),'รูปสินค้า '+pg.productCode);};});grid.querySelectorAll('[data-add]').forEach(function(b){b.onclick=syyPickProductImages;});grid.querySelectorAll('[data-primary]').forEach(function(b){b.onclick=function(){syySetPrimaryProductImage(parseInt(b.dataset.primary,10));};});grid.querySelectorAll('[data-replace]').forEach(function(b){b.onclick=function(){syyReplaceProductImage(parseInt(b.dataset.replace,10));};});grid.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){syyDeleteProductImage(parseInt(b.dataset.delete,10));};});var add=document.getElementById('btnPickImage');if(add){add.disabled=!pg.productCode||pg.urls.length>=3;add.textContent=pg.urls.length>=3?'ครบ 3 รูปแล้ว':'เพิ่มรูปสินค้า';}var hint=document.getElementById('imageHint');if(hint)hint.textContent=pg.productCode?'เพิ่มได้สูงสุด 3 รูป · JPG/PNG/WebP ไม่เกิน 5MB/รูป · ย่อด้านยาวไม่เกิน 1500px · แสดงเต็มภาพไม่ครอป':'บันทึกสินค้าก่อน จึงจะเพิ่มรูปได้';}
function setBusy(v,text){pg.busy=v;var pr=document.getElementById('imgUploadProgress');if(pr)pr.style.display=v?'block':'none';var b=document.getElementById('btnPickImage');if(b){b.disabled=v||!pg.productCode||pg.urls.length>=3;b.textContent=v?(text||'กำลังอัปโหลด...'):(pg.urls.length>=3?'ครบ 3 รูปแล้ว':'เพิ่มรูปสินค้า');}}
function loadGallery(code,legacy){pg.productCode=String(code||'');pg.urls=legacy?[legacy]:[];pg.primaryIndex=pg.urls.length?0:-1;renderProductGallery();if(!pg.productCode)return;callV2('getProductImagesV2',[pg.productCode],function(res){if(res&&res.success)applyGalleryResult(res);},function(){});}
function prepareFile(file,done,fail){if(!file||['image/jpeg','image/png','image/webp'].indexOf(file.type)<0){fail('รองรับเฉพาะ JPG, PNG และ WebP');return;}if(file.size>5*1024*1024){fail('ไฟล์ '+file.name+' ใหญ่เกิน 5MB');return;}var r=new FileReader();r.onerror=function(){fail('อ่านไฟล์ไม่สำเร็จ');};r.onload=function(e){var im=new Image();im.onerror=function(){fail('ไฟล์รูปเสียหายหรือเปิดไม่ได้');};im.onload=function(){var w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,max=1500;if(w>max||h>max){if(w>=h){h=Math.max(1,Math.round(h*max/w));w=max;}else{w=Math.max(1,Math.round(w*max/h));h=max;}}var c=document.createElement('canvas');c.width=w;c.height=h;var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);done(c.toDataURL('image/jpeg',.82).split(',')[1]);};im.src=e.target.result;};r.readAsDataURL(file);}
function uploadQueue(files,target){var list=files.slice(),idx=0;setBusy(true,'กำลังอัปโหลด...');function finish(){setBusy(false);var inp=document.getElementById('inp_imageFile');if(inp){inp.value='';delete inp.dataset.replaceIndex;}}function next(){if(idx>=list.length){finish();return;}prepareFile(list[idx++],function(base64){var slot=(target!=null&&target!=='')?parseInt(target,10):pg.urls.length;callV2('uploadProductImageV2',[pg.productCode,base64,slot],function(res){if(!res||res.success===false){finish();if(typeof swyError==='function')swyError('อัปโหลดไม่สำเร็จ',(res&&res.message)||'ไม่ทราบสาเหตุ');return;}applyGalleryResult(res);if(target!=null&&target!=='')list=[];next();},function(err){finish();if(typeof swyError==='function')swyError('อัปโหลดไม่สำเร็จ',String((err&&err.message)||err));});},function(msg){finish();if(typeof swyWarning==='function')swyWarning('ไฟล์รูปไม่ถูกต้อง',msg);});}next();}
window.syyPickProductImages=function(){if(!pg.productCode||pg.busy)return;var inp=document.getElementById('inp_imageFile');if(!inp)return;delete inp.dataset.replaceIndex;inp.multiple=true;inp.click();};window.syyReplaceProductImage=function(i){if(!pg.productCode||pg.busy)return;var inp=document.getElementById('inp_imageFile');inp.dataset.replaceIndex=String(i);inp.multiple=false;inp.click();};window.syySetPrimaryProductImage=function(i){if(pg.busy||i===pg.primaryIndex)return;setBusy(true,'กำลังตั้งรูปหลัก...');callV2('setPrimaryProductImageV2',[pg.productCode,i],function(res){setBusy(false);if(res&&res.success){applyGalleryResult(res);if(typeof toast==='function')toast('ตั้งรูปหลักเรียบร้อย');}else if(typeof swyError==='function')swyError('ดำเนินการไม่สำเร็จ',(res&&res.message)||'');});};window.syyDeleteProductImage=function(i){if(pg.busy)return;var go=function(){setBusy(true,'กำลังลบ...');callV2('deleteProductImageV2',[pg.productCode,i],function(res){setBusy(false);if(res&&res.success){applyGalleryResult(res);if(typeof toast==='function')toast('ลบรูปเรียบร้อย');}else if(typeof swyError==='function')swyError('ลบรูปไม่สำเร็จ',(res&&res.message)||'');});};if(typeof swyConfirm==='function')swyConfirm({icon:'warning',title:'ลบรูปสินค้า?',html:'รูปนี้จะถูกลบออกจาก Google Drive และสินค้า',confirmText:'ลบรูป',danger:true}).then(function(ok){if(ok)go();});else if(confirm('ลบรูปสินค้านี้?'))go();};
function installProductGallery(){var old=document.getElementById('imgPreviewBox');if(!old||document.getElementById('syyProductGalleryGrid'))return;var host=old.parentNode;host.innerHTML='<div class="syy-product-gallery-manager"><div class="syy-product-gallery-grid" id="syyProductGalleryGrid"></div><input type="file" id="inp_imageFile" accept="image/jpeg,image/png,image/webp" multiple style="display:none"><div class="syy-product-gallery-toolbar"><button type="button" class="btn btn-ghost" id="btnPickImage">เพิ่มรูปสินค้า</button><button type="button" class="btn btn-ghost" id="btnDeleteImage" style="display:none"></button></div><div id="imgUploadProgress" style="display:none;margin-top:8px"><div class="img-upload-progress-track"><div class="img-upload-progress-bar"></div></div><div style="font-size:11px;color:var(--faint);margin-top:4px">กำลังประมวลผลและอัปโหลดรูป...</div></div><div class="syy-product-gallery-hint" id="imageHint"></div></div>';document.getElementById('btnPickImage').onclick=syyPickProductImages;document.getElementById('inp_imageFile').onchange=function(){var files=Array.prototype.slice.call(this.files||[]);if(!files.length)return;var target=this.dataset.replaceIndex;if(target==null||target===''){var avail=Math.max(0,3-pg.urls.length);if(files.length>avail&&typeof swyWarning==='function')swyWarning('เลือกเกินจำนวนที่รองรับ','เพิ่มได้อีก '+avail+' รูป ระบบจะอัปโหลดเฉพาะ '+avail+' รูปแรก');files=files.slice(0,avail);}else files=files.slice(0,1);if(files.length)uploadQueue(files,target);};window.updateImageSectionForEdit=function(docId,imageUrl){loadGallery(docId,imageUrl||'');};window.resetImagePreview=function(){loadGallery('','');};window.showImagePreview=function(url){loadGallery(pg.productCode,url||'');};window.onProductImageSelected=function(input){var files=Array.prototype.slice.call(input.files||[]);if(files.length)uploadQueue(files,input.dataset.replaceIndex);};renderProductGallery();
 if(typeof window.openViewModal==='function'&&!window.openViewModal.__syyV2){var original=window.openViewModal;var wrapped=function(docId){original(docId);var item=(typeof productsCache!=='undefined')?productsCache.find(function(x){return x.id===docId||x.productCode===docId;}):null,code=item?(item.id||item.productCode):docId;callV2('getProductImagesV2',[code],function(res){if(!res||!res.success||!res.imageUrls||!res.imageUrls.length)return;var box=document.getElementById('viewImgBox');if(!box)return;var pidx=Math.max(0,res.primaryIndex||0),urls=res.imageUrls;box.innerHTML='<button type="button" id="syyViewMainImage" style="width:100%;height:100%;border:0;padding:4px;background:#f8fafc;cursor:zoom-in"><img src="'+escHtml(urls[pidx])+'" style="width:100%;height:100%;object-fit:contain" alt=""></button>';document.getElementById('syyViewMainImage').onclick=function(){syyOpenImageLightbox(urls,pidx,'รูปสินค้า');};var oldThumb=box.parentNode.querySelector('.syy-product-view-thumbs');if(oldThumb)oldThumb.remove();var thumbs=document.createElement('div');thumbs.className='syy-product-view-thumbs';urls.forEach(function(u,i){var b=document.createElement('button');b.type='button';b.className='syy-product-view-thumb'+(i===pidx?' active':'');b.innerHTML='<img src="'+escHtml(u)+'" alt="">';b.onclick=function(){syyOpenImageLightbox(urls,i,'รูปสินค้า');};thumbs.appendChild(b);});box.parentNode.insertBefore(thumbs,box.nextSibling);});};wrapped.__syyV2=true;window.openViewModal=wrapped;}
 if(typeof window.execDeleteProduct==='function'){window.execDeleteProduct=function(){if(typeof targetDeleteDocId==='undefined'||!targetDeleteDocId)return;var id=targetDeleteDocId,btn=document.getElementById('btnConfirmDelete');if(btn){btn.disabled=true;btn.textContent='กำลังลบ...';}callV2('deleteProductWithImagesV2',[id],function(res){if(typeof closeDeleteModal==='function')closeDeleteModal();if(res&&res.success){if(typeof toast==='function')toast('ลบสินค้าและรูปเรียบร้อย');if(typeof loadTable==='function')loadTable();if(typeof notifyParentRefreshProducts==='function')notifyParentRefreshProducts();}else if(typeof swyError==='function')swyError('ไม่สามารถลบข้อมูลได้',(res&&res.message)||'เกิดข้อผิดพลาด');},function(err){if(typeof closeDeleteModal==='function')closeDeleteModal();if(typeof swyError==='function')swyError('ลบไม่สำเร็จ',String((err&&err.message)||err));});};}}
function installStockDetailGallery(){if(typeof window.openProductDetail!=='function'||!document.getElementById('pdImgBox')||window.openProductDetail.__syyV2)return;var original=window.openProductDetail,wrapped=function(code){original(code);callV2('getProductImagesV2',[code],function(res){if(!res||!res.success||!res.imageUrls||!res.imageUrls.length)return;var urls=res.imageUrls,pidx=Math.max(0,res.primaryIndex||0),box=document.getElementById('pdImgBox');if(!box)return;box.innerHTML='<button type="button" id="syyPdMainImage" style="width:100%;height:100%;border:0;padding:4px;background:#f8fafc;cursor:zoom-in"><img src="'+escHtml(urls[pidx])+'" style="width:100%;height:100%;object-fit:contain" alt=""></button>';document.getElementById('syyPdMainImage').onclick=function(){syyOpenImageLightbox(urls,pidx,'รูปสินค้า');};});};wrapped.__syyV2=true;window.openProductDetail=wrapped;}
function install(){enhanceSelects(document);installProductGallery();installStockDetailGallery();if(typeof window.openModal==='function'&&!window.openModal.__syySelect){var om=window.openModal,wm=function(id){syncAllSelects();var r=om.apply(this,arguments);setTimeout(syncAllSelects,0);return r;};wm.__syySelect=true;window.openModal=wm;}setInterval(syncAllSelects,1000);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1){if(n.matches&&n.matches('select'))enhanceSelect(n);enhanceSelects(n);}});});}).observe(document.documentElement,{childList:true,subtree:true});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else setTimeout(install,0);
})();
</script>
