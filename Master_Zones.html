<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <?!= include('Styles'); ?>
</head>
<body>

<div class="page-head">
  <div class="crumb">
    <span>ข้อมูลหลัก</span><span class="sep">›</span>
    <b>โซนจัดเก็บ</b>
    <span class="badge badge-mute" id="recordCount">—</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-ghost btn-icon" title="สลับความหนาแน่นแถว" onclick="toggleDensity()">≡</button>
    <button class="btn btn-ghost" onclick="loadTable()">🔄 รีเฟรช</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ เพิ่มโซน</button>
  </div>
</div>

<div class="page-body">
  <div class="card">
    <div class="toolbar">
      <div class="search">
        <span class="ico">⌕</span>
        <input type="text" id="searchInput" class="input" placeholder="ค้นหาพื้นที่ / รหัส / อาคาร" oninput="onSearch()" autocomplete="off">
      </div>
      <span class="count" id="filterInfo"></span>
    </div>

    <div class="xlf-filter-summary" id="xlfSummary">
      <span id="xlfSummaryText"></span>
      <button type="button" onclick="XLF.clearAll(TABLE_KEY); renderRows();">ล้างตัวกรองทั้งหมด</button>
    </div>

    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:44px"><col style="width:100px"><col style="width:170px"><col style="width:120px">
          <col style="width:90px"><col style="width:110px"><col><col style="width:100px">
        </colgroup>
        <thead id="theadMain"></thead>
        <tbody id="tbodyMain"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══ Modal: เพิ่ม / แก้ไข ═══ -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box" style="width:520px">
    <div class="modal-header">
      <span id="modalTitle">📦 เพิ่มโซนจัดเก็บ</span>
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
    </div>
    <form id="mainForm" onsubmit="handleSubmit(event)">
      <div class="modal-body">
        <div class="section-label">ข้อมูลสถานที่จัดเก็บ</div>
        <div class="form-grid">
          <div class="form-group full">
            <label>รหัสโซน</label>
            <input type="text" id="fDocId" class="form-control" disabled placeholder="สร้างอัตโนมัติ">
          </div>
          <div class="form-group full">
            <label>พื้นที่ (Area) *</label>
            <input type="text" id="fArea" class="form-control" required placeholder="เช่น โซน A, ชั้นวาง 1" oninput="clearErr('fArea')">
            <span class="field-error" id="err_fArea">กรุณากรอกพื้นที่</span>
          </div>
          <div class="form-group">
            <label>อาคาร (Building)</label>
            <select id="fBuild" class="form-control select">
              <option value="">-- เลือกอาคาร --</option>
              <option value="ห้อง 82">ห้อง 82</option>
              <option value="ห้อง 83">ห้อง 83</option>
              <option value="ห้อง 84">ห้อง 84</option>
              <option value="ห้อง 85">ห้อง 85</option>
              <option value="ห้อง 86">ห้อง 86</option>
              <option value="ห้อง 87">ห้อง 87</option>
              <option value="โกดัง">โกดัง</option>
            </select>
          </div>
          <div class="form-group">
            <label>ชั้น (Floor)</label>
            <select id="fFloor" class="form-control select">
              <option value="">-- เลือกชั้น --</option>
              <option value="ชั้น 1">ชั้น 1</option>
              <option value="ชั้น 2">ชั้น 2</option>
              <option value="ชั้น 3">ชั้น 3</option>
              <option value="ชั้น 4">ชั้น 4</option>
              <option value="ชั้น 5">ชั้น 5</option>
              <option value="ชั้น 6">ชั้น 6</option>
            </select>
          </div>
          <div class="form-group">
            <label>เลขแร็ค (Rack No)</label>
            <input type="text" id="fRackNo" class="form-control" placeholder="เช่น RACK-01">
          </div>
          <div class="form-group">
            <label>หมายเหตุ</label>
            <input type="text" id="fNote" class="form-control" placeholder="รายละเอียดเพิ่มเติม">
          </div>
        </div>
        <div id="modalAlert" class="modal-alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('editModal')">ยกเลิก</button>
        <button type="submit" class="btn btn-primary" id="btnSave">💾 บันทึก</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══ Modal: ยืนยันลบ ═══ -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box" style="width:420px">
    <div class="modal-body" style="text-align:center;padding:30px 24px 18px">
      <div class="confirm-ic">🗑️</div>
      <h3 style="margin:15px 0 5px;color:var(--ink);font-size:18px;font-weight:600">ยืนยันการลบ?</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 15px">ลบแล้วกู้คืนไม่ได้ และสินค้าที่เก็บในโซนนี้จะแสดงที่เก็บเป็นค่าว่าง</p>
      <div class="confirm-card" id="deleteTarget"></div>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button type="button" class="btn btn-ghost" style="min-width:100px" onclick="closeModal('deleteModal')">ยกเลิก</button>
      <button type="button" class="btn btn-danger" style="min-width:120px" id="btnDelete" onclick="execDelete()">🗑️ ลบข้อมูล</button>
    </div>
  </div>
</div>

<?!= include('XLFilter'); ?>
<?!= include('Shared'); ?>
<script>
  var AUTH_TOKEN  = "<?= authToken ?>";
  var WEB_APP_URL = "<?= webAppUrl ?>";

  var TABLE_KEY   = 'zones';
  var ENTITY      = 'โซน';
  var API         = { list:'getZonesFull', save:'saveZone', del:'deleteZone' };
  var COLS        = [
    { col:'id',      label:'รหัสโซน' },
    { col:'Area',    label:'พื้นที่ (Area)' },
    { col:'Build',   label:'อาคาร' },
    { col:'Floor',   label:'ชั้น' },
    { col:'Rack_no', label:'Rack No' },
    { col:'Note',    label:'หมายเหตุ' }
  ];
  var SEARCH_KEYS = ['id','Area','Build','Floor','Rack_no','Note'];

  var cache=[], editingId=null, deleteId=null, searchTimer=null;

  window.onload = function(){
    initDensity();
    document.getElementById('tbodyMain').innerHTML = skeletonRows(8,5);
    renderHead();
    loadTable();
  };

  XLF.bindHeaderClicks('#theadMain', function(){ return cache; }, renderRows);

  function renderHead(){
    document.getElementById('theadMain').innerHTML =
      '<tr><th class="text-center">#</th>' +
      COLS.map(function(c){ return XLF.th(c.label, TABLE_KEY, c.col); }).join('') +
      '<th class="text-center col-sticky-right">จัดการ</th></tr>';
  }

  function loadTable(){
    document.getElementById('recordCount').innerText='กำลังโหลด';
    document.getElementById('tbodyMain').innerHTML = skeletonRows(8,5);
    callApi(API.list, [], function(data){
      cache = data || [];
      renderRows();
    }, function(err){
      document.getElementById('tbodyMain').innerHTML = emptyStateHtml(8,{
        icon:'⚠️', title:'โหลดข้อมูลไม่สำเร็จ', sub:JSON.stringify(err),
        actions:[{label:'ลองอีกครั้ง',primary:true,onclick:'loadTable()'}]
      });
      document.getElementById('recordCount').innerText='ผิดพลาด';
    });
  }

  function onSearch(){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(renderRows,150);
  }

  function renderRows(){
    renderHead();
    var q=document.getElementById('searchInput').value.toLowerCase().trim();
    var searched = !q ? cache.slice() : cache.filter(function(it){
      return SEARCH_KEYS.some(function(k){ return String(it[k]||'').toLowerCase().indexOf(q)>-1; });
    });

    var rows = XLF.apply(TABLE_KEY, searched, COLS);

    var labels={}; COLS.forEach(function(c){labels[c.col]=c.label;});
    var sum=document.getElementById('xlfSummary');
    if(XLF.anyActiveFilter(TABLE_KEY)){
      sum.classList.add('show');
      document.getElementById('xlfSummaryText').innerText='กรองอยู่ '+rows.length+' จาก '+cache.length+' รายการ — '+XLF.activeSummary(TABLE_KEY,labels);
    } else sum.classList.remove('show');

    document.getElementById('recordCount').innerText = cache.length + ' รายการ';
    document.getElementById('filterInfo').innerText = (q||XLF.anyActiveFilter(TABLE_KEY)) ? 'แสดง '+rows.length+' รายการ' : '';

    var tbody=document.getElementById('tbodyMain');
    if(!rows.length){
      tbody.innerHTML = cache.length
        ? emptyStateHtml(8,{ title:'ไม่พบรายการที่ตรงกับที่ค้นหา', sub:'ลองลดคำค้นหรือล้างตัวกรอง',
            actions:[{label:'ล้างตัวกรอง',onclick:'clearAllFilters()'},{label:'+ เพิ่ม'+ENTITY,primary:true,onclick:'openAddModal()'}] })
        : emptyStateHtml(8,{ icon:'📦', title:'ยังไม่มีข้อมูล'+ENTITY+'จัดเก็บ', sub:'เพิ่มรายการแรกเพื่อเริ่มใช้งาน',
            actions:[{label:'+ เพิ่ม'+ENTITY,primary:true,onclick:'openAddModal()'}] });
      return;
    }

    tbody.innerHTML = rows.map(function(it,i){
      var rack = it.Rack_no ? '<span class="chip-zone">'+esc(it.Rack_no)+'</span>' : '<span class="cell-empty">—</span>';
      return '<tr>'+
        '<td class="text-center"><span class="rownum">'+(i+1)+'</span></td>'+
        '<td><span class="chip-code">'+esc(it.id)+'</span></td>'+
        '<td style="font-weight:500;color:var(--ink)">'+esc(it.Area)+'</td>'+
        '<td>'+esc(it.Build||'—')+'</td>'+
        '<td>'+esc(it.Floor||'—')+'</td>'+
        '<td>'+rack+'</td>'+
        '<td style="color:var(--muted)">'+esc(it.Note||'—')+'</td>'+
        '<td class="text-center col-sticky-right"><span class="row-actions">'+
          '<button class="btn btn-icon edit" title="แก้ไข" onclick="openEditModal(\''+esc(it.id)+'\')">✏️</button>'+
          '<button class="btn btn-icon del" title="ลบ" onclick="confirmDelete(\''+esc(it.id)+'\')">🗑️</button>'+
        '</span></td>'+
      '</tr>';
    }).join('');
  }

  function clearAllFilters(){
    XLF.clearAll(TABLE_KEY);
    document.getElementById('searchInput').value='';
    renderRows();
  }

  /* ── เพิ่ม / แก้ไข ── */
  function clearErr(id){
    document.getElementById(id).classList.remove('is-invalid');
    document.getElementById('err_'+id).classList.remove('show');
  }

  function resetForm(){
    document.getElementById('mainForm').reset();
    document.getElementById('fDocId').value='';
    document.getElementById('fArea').value='';
    document.getElementById('fBuild').value='';
    document.getElementById('fFloor').value='';
    document.getElementById('fRackNo').value='';
    document.getElementById('fNote').value='';
    clearErr('fArea');
  }

  function openAddModal(){
    editingId=null;
    resetForm();
    document.getElementById('modalTitle').innerText='📦 เพิ่ม'+ENTITY+'จัดเก็บ';
    document.getElementById('btnSave').innerHTML='💾 บันทึก';
    document.getElementById('modalAlert').className='modal-alert';
    openModal('editModal');
  }

  function openEditModal(id){
    var it=cache.find(function(x){return x.id===id;});
    if(!it){ toast('ไม่พบข้อมูล','err'); return; }
    editingId=id;
    resetForm();
    document.getElementById('fDocId').value=it.id;
    document.getElementById('fArea').value=it.Area||'';
    document.getElementById('fBuild').value=it.Build||'';
    document.getElementById('fFloor').value=it.Floor||'';
    document.getElementById('fRackNo').value=it.Rack_no||'';
    document.getElementById('fNote').value=it.Note||'';
    document.getElementById('modalTitle').innerText='✏️ แก้ไข'+ENTITY+' ('+id+')';
    document.getElementById('btnSave').innerHTML='💾 บันทึกการแก้ไข';
    document.getElementById('modalAlert').className='modal-alert';
    openModal('editModal');
  }

  function handleSubmit(e){
    e.preventDefault();
    var area=document.getElementById('fArea').value.trim();
    var alertEl=document.getElementById('modalAlert');
    alertEl.className='modal-alert';

    if(!area){
      document.getElementById('fArea').classList.add('is-invalid');
      document.getElementById('err_fArea').classList.add('show');
      return;
    }

    var formData = {
      docId : editingId || null,
      area  : area,
      build : document.getElementById('fBuild').value.trim(),
      floor : document.getElementById('fFloor').value.trim(),
      rackNo: document.getElementById('fRackNo').value.trim(),
      note  : document.getElementById('fNote').value.trim()
    };

    var btn=document.getElementById('btnSave');
    btnBusy(btn);

    callApi(API.save, [formData], function(res){
      btnDone(btn);
      if(res && res.success){
        closeModal('editModal');
        toast((editingId?'แก้ไข':'เพิ่ม')+ENTITY+' “'+area+'” เรียบร้อย');
        loadTable();
        notifyParentRefresh();
      } else {
        alertEl.className='modal-alert error';
        alertEl.innerText='❌ '+((res&&res.message)||'บันทึกไม่สำเร็จ');
      }
    }, function(err){
      btnDone(btn);
      alertEl.className='modal-alert error';
      alertEl.innerText='❌ '+JSON.stringify(err);
    });
  }

  /* ── ลบ ── */
  function confirmDelete(id){
    var it=cache.find(function(x){return x.id===id;});
    if(!it){ toast('ไม่พบข้อมูล','err'); return; }
    deleteId=id;
    document.getElementById('deleteTarget').innerHTML=
      '<div style="font-size:14px;font-weight:600;color:var(--ink)">'+esc(it.Area)+(it.Build?' ('+esc(it.Build)+')':'')+'</div>'+
      '<span class="chip-code" style="margin-top:5px">'+esc(it.id)+'</span>';
    var btn=document.getElementById('btnDelete');
    btnDone(btn); btn.innerHTML='🗑️ ลบข้อมูล';
    openModal('deleteModal');
  }

  function execDelete(){
    if(!deleteId) return;
    var btn=document.getElementById('btnDelete');
    btnBusy(btn,'กำลังลบ...');
    callApi(API.del,[deleteId],function(res){
      btnDone(btn);
      closeModal('deleteModal');
      if(res && res.success){
        toast('ลบ'+ENTITY+'เรียบร้อย');
        loadTable();
        notifyParentRefresh();
      } else {
        swyError('ลบไม่สำเร็จ',(res&&res.message)||'');
      }
      deleteId=null;
    },function(err){
      btnDone(btn); closeModal('deleteModal');
      swyError('เกิดข้อผิดพลาด',esc(JSON.stringify(err)));
    });
  }
</script>
</body>
</html>
