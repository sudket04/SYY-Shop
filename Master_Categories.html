<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <?!= include('Styles'); ?>
</head>
<body>

<div class="page-head">
  <div class="crumb">
    <span>ข้อมูลหลัก</span><span class="sep">›</span>
    <b id="pageTitle">หมวดหมู่สินค้า</b>
    <span class="badge badge-mute" id="recordCount">—</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-ghost btn-icon" title="สลับความหนาแน่นแถว" onclick="toggleDensity()">≡</button>
    <button class="btn btn-ghost" onclick="loadTable()">🔄 รีเฟรช</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ เพิ่มหมวดหมู่</button>
  </div>
</div>

<div class="page-body">
  <div class="card">
    <div class="toolbar">
      <div class="search">
        <span class="ico">⌕</span>
        <input type="text" id="searchInput" class="input" placeholder="ค้นหาชื่อ / รหัส" oninput="onSearch()" autocomplete="off">
      </div>
      <span class="count" id="filterInfo"></span>
    </div>

    <div class="xlf-filter-summary" id="xlfSummary">
      <span id="xlfSummaryText"></span>
      <button type="button" onclick="XLF.clearAll(TABLE_KEY); renderRows();">ล้างตัวกรองทั้งหมด</button>
    </div>

    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:52px"><col style="width:150px"><col><col style="width:110px">
        </colgroup>
        <thead id="theadMain"></thead>
        <tbody id="tbodyMain"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══ Modal: เพิ่ม / แก้ไข ═══ -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box" style="width:440px">
    <div class="modal-header">
      <span id="modalTitle">📂 เพิ่มหมวดหมู่</span>
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
    </div>
    <form id="mainForm" onsubmit="handleSubmit(event)">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group full">
            <label>รหัส</label>
            <input type="text" id="fDocId" class="form-control" disabled placeholder="สร้างอัตโนมัติ">
          </div>
          <div class="form-group full">
            <label>ชื่อหมวดหมู่ *</label>
            <input type="text" id="fName" class="form-control" required placeholder="เช่น ไส้กรอง" oninput="clearErr('fName')">
            <span class="field-error" id="err_fName">กรุณากรอกชื่อ</span>
          </div>
        </div>
        <div id="modalAlert" class="modal-alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('editModal')">ยกเลิก</button>
        <button type="submit" class="btn btn-primary" id="btnSave">💾 บันทึก</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══ Modal: ยืนยันลบ ═══ -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box" style="width:420px">
    <div class="modal-body" style="text-align:center;padding:30px 24px 18px">
      <div class="confirm-ic">🗑️</div>
      <h3 style="margin:15px 0 5px;color:var(--ink);font-size:18px;font-weight:600">ยืนยันการลบ?</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 15px">ลบแล้วกู้คืนไม่ได้ และสินค้าที่อ้างอิงหมวดหมู่นี้จะแสดงเป็นค่าว่าง</p>
      <div class="confirm-card" id="deleteTarget"></div>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button type="button" class="btn btn-ghost" style="min-width:100px" onclick="closeModal('deleteModal')">ยกเลิก</button>
      <button type="button" class="btn btn-danger" style="min-width:120px" id="btnDelete" onclick="execDelete()">🗑️ ลบข้อมูล</button>
    </div>
  </div>
</div>

<?!= include('XLFilter'); ?>
<?!= include('Shared'); ?>
<script>
  var AUTH_TOKEN  = "<?= authToken ?>";
  var WEB_APP_URL = "<?= webAppUrl ?>";

  var TABLE_KEY   = 'cats';
  var ENTITY      = 'หมวดหมู่';
  var API         = { list:'getCategories', del:'deleteCategory' };
  var COLS        = [
    { col:'id',   label:'รหัส' },
    { col:'Name', label:'ชื่อ' + 'หมวดหมู่' }
  ];
  var SEARCH_KEYS = ['id','Name'];

  var cache=[], editingId=null, deleteId=null, searchTimer=null;

  window.onload = function(){
    initDensity();
    document.getElementById('tbodyMain').innerHTML = skeletonRows(4,5);
    renderHead();
    loadTable();
  };

  XLF.bindHeaderClicks('#theadMain', function(){ return cache; }, renderRows);

  function renderHead(){
    document.getElementById('theadMain').innerHTML =
      '<tr><th class="text-center">#</th>' +
      XLF.th(COLS[0].label, TABLE_KEY, COLS[0].col) +
      XLF.th(COLS[1].label, TABLE_KEY, COLS[1].col) +
      '<th class="text-center col-sticky-right">จัดการ</th></tr>';
  }

  function loadTable(){
    document.getElementById('recordCount').innerText='กำลังโหลด';
    document.getElementById('tbodyMain').innerHTML = skeletonRows(4,5);
    callApi(API.list, [], function(data){
      cache = data || [];
      renderRows();
    }, function(err){
      document.getElementById('tbodyMain').innerHTML = emptyStateHtml(4,{
        icon:'⚠️', title:'โหลดข้อมูลไม่สำเร็จ', sub:JSON.stringify(err),
        actions:[{label:'ลองอีกครั้ง',primary:true,onclick:'loadTable()'}]
      });
      document.getElementById('recordCount').innerText='ผิดพลาด';
    });
  }

  function onSearch(){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(renderRows,150);
  }

  function renderRows(){
    renderHead();
    var q=document.getElementById('searchInput').value.toLowerCase().trim();
    var searched = !q ? cache.slice() : cache.filter(function(it){
      return SEARCH_KEYS.some(function(k){ return String(it[k]||'').toLowerCase().indexOf(q)>-1; });
    });

    var rows = XLF.apply(TABLE_KEY, searched, COLS);

    var labels={}; COLS.forEach(function(c){labels[c.col]=c.label;});
    var sum=document.getElementById('xlfSummary');
    if(XLF.anyActiveFilter(TABLE_KEY)){
      sum.classList.add('show');
      document.getElementById('xlfSummaryText').innerText='กรองอยู่ '+rows.length+' จาก '+cache.length+' รายการ — '+XLF.activeSummary(TABLE_KEY,labels);
    } else sum.classList.remove('show');

    document.getElementById('recordCount').innerText = cache.length + ' รายการ';
    document.getElementById('filterInfo').innerText = (q||XLF.anyActiveFilter(TABLE_KEY)) ? 'แสดง '+rows.length+' รายการ' : '';

    var tbody=document.getElementById('tbodyMain');
    if(!rows.length){
      tbody.innerHTML = cache.length
        ? emptyStateHtml(4,{ title:'ไม่พบรายการที่ตรงกับที่ค้นหา', sub:'ลองลดคำค้นหรือล้างตัวกรอง',
            actions:[{label:'ล้างตัวกรอง',onclick:'clearAllFilters()'},{label:'+ เพิ่ม'+ENTITY,primary:true,onclick:'openAddModal()'}] })
        : emptyStateHtml(4,{ icon:'📂', title:'ยังไม่มีข้อมูล'+ENTITY, sub:'เพิ่มรายการแรกเพื่อเริ่มใช้งาน',
            actions:[{label:'+ เพิ่ม'+ENTITY,primary:true,onclick:'openAddModal()'}] });
      return;
    }

    tbody.innerHTML = rows.map(function(it,i){
      return '<tr>'+
        '<td class="text-center"><span class="rownum">'+(i+1)+'</span></td>'+
        '<td><span class="chip-code">'+esc(it.id)+'</span></td>'+
        '<td style="font-weight:500;color:var(--ink)">'+esc(it.Name)+'</td>'+
        '<td class="text-center col-sticky-right"><span class="row-actions">'+
          '<button class="btn btn-icon edit" title="แก้ไข" onclick="openEditModal(\''+escJs(it.id)+'\')">✏️</button>'+
          '<button class="btn btn-icon del" title="ลบ" onclick="confirmDelete(\''+escJs(it.id)+'\')">🗑️</button>'+
        '</span></td>'+
      '</tr>';
    }).join('');
  }

  function clearAllFilters(){
    XLF.clearAll(TABLE_KEY);
    document.getElementById('searchInput').value='';
    renderRows();
  }

  /* ── เพิ่ม / แก้ไข ── */
  function clearErr(id){
    document.getElementById(id).classList.remove('is-invalid');
    document.getElementById('err_'+id).classList.remove('show');
  }

  function openAddModal(){
    editingId=null;
    document.getElementById('mainForm').reset();
    document.getElementById('fDocId').value='';
    document.getElementById('fName').value='';
    clearErr('fName');
    document.getElementById('modalTitle').innerText='📂 เพิ่ม'+ENTITY;
    document.getElementById('btnSave').innerHTML='💾 บันทึก';
    document.getElementById('modalAlert').className='modal-alert';
    openModal('editModal');
  }

  function openEditModal(id){
    var it=cache.find(function(x){return x.id===id;});
    if(!it){ toast('ไม่พบข้อมูล','err'); return; }
    editingId=id;
    document.getElementById('fDocId').value=it.id;
    document.getElementById('fName').value=it.Name||'';
    clearErr('fName');
    document.getElementById('modalTitle').innerText='✏️ แก้ไข'+ENTITY+' ('+id+')';
    document.getElementById('btnSave').innerHTML='💾 บันทึกการแก้ไข';
    document.getElementById('modalAlert').className='modal-alert';
    openModal('editModal');
  }

  function handleSubmit(e){
    e.preventDefault();
    var name=document.getElementById('fName').value.trim();
    var alertEl=document.getElementById('modalAlert');
    alertEl.className='modal-alert';

    if(!name){
      document.getElementById('fName').classList.add('is-invalid');
      document.getElementById('err_fName').classList.add('show');
      return;
    }

    var btn=document.getElementById('btnSave');
    btnBusy(btn);

    callApi('saveMasterData', ['Master_Categories','C', editingId||'', { Category_Name:name }, name], function(res){
      btnDone(btn);
      if(res && res.success){
        closeModal('editModal');
        toast((editingId?'แก้ไข':'เพิ่ม')+ENTITY+' “'+name+'” เรียบร้อย');
        loadTable();
        notifyParentRefreshDropdowns();
      } else {
        alertEl.className='modal-alert error';
        alertEl.innerText='❌ '+((res&&res.message)||'บันทึกไม่สำเร็จ');
      }
    }, function(err){
      btnDone(btn);
      alertEl.className='modal-alert error';
      alertEl.innerText='❌ '+JSON.stringify(err);
    });
  }

  /* ── ลบ ── */
  function confirmDelete(id){
    var it=cache.find(function(x){return x.id===id;});
    if(!it){ toast('ไม่พบข้อมูล','err'); return; }
    deleteId=id;
    document.getElementById('deleteTarget').innerHTML=
      '<div style="font-size:14px;font-weight:600;color:var(--ink)">'+esc(it.Name)+'</div>'+
      '<span class="chip-code" style="margin-top:5px">'+esc(it.id)+'</span>';
    var btn=document.getElementById('btnDelete');
    btnDone(btn); btn.innerHTML='🗑️ ลบข้อมูล';
    openModal('deleteModal');
  }

  function execDelete(){
    if(!deleteId) return;
    var btn=document.getElementById('btnDelete');
    btnBusy(btn,'กำลังลบ...');
    callApi(API.del,[deleteId],function(res){
      btnDone(btn);
      closeModal('deleteModal');
      if(res && res.success){
        toast('ลบ'+ENTITY+'เรียบร้อย');
        loadTable();
        notifyParentRefreshDropdowns();
      } else {
        swyError('ลบไม่สำเร็จ',(res&&res.message)||'');
      }
      deleteId=null;
    },function(err){
      btnDone(btn); closeModal('deleteModal');
      swyError('เกิดข้อผิดพลาด',esc(JSON.stringify(err)));
    });
  }
</script>
</body>
</html>
